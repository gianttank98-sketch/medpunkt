<style>
  /* Спокойная палитра: мягкий серо-зелёный фон, приглушённый сине-бирюзовый акцент, цвета статусов без «кислотности».
     Тема: авто (как в телефоне) / светлая / тёмная — ⚙️ Настройки. */
  :root {
    --bg: #f1f3f2; --card: #ffffff; --ink: #1e2a32; --sub: #5f6c75; --line: #e0e5e7; --soft: #edf1f1;
    --brand: #2c6a8a; --brand-ink: #ffffff; --brand-soft: #e2edf2;
    --red: #b23b34; --red-soft: #f8e8e6; --amber: #9a6512; --amber-soft: #faf0dc; --green: #2d7548; --green-soft: #e4f1e8;
    --orange: #b0561c; --orange-soft: #f8eadf;
    --radius: 12px; --shadow: 0 1px 2px rgba(20, 30, 40, .05);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121719; --card: #1a2125; --ink: #e2e7ea; --sub: #97a3ab; --line: #2a3338; --soft: #20292d;
      --brand: #7db0cc; --brand-ink: #0c1518; --brand-soft: #1c2d36;
      --red: #ec8a80; --red-soft: #3a2220; --amber: #e2b061; --amber-soft: #352a17; --green: #82c79a; --green-soft: #1b3125;
      --orange: #e9a173; --orange-soft: #36261b;
      --shadow: none; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121719; --card: #1a2125; --ink: #e2e7ea; --sub: #97a3ab; --line: #2a3338; --soft: #20292d;
    --brand: #7db0cc; --brand-ink: #0c1518; --brand-soft: #1c2d36;
    --red: #ec8a80; --red-soft: #3a2220; --amber: #e2b061; --amber-soft: #352a17; --green: #82c79a; --green-soft: #1b3125;
    --orange: #e9a173; --orange-soft: #36261b;
    --shadow: none; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; -webkit-font-smoothing: antialiased; }
  body { padding-bottom: 76px; }
  button, input, select, textarea { font: inherit; color: inherit; }
  button { cursor: pointer; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 12px; }
  .hidden { display: none !important; }

  header.top { position: sticky; top: 0; z-index: 20; background: var(--card); border-bottom: 1px solid var(--line); }
  header.top .wrap { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 8px 12px; }
  .app-title { font-weight: 700; font-size: 16px; margin-right: auto; display: flex; align-items: center; gap: 8px; }
  .pill { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; font-size: 12px; font-weight: 600; background: var(--soft); color: var(--sub); border: 0; }
  .pill.ok { background: var(--green-soft); color: var(--green); }
  .pill.off { background: var(--amber-soft); color: var(--amber); }
  input.warn-field { border-color: var(--amber) !important; background: var(--amber-soft); }
  .pill.bad { background: var(--red-soft); color: var(--red); }
  .hdr-ctrl { display: flex; gap: 6px; align-items: center; }
  .hdr-ctrl select, .seg button { height: 34px; border: 1px solid var(--line); background: var(--card); border-radius: 8px; padding: 0 8px; font-size: 13px; }
  .seg { display: inline-flex; }
  .seg button { border-radius: 0; font-weight: 600; }
  .seg button:first-child { border-radius: 8px 0 0 8px; }
  .seg button:last-child { border-radius: 0 8px 8px 0; border-left: 0; }
  .seg button.on { background: var(--ink); color: var(--card); border-color: var(--ink); }
  .admin-btn { white-space: nowrap; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); padding: 0 10px; font-size: 13px; font-weight: 600; }
  .admin-btn.on { background: var(--green-soft); color: var(--green); border-color: var(--green); }

  .banner { margin: 10px 0 0; padding: 10px 12px; border-radius: var(--radius); font-size: 13.5px; display: flex; gap: 8px; align-items: center; justify-content: space-between; }
  .banner.warn { background: var(--amber-soft); color: var(--amber); }
  .banner.bad { background: var(--red-soft); color: var(--red); }
  .banner button { border: 0; background: transparent; color: inherit; font-weight: 700; text-decoration: underline; }

  nav.bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--card); border-top: 1px solid var(--line); }
  nav.bottom .wrap { display: flex; gap: 4px; padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); }
  nav.bottom button { flex: 1; border: 0; background: transparent; padding: 6px 2px; border-radius: 10px; font-size: 12px; font-weight: 600; color: var(--sub); display: flex; flex-direction: column; align-items: center; gap: 2px; }
  nav.bottom button .ic { font-size: 20px; line-height: 1; }
  nav.bottom button.on { color: var(--brand); background: var(--brand-soft); }

  main { padding: 12px 0 8px; }
  h2.scr { font-size: 18px; margin: 4px 0 10px; }
  .card { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px; margin-bottom: 10px; border: 1px solid var(--line); }
  .muted { color: var(--sub); font-size: 13px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .row.wrap { flex-wrap: wrap; }
  .grow { flex: 1; min-width: 0; }

  .field { margin-bottom: 10px; position: relative; }
  .field > label, .lbl { display: block; font-size: 12.5px; font-weight: 600; color: var(--sub); margin-bottom: 4px; }
  input[type=text], input[type=number], input[type=password], input[type=search], input[type=date], select, textarea {
    width: 100%; min-height: 44px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); font-size: 15px;
  }
  textarea { min-height: 64px; resize: vertical; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--brand); outline-offset: 0; border-color: var(--brand); }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 10px; }
  .grid3 { display: grid; grid-template-columns: 1fr 1fr 1.2fr; gap: 0 8px; }
  @media (max-width: 420px) { .grid2.stack { grid-template-columns: 1fr; } }
  .check { display: flex; gap: 8px; align-items: center; font-size: 14px; margin: 4px 0 10px; }
  .check input { width: 20px; height: 20px; }

  .btn { min-height: 44px; border: 0; border-radius: 10px; padding: 0 16px; font-weight: 700; font-size: 15px; background: var(--soft); color: var(--ink); }
  .btn.primary { background: var(--brand); color: var(--brand-ink); }
  .btn.danger { background: var(--red); color: #fff; }
  .btn.ghost { background: transparent; border: 1px solid var(--line); }
  .btn.small { min-height: 36px; padding: 0 10px; font-size: 13px; border-radius: 9px; white-space: nowrap; }
  .btn.block { width: 100%; }
  .btn.icon { padding: 0 12px; }

  .seg-wide { display: flex; background: var(--soft); border-radius: 10px; padding: 3px; gap: 3px; margin-bottom: 12px; }
  .seg-wide button { flex: 1; min-height: 40px; border: 0; border-radius: 8px; background: transparent; font-weight: 700; font-size: 14px; color: var(--sub); }
  .seg-wide button.on { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }

  .chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 8px; scrollbar-width: none; }
  .chip { flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 600; white-space: nowrap; }
  .chip.on { background: var(--ink); color: var(--card); border-color: var(--ink); }

  .searchbar { display: flex; gap: 8px; margin-bottom: 8px; }
  .searchbar input { flex: 1; }

  /* Подсказки при вводе */
  .suggest { position: absolute; left: 0; right: 0; top: 100%; z-index: 30; background: var(--card); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0,0,0,.14); max-height: min(320px, 45vh); overflow-y: auto; margin-top: 4px; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; touch-action: pan-y; }
  .sg-head { font-size: 12px; color: var(--sub); padding: 8px 12px 4px; }
  .sg { display: flex; gap: 8px; align-items: baseline; padding: 9px 12px; border-top: 1px solid var(--soft); cursor: pointer; }
  .sg:hover, .sg:active { background: var(--brand-soft); }
  .sg .t { font-weight: 600; }
  .sg .s { font-size: 12.5px; color: var(--sub); }
  .tag { display: inline-block; font-size: 11px; font-weight: 700; padding: 1px 6px; border-radius: 5px; background: var(--soft); color: var(--sub); white-space: nowrap; }
  .tag.base { background: var(--green-soft); color: var(--green); }
  .tag.brand { background: var(--brand-soft); color: var(--brand); }
  .tag.red { background: var(--red-soft); color: var(--red); }
  .tag.amber { background: var(--amber-soft); color: var(--amber); }
  .tag.orange { background: var(--orange-soft); color: var(--orange); }
  .tag.green { background: var(--green-soft); color: var(--green); }
  .info { background: var(--brand-soft); color: var(--ink); border-radius: 10px; padding: 8px 10px; font-size: 13px; margin: -4px 0 10px; }
  .note { font-size: 12.5px; color: var(--sub); margin: -6px 0 10px; }
  .note.fix { color: var(--green); font-weight: 600; }

  /* Группы по МНН */
  .grp { background: var(--card); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); margin-bottom: 10px; overflow: hidden; }
  .grp-h { padding: 10px 12px; background: var(--soft); display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .grp-h .t { font-weight: 700; }
  .grp-h .s { font-size: 12.5px; color: var(--sub); white-space: nowrap; }
  .brand-row { padding: 10px 12px 4px; display: flex; gap: 10px; align-items: flex-start; border-top: 1px solid var(--line); }
  .brand-row:first-of-type { border-top: 0; }
  .brand-row .nm { font-weight: 700; }
  .brand-row .fd { font-size: 13px; color: var(--sub); }
  .thumb { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: var(--soft); flex: none; }
  .lots { padding: 0 12px 10px; }
  .lot { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; padding: 8px 10px; border-radius: 10px; background: var(--bg); margin-top: 6px; border-left: 4px solid var(--green); }
  .lot.soon { border-left-color: var(--amber); background: var(--amber-soft); }
  .lot.expired { border-left-color: var(--red); background: var(--red-soft); }
  .lot .loc { font-weight: 600; font-size: 14px; }
  .lot .meta { font-size: 12.5px; color: var(--sub); display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
  .lot .qty { text-align: right; font-size: 13px; color: var(--sub); white-space: nowrap; }
  .lot .qty b { font-size: 18px; color: var(--ink); }
  .lot .btns { grid-column: 1 / -1; display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .lot .btns .btn { min-height: 38px; }
  .zero { padding: 0 12px 10px; font-size: 13px; color: var(--red); font-weight: 600; }
  .hint { font-size: 12.5px; padding: 6px 10px; border-radius: 8px; background: var(--orange-soft); color: var(--orange); margin: 6px 12px 0; display: flex; gap: 8px; justify-content: space-between; align-items: center; }
  .stat { font-size: 12.5px; color: var(--sub); padding: 0 12px; }
  .more-btn { border: 0; background: transparent; font-size: 20px; padding: 0 6px; color: var(--sub); }

  .list-row { padding: 8px 0; border-top: 1px solid var(--line); font-size: 13.5px; display: flex; gap: 8px; justify-content: space-between; align-items: center; }
  .list-row:first-child { border-top: 0; }
  .rep-row { padding: 9px 0; border-top: 1px solid var(--line); font-size: 13.5px; }
  .rep-row:first-child { border-top: 0; }
  .rep-row .t { font-weight: 600; }
  .rep-row .s { color: var(--sub); font-size: 12.5px; }
  .empty { text-align: center; color: var(--sub); padding: 18px 8px; font-size: 14px; }

  /* Модальное окно */
  .modal-bg { position: fixed; inset: 0; background: rgba(10, 15, 25, .55); z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
  .modal { background: var(--card); width: 100%; max-width: 620px; max-height: 92vh; overflow-y: auto; border-radius: 16px 16px 0 0; padding: 16px 14px calc(16px + env(safe-area-inset-bottom)); }
  @media (min-width: 680px) { .modal-bg { align-items: center; } .modal { border-radius: 16px; } }
  .modal h3 { margin: 0 0 12px; font-size: 17px; }
  .modal .acts { display: flex; gap: 8px; justify-content: flex-end; margin-top: 14px; flex-wrap: wrap; }
  .sum { background: var(--soft); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
  .sum div { padding: 2px 0; }
  .radio { display: flex; gap: 8px; margin-bottom: 10px; }
  .radio label { flex: 1; border: 1px solid var(--line); border-radius: 10px; padding: 10px; font-weight: 600; text-align: center; font-size: 14px; }
  .radio input { display: none; }
  .radio input:checked + span { color: var(--brand); }
  .radio label:has(input:checked) { border-color: var(--brand); background: var(--brand-soft); }

  /* Всплывающие сообщения */
  #toasts { position: fixed; left: 0; right: 0; bottom: 82px; z-index: 60; display: flex; flex-direction: column; align-items: center; gap: 6px; pointer-events: none; padding: 0 12px; }
  .toast { pointer-events: auto; max-width: 560px; width: 100%; background: var(--ink); color: var(--card); border-radius: 12px; padding: 9px 12px; font-size: 13.5px; display: flex; gap: 10px; align-items: center; justify-content: space-between; box-shadow: 0 6px 20px rgba(0,0,0,.25); }
  .toast.bad { background: var(--red); color: #fff; }
  .toast button { border: 0; background: transparent; color: inherit; font-weight: 800; text-decoration: underline; flex: none; }

  .qr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .qr-card { border: 1px solid #000; border-radius: 8px; padding: 8px; text-align: center; background: #fff; color: #000; font-size: 12px; font-weight: 700; break-inside: avoid; }
  .qr-card svg, .qr-card img { width: 120px; height: 120px; display: block; margin: 0 auto 6px; }

  /* v4 */
  body.logged-out nav.bottom, body.logged-out #storeBtn, body.logged-out #userBtn, body.logged-out #netPill { display: none !important; }
  .store-btn { max-width: 46vw; overflow: hidden; text-overflow: ellipsis; }
  .login-card { max-width: 420px; margin: 24px auto; }
  .login-logo { font-size: 44px; text-align: center; }
  .store-pick { display: flex; justify-content: space-between; align-items: center; gap: 8px; margin-bottom: 8px; text-align: left; }
  .store-pick.on { border-color: var(--brand); background: var(--brand-soft); }
  .col-btns .btn { margin-bottom: 8px; }
  .grp.off { opacity: .6; }
  .grant { font-size: 13px; padding: 3px 0; }
  .grant.expired { opacity: .6; text-decoration: line-through; }
  .perm-grid { display: grid; grid-template-columns: 1fr; gap: 0; margin-bottom: 6px; }
  @media (min-width: 520px) { .perm-grid { grid-template-columns: 1fr 1fr; } }
  .perm-grid .check { align-items: flex-start; margin: 4px 0; }
  .rep-row.susp.high { border-left: 4px solid #d03b3b; padding-left: 8px; }
  .rep-row.susp.mid { border-left: 4px solid #fab219; padding-left: 8px; }
  .rep-row.susp.info { border-left: 4px solid var(--line); padding-left: 8px; }
  .lot .tag.series-hit { background: var(--brand); color: var(--brand-ink); }
  /* v3 */
  .visit-bar { display: flex; gap: 8px; margin-bottom: 8px; }
  .visit-bar input { flex: 1; }
  .visit-bar input:not(:placeholder-shown) { border-color: var(--brand); background: var(--brand-soft); font-weight: 600; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; margin-bottom: 12px; }
  .tile { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; background: var(--card); }
  .tile.crit { border-left: 4px solid #d03b3b; } .tile.warn { border-left: 4px solid #fab219; } .tile.good { border-left: 4px solid #0ca30c; }
  .tile .tv { font-size: 24px; font-weight: 700; line-height: 1.15; }
  .tile .tl { font-size: 12.5px; color: var(--sub); margin-top: 2px; }
  .chart { margin: 4px 0 16px; }
  .ch-t { font-weight: 700; font-size: 14px; margin-bottom: 8px; }
  svg.viz { display: block; max-width: 100%; height: auto; overflow: visible; }
  .viz-tip { position: fixed; z-index: 70; pointer-events: none; background: var(--ink); color: var(--card); font-size: 12.5px; padding: 6px 9px; border-radius: 8px; max-width: 260px; box-shadow: 0 4px 14px rgba(0,0,0,.2); }
  .rep-body .mrow { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 12.5px; color: var(--sub); margin-top: 2px; }
  .rep-body .mrow b { color: var(--ink); }
  .pbar { height: 8px; border-radius: 4px; background: var(--soft); margin-top: 8px; overflow: hidden; }
  .pbar i { display: block; height: 100%; background: var(--green); border-radius: 4px; }
  .lot.rv .rv-row { align-items: center; flex-wrap: nowrap; }
  .lot.rv .rv-st .tag { white-space: normal; }
  .rv-in { width: 92px !important; min-height: 40px !important; text-align: center; font-weight: 700; }
  .lot.rv.done { box-shadow: inset 0 0 0 2px var(--green-soft); }
  .rv-st { margin-right: auto; }
  details.kit { margin: 8px 12px 0; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
  details.kit summary { padding: 9px 10px; display: flex; gap: 8px; align-items: center; font-weight: 600; font-size: 14px; cursor: pointer; list-style: none; }
  details.kit summary::-webkit-details-marker { display: none; }
  .kit-body { padding: 0 10px 10px; }
  .kit-sec { font-size: 12px; font-weight: 700; color: var(--sub); margin: 10px 0 4px; text-transform: uppercase; letter-spacing: .3px; }
  .kit-row { display: flex; gap: 6px; align-items: center; font-size: 13.5px; padding: 4px 0; border-top: 1px solid var(--soft); }
  .kit-row.short b { color: var(--orange); }
  .bad-row { background: var(--red-soft); border-radius: 8px; padding-left: 6px; padding-right: 6px; }
  .grp.inc { border-color: var(--amber); }
  .report-any { margin: 4px 0 12px; }
  .rep-acts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .rep-acts .btn { overflow: hidden; text-overflow: ellipsis; }
  /* v5: формы пациентов */
  input[type=datetime-local], input[type=time] { width: 100%; min-height: 44px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 10px; background: var(--card); font-size: 15px; }
  .f-card { display: block; width: 100%; text-align: left; font: inherit; color: inherit; cursor: pointer; }
  .f-card .f-pt { font-weight: 600; margin: 4px 0 2px; }
  .f-noblank { color: var(--red); }
  .f-bad { border-color: var(--red) !important; background: var(--red-soft) !important; }
  .f-alert { background: var(--red-soft); color: var(--red); font-weight: 700; border-radius: 10px; padding: 8px 10px; margin: 8px 0 0; font-size: 14px; }
  input.f-allergy { border-color: var(--red); color: var(--red); font-weight: 700; }
  .f-fs { border: 0; padding: 0; margin: 0; min-width: 0; }
  .f-fs:disabled .chip, .f-fs:disabled .f-outb { opacity: .85; }
  details.f-sec > summary { font-weight: 700; font-size: 15px; cursor: pointer; list-style: none; padding: 2px 0; }
  details.f-sec > summary::-webkit-details-marker { display: none; }
  details.f-sec > summary::before { content: '▸ '; color: var(--sub); }
  details.f-sec[open] > summary::before { content: '▾ '; }
  .f-body { margin-top: 10px; }
  .f-chips { flex-wrap: wrap; overflow: visible; }
  .chip.tri-green.on { background: #0ca30c; border-color: #0ca30c; color: #fff; } .chip.tri-yellow.on { background: #fab219; border-color: #fab219; color: #111; }
  .chip.tri-red.on { background: #d03b3b; border-color: #d03b3b; color: #fff; } .chip.tri-black.on { background: #111; border-color: #111; color: #fff; }
  .f-vit { border: 1px solid var(--line); border-radius: 10px; padding: 8px; margin-bottom: 8px; background: var(--bg); }
  .f-vgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 6px 10px; margin-top: 6px; }
  .f-vgrid label { font-size: 12px; color: var(--sub); font-weight: 600; display: flex; flex-direction: column; gap: 2px; }
  .f-vgrid label span { display: flex; gap: 4px; align-items: center; color: var(--ink); }

    // возвращается только то, что реально списали (при «больше, чем по учёту» — меньше запрошенного)
    const back = m ? (typeof m.spent === 'number' ? m.spent : m.qty) : 0;
    const lot = m && v.lots.find(l => l.id === m.lotId);
    if (lot) lot.qty += back;
    else if (m && back > 0) { const it = v.items.find(i => i.id === m.itemId); if (it) v.lots.push({ id: m.lotId, itemId: m.itemId, series: m.series || '', expiry: m.expiry || '', locationId: m.locationId, qty: back }); }
  } else if (op.action === 'receive' || op.action === 'opening') {
    // только в отчёт: остаток не меняется (решение — как его запомнили при сохранении)
    if (op.action === 'receive' && (op.meta && 'noStock' in op.meta ? op.meta.noStock : op.meta && 'hist' in op.meta ? op.meta.hist : rcvNoStock(p))) return;
    const key = itemKey(p.item.name, p.item.form, p.item.dosage);
    let it = v.items.find(i => itemKey(i.name, i.form, i.dosage) === key);
    if (!it) {
      it = Object.assign({ id: 'tmp_' + op.opId, minTotal: 0, hasThumb: false, pharmGroup: '', subGroup: '', specialty: '' }, p.item);
      delete it.thumb;
      v.items.push(it);
    }
    if (op.action === 'opening') {
      const d = p.asOf || bakuToday();
      if (!it.openFirst || d < it.openFirst) it.openFirst = d;
      if (!it.openLast || d > it.openLast) it.openLast = d;
    }
    const s = normSeries(p.series), e = p.noExpiry ? '' : p.expiry;
    let lot = v.lots.find(l => l.itemId === it.id && normSeries(l.series) === s && l.expiry === e && l.locationId === p.locationId);
    if (lot) lot.qty += p.qty;
    else v.lots.push({ id: 'tmp_' + op.opId, itemId: it.id, series: s, expiry: e, locationId: p.locationId, qty: p.qty });
  } else if (op.action === 'restock') {
    const src = v.lots.find(l => l.id === p.lotId);
    if (src) {
      const q = Math.min(src.qty, p.qty);
      src.qty -= q;
      const dst = v.lots.find(l => l.itemId === src.itemId && normSeries(l.series) === normSeries(src.series) && l.expiry === src.expiry && l.locationId === p.toLocationId);
      if (dst) dst.qty += q; else v.lots.push({ id: 'tmp_' + op.opId, itemId: src.itemId, series: src.series, expiry: src.expiry, locationId: p.toLocationId, qty: q });
    }
  } else if (op.action === 'witnessAnswer') {
    v.confirms = (v.confirms || []).filter(c => c.id !== p.id);
  } else if (op.action === 'request') {
    v.requests.push({ id: 'tmp_' + op.opId, time: '', doctorId: p.doctorId, doctorName: '', category: p.category, form: p.form, name: p.name, dosage: p.dosage, qty: p.qty, note: p.note });
  }
}

async function bootstrap() {

async function refreshState(force) {

/* =====================================================================
 * Справочник препаратов
 * ===================================================================== */
async function loadReference() {
  const cached = LS.get('MED2_REF', null);
  const want = S.base && S.base.refVersion;
  if (cached && (!want || cached.version === want)) { buildRefIdx(cached); return; }
  if (!S.gas || S.loadingRef) { if (cached) buildRefIdx(cached); return; }
  S.loadingRef = true;
  try {
    const r = await rpc('reference');
    if (r.ok) {
      const ref = { version: r.version, rows: r.rows };
      if (!LS.set('MED2_REF', ref)) LS.del('MED2_REF');
      buildRefIdx(ref);
      renderAll();
    }
  } catch (e) { if (cached) buildRefIdx(cached); }
  finally { S.loadingRef = false; }
}
function buildRefIdx(ref) {
  if (!ref || !ref.rows) { S.ref = null; S.refIdx = null; return; }
  S.ref = ref;
  const subs = [], brands = [], bySubN = {}, bySubSk = {}, byBrandSk = {};
  ref.rows.forEach(r => {
    const o = { s: r[0], g: r[2], sg: r[3], rf: r[4], sp: r[5], sk: skel(r[0]), q: qkey(r[0]), brands: String(r[1] || '').split(';').map(x => x.trim()).filter(Boolean) };
    subs.push(o);
    bySubN[normText(o.s)] = o;
    bySubSk[o.sk] = bySubSk[o.sk] || o;
    o.brands.forEach(b => {
      const bo = { b, sub: o, sk: skel(b), q: qkey(b) };
      brands.push(bo);
      (byBrandSk[bo.sk] = byBrandSk[bo.sk] || []).push(bo);
    });
  });
  S.refIdx = { subs, brands, bySubN, bySubSk, byBrandSk };
}
/** МНН для названия: по фирме из справочника или если само название — МНН. */
function refSubOf(name) {
  if (!S.refIdx || !name) return null;
  const sk = skel(name);
  const b = S.refIdx.byBrandSk[sk];
  if (b && b.length) return b[0].sub;
  return S.refIdx.bySubSk[sk] || S.refIdx.bySubN[normText(name)] || null;
}
function refBySubstance(s) { return S.refIdx && s ? (S.refIdx.bySubN[normText(s)] || S.refIdx.bySubSk[skel(s)] || null) : null; }

/** Подсказки для поля названия: карточки из базы, фирмы и МНН из справочника. */
/** «Лидокаин 2%», «Магнезия 25% 5 мл» — для поиска названия доза не нужна. */
function qName(q) { const b = String(q || '').replace(/\s+\d.*$/, '').trim(); return b.length >= 2 ? b : q; }
function nameSuggestions(q, cat) {
  const qs = qk(qName(q));
  if (!qs) return { list: [], fuzzy: false };
  if (qs.length <= 2) return shortSuggestions(qs, cat, false);
  const out = [];
  const add = (o, sc) => { if (sc > 0) { o.sc = sc; out.push(o); } };
  (S.view.items || []).filter(i => i.category === cat).forEach(i => {
    add({ kind: 'item', label: i.name, sub: formName(i.form) + ' · ' + i.dosage + (i.substance ? ' · ' + i.substance : ''), item: i, pri: 3 },
      Math.max(score(qs, qk(i.name), false), i.substance ? score(qs, qk(i.substance), false) - 5 : 0));
  });
  if (cat === 'med' && S.refIdx) {
    S.refIdx.brands.forEach(b => add({ kind: 'brand', label: b.b, sub: t('innTag') + ': ' + b.sub.s, bo: b, pri: 2 }, score(qs, b.q, false)));
    S.refIdx.subs.forEach(s => add({ kind: 'sub', label: s.s, sub: t('brandsCount', { n: s.brands.length }), so: s, pri: 1 }, score(qs, s.q, false)));
  }
  if (cat === 'med') catSuggest(qs, false, false).forEach(o => out.push(o)); // все препараты, зарегистрированные в АР
  if (cat === 'sup') supSuggest(qs, false, false, q).forEach(o => out.push(o)); // расходники: виды и размеры
  let fuzzy = false;
  if (!out.some(o => o.sc >= 50)) {
    fuzzy = true;
    out.length = 0;
    (S.view.items || []).filter(i => i.category === cat).forEach(i => add({ kind: 'item', label: i.name, sub: formName(i.form) + ' · ' + i.dosage, item: i, pri: 3 }, score(qs, qk(i.name), true)));
    if (cat === 'med' && S.refIdx) {
      S.refIdx.brands.forEach(b => add({ kind: 'brand', label: b.b, sub: t('innTag') + ': ' + b.sub.s, bo: b, pri: 2 }, score(qs, b.q, true)));
      S.refIdx.subs.forEach(s => add({ kind: 'sub', label: s.s, sub: t('brandsCount', { n: s.brands.length }), so: s, pri: 1 }, score(qs, s.q, true)));
    }
    if (cat === 'med') catSuggest(qs, true, false).forEach(o => out.push(o));
    if (cat === 'sup') supSuggest(qs, true, false, q).forEach(o => out.push(o));
  }
  out.sort((a, b) => b.sc - a.sc || b.pri - a.pri || a.label.localeCompare(b.label));
  const seen = {};
  return { list: out.filter(o => { const k = o.kind + '|' + o.label + '|' + (o.item ? o.item.id : ''); if (seen[k]) return false; seen[k] = 1; return true; }).slice(0, 12), fuzzy };
}
/** С первой буквы — как в поисковике: всё, что начинается с этих букв, по алфавиту. Сначала то, что уже есть в базе, потом МНН, потом фирмы. */
function shortSuggestions(qs, cat, subsOnly) {
  const out = [];
  if (!subsOnly) (S.view.items || []).filter(i => i.category === cat && (qk(i.name).startsWith(qs) || (i.substance && qk(i.substance).startsWith(qs))))
    .forEach(i => out.push({ kind: 'item', label: i.name, sub: formName(i.form) + ' · ' + i.dosage + (i.substance ? ' · ' + i.substance : ''), item: i, pri: 3 }));
  if (cat === 'med' && S.refIdx) {
    S.refIdx.subs.forEach(s => { if (s.q.startsWith(qs)) out.push({ kind: 'sub', label: s.s, sub: t('brandsCount', { n: s.brands.length }), so: s, pri: 2 }); });
    if (!subsOnly) S.refIdx.brands.forEach(b => { if (b.q.startsWith(qs)) out.push({ kind: 'brand', label: b.b, sub: t('innTag') + ': ' + b.sub.s, bo: b, pri: 1 }); });
  }
  if (cat === 'med' && !subsOnly) catSuggest(qs, false, true).forEach(o => out.push(o));
  if (cat === 'sup' && !subsOnly) supSuggest(qs, false, true).forEach(o => out.push(o));
  out.sort((a, b) => b.pri - a.pri || a.label.localeCompare(b.label, 'ru'));
  const seen = {};
  return { list: out.filter(o => { const k = o.kind + '|' + o.label + '|' + (o.item ? o.item.id : ''); if (seen[k]) return false; seen[k] = 1; return true; }).slice(0, 40), fuzzy: false };
}
function subSuggestions(q) {
  const qs = qk(q);
  if (!S.refIdx || !qs) return { list: [], fuzzy: false };
  if (qs.length <= 2) return shortSuggestions(qs, 'med', true);
  let list = S.refIdx.subs.map(s => ({ kind: 'sub', label: s.s, sub: t('brandsCount', { n: s.brands.length }), so: s, sc: score(qs, s.q, false) })).filter(o => o.sc > 0);
  let fuzzy = false;
  if (!list.length) { fuzzy = true; list = S.refIdx.subs.map(s => ({ kind: 'sub', label: s.s, sub: '', so: s, sc: score(qs, s.q, true) })).filter(o => o.sc > 0); }
  list.sort((a, b) => b.sc - a.sc || a.label.localeCompare(b.label));
  return { list: list.slice(0, 10), fuzzy };
}

/** Выпадающий список подсказок под полем ввода. */
function attachSuggest(input, provider, onPick) {
  const box = document.createElement('div');
  box.className = 'suggest hidden';
  input.parentNode.appendChild(box);
  let items = [], timer = null;
  const hide = () => box.classList.add('hidden');
  const show = () => {
    if (document.activeElement !== input) { hide(); return; } // палец уже ушёл с поля — не открываем список заново
    const res = provider(input.value);
    items = res.list;
    if (!items.length) { hide(); return; }
    box.innerHTML = (res.fuzzy ? '<div class="sg-head">' + esc(t('didYouMean')) + '</div>' : '') + items.map((o, i) => {
      const tag = o.kind === 'item' ? '<span class="tag base">' + esc(t('inBase')) + '</span>' : o.kind === 'cat' ? '<span class="tag">' + esc(t('catTag')) + '</span>' : o.kind === 'sup' ? '<span class="tag">' + esc(t('supTag')) + '</span>' : o.kind === 'dev' ? '<span class="tag">' + esc(t('devTag')) + '</span>' : (o.kind === 'brand' ? '<span class="tag brand">' + esc(t('brandTag')) + '</span>' : '<span class="tag">' + esc(t('innTag')) + '</span>');
      const lab = o.kind === 'sub' || o.kind === 'inn' ? subWithAlt(o.label) : o.kind === 'sup' ? o.label + ' (' + o.se.az + ')' : o.kind === 'dev' ? o.label : (o.kind === 'item' ? nameWithAlt(o.label, o.item && o.item.substance) : nameWithAlt(o.label));
      return '<div class="sg" data-i="' + i + '"><div class="grow"><div class="t">' + esc(lab) + '</div>' + (o.sub ? '<div class="s">' + esc(o.sub) + '</div>' : '') + '</div>' + tag + '</div>';
    }).join('');
    box.classList.remove('hidden');
  };
  input.addEventListener('input', () => { clearTimeout(timer); timer = setTimeout(show, 120); });
  input.addEventListener('focus', () => { if (input.value.trim().length >= 1) show(); });
  // Пальцем список можно листать: выбор — только короткое касание без сдвига (сдвиг > 10 px = прокрутка).
  let touch = null, inBox = false;
  input.addEventListener('blur', () => setTimeout(() => { if (!inBox) hide(); }, 180));
  box.addEventListener('pointerdown', e => {
    inBox = true;
    if (e.pointerType === 'mouse') e.preventDefault(); // мышь: поле не теряет фокус
    const el = e.target.closest('.sg');
    touch = el ? { el, x: e.clientX, y: e.clientY, st: box.scrollTop } : null;
  });
  box.addEventListener('pointermove', e => { if (touch && (Math.abs(e.clientX - touch.x) > 10 || Math.abs(e.clientY - touch.y) > 10)) touch = null; });
  box.addEventListener('scroll', () => { if (touch && Math.abs(box.scrollTop - touch.st) > 4) touch = null; }, { passive: true });
  box.addEventListener('pointercancel', () => { touch = null; inBox = false; });
  box.addEventListener('pointerup', e => {
    const tc = touch;
    touch = null;
    setTimeout(() => { inBox = false; }, 250);
    if (!tc || e.target.closest('.sg') !== tc.el) return;
    e.preventDefault();
    const o = items[+tc.el.dataset.i];
    hide();
    onPick(o);
  });
  // касание мимо поля и списка — закрыть
  document.addEventListener('pointerdown', e => { if (!box.classList.contains('hidden') && e.target !== input && !box.contains(e.target)) hide(); }, true);
  return { hide };
}

/* =====================================================================
 * Поиск по складу и группировка по МНН
 * ===================================================================== */
function groupKeyOf(item) {
  if (item.category === 'sup') return { key: 'sup|' + item.form, title: formName(item.form), isSub: false };
  const s = item.substance || (refSubOf(item.name) || {}).s;
  if (s) return { key: 'sub|' + skel(s), title: s, isSub: true };
  return { key: 'name|' + skel(item.name), title: item.name, isSub: false };
}
/** Какие позиции подходят к запросу: по названию, МНН (в т.ч. через фирмы из справочника), штрихкоду, группе, месту. */
function matchItems(q) {
  const qs = qk(q), qn = normText(q), digits = q.replace(/\D/g, '');
  if (!qs && !qn) return null;
  const subHit = {};
  if (S.refIdx && qs.length >= 2) {
    S.refIdx.subs.forEach(s => { if (score(qs, s.q, false) >= 50) subHit[s.sk] = 1; });
    S.refIdx.brands.forEach(b => { if (score(qs, b.q, false) >= 50) subHit[b.sub.sk] = 1; });
  }
  const res = {};
  S.view.items.forEach(i => {
    const gs = skel(groupKeyOf(i).title);
    let ok = score(qs, qk(i.name), false) >= 50 || (i.substance && score(qs, qk(i.substance), false) >= 50) || subHit[gs];
    if (!ok && digits.length >= 6 && i.barcode && i.barcode === digits) ok = true;
    if (!ok && qn.length >= 3 && ((i.pharmGroup || '').toLowerCase().indexOf(qn) !== -1 || (i.subGroup || '').toLowerCase().indexOf(qn) !== -1)) ok = true;
    if (ok) res[i.id] = 'item';
  });
  // серия (цифры на ампуле/коробке): находим партию, даже если название не совпало
  const sq = normSeries(q);
  const series = {};
  if (sq.length >= 3 && /\d/.test(sq)) S.view.lots.forEach(l => { if (l.series && normSeries(l.series).indexOf(sq) !== -1) { res[l.itemId] = res[l.itemId] || 'series'; series[l.id] = 1; } });
  S.seriesHit = series;
  return { items: res, qn, qs };
}
function lotStatus(l) {
  const d = daysTo(l.expiry);
  if (d === null) return { cls: '', d };
  if (d < 0) return { cls: 'expired', d };
  if (d <= 30) return { cls: 'soon', d };
  return { cls: '', d };
}
function buildGroups(itemFilter, lotFilter, includeEmpty) {
  const groups = {};
  S.view.items.forEach(item => {
    if (itemFilter && !itemFilter(item)) return;
    const lots = S.view.lots.filter(l => l.itemId === item.id && (!lotFilter || lotFilter(l, item)));
    if (!lots.length && !includeEmpty) return;
    const g = groupKeyOf(item);
    const grp = groups[g.key] || (groups[g.key] = { key: g.key, title: g.title, isSub: g.isSub, brands: [], total: 0 });
    lots.sort((a, b) => (a.expiry || '9999') .localeCompare(b.expiry || '9999') || ((locById(a.locationId) || {}).sort || 0) - ((locById(b.locationId) || {}).sort || 0));
    const total = lots.reduce((s, l) => s + l.qty, 0);
    grp.brands.push({ item, lots, total });
    grp.total += total;
  });
  return Object.values(groups).sort((a, b) => a.title.localeCompare(b.title, 'ru')).map(g => {
    g.brands.sort((a, b) => a.item.name.localeCompare(b.item.name, 'ru') || a.item.dosage.localeCompare(b.item.dosage));
    return g;
  });
}
function expMeta(l) {
  const st = lotStatus(l);
  let tag = '';
  if (st.cls === 'expired') tag = '<span class="tag red">' + esc(t('expiredTag')) + '</span>';
  else if (st.cls === 'soon') tag = '<span class="tag amber">' + esc(t('daysLeft', { n: st.d })) + '</span>';
  return (l.series ? (S.seriesHit && S.seriesHit[l.id] ? '<span class="tag series-hit">' + esc(t('seriesShort', { s: l.series })) + '</span>' : esc(t('seriesShort', { s: l.series }))) : esc(t('noSeries'))) + ' · ' + (l.expiry ? esc(t('until', { d: fmtExp(l.expiry) })) : esc(t('noExpiry'))) + ' ' + tag + lotDates(l);
}
function shortDt(s) { return s ? s.slice(8, 10) + '.' + s.slice(5, 7) + '.' + s.slice(2, 4) : ''; }
/** Когда партию положили в это место, когда пополняли и когда последний раз пересчитывали. */
function lotDates(l) {

function thumbHtml(item) {

}
let thumbTimer = null;
function loadThumbs() {

function spendOne(lotId) {

  const lot = lotById(lotId); const it = lot && itemById(lot.itemId);

  if (lotStatus(lot).cls === 'expired') { openSpendModal(lotId, 'DISPOSAL'); return; }
  if (it.strict && !S.visit) { openSpendModal(lotId, 'PATIENT'); return; }
  doSpend(lot, it, 1, 'PATIENT', '', S.visit);
}
function doSpend(lot, it, qty, reason, comment, visit, usedAt, witnessId) {
  const have = lot.qty;
  usedAt = usedAt && usedAt < bakuToday() ? usedAt : '';
  visit = reason === 'PATIENT' ? String(visit || '').trim().slice(0, 60) : '';
  if (visit) setVisit(visit);
  // если использовали больше, чем по учёту, — спишется сколько есть, а разница уйдёт админу как расхождение
  const op = enqueue('spend', Object.assign({ doctorId: S.docId, lotId: lot.id, qty, reason, comment, visit, reportShortage: reason === 'PATIENT' }, usedAt ? { usedAt } : { queuedDay: bakuToday() }, witnessId ? { witnessId } : {}), { label: it.name, shortageKnown: qty > have });
  S.mine.push({ opId: op.opId, action: 'spend', type: reason === 'PATIENT' ? 'SPEND' : 'DISPOSAL', doctorId: S.docId, lotId: lot.id, itemId: it.id, series: lot.series, expiry: lot.expiry, locationId: lot.locationId, name: it.name + ' ' + it.dosage, qty, delta: -qty, ts: Date.now(), status: 'pending', visit });
  saveMine();
  renderMine();
  const left = (lotById(lot.id) || { qty: 0 }).qty;
  const msg = qty > have ? t('shortageToast', { spent: have, miss: qty - have }) : reason === 'PATIENT' ? t('spentToast', { name: it.name, qty, left: left + ' ' + unitShort(it.unit) }) + (visit ? ' 🧾 ' + visit : '') : t('disposedToast', { name: it.name, qty });
  toast(msg + (!S.online ? ' ' + t('queuedToast') : ''), '', { label: t('undo'), act: 'undo', op: op.opId }, 9000);
  restockSuggest(lot, it);
}

function spendConfirm(lotId) {
  const lot = lotById(lotId); const it = lot && itemById(lot.itemId);
  if (!lot || !it) return closeModal();
  const reason = ($('input[name=spReason]:checked') || {}).value || 'PATIENT';
  const qty = Number($('#spQty').value);
  const comment = $('#spComment').value.trim();
  const visit = $('#spVisit').value.trim();
  const usedAt = ($('#spUsed') || {}).value || '';
  if (usedAt && monthClosed(usedAt)) return toast(t('E_MONTH_CLOSED', { month: monthName(usedAt.slice(0, 7)) }), 'bad');
  const expired = lotStatus(lot).cls === 'expired';
  if (!Number.isInteger(qty) || qty < 1) return toast(t('E_BAD_QTY', { min: 1, max: 100000 }), 'bad');
  if (reason === 'DISPOSAL' && qty > lot.qty) return toast(t('E_NOT_ENOUGH', { available: lot.qty }), 'bad');
  if (reason === 'PATIENT' && expired) return toast(t('E_EXPIRED', { expiry: fmtExp(lot.expiry) }), 'bad');
  if (reason === 'PATIENT' && it.strict && !comment && !visit) { $('#spComment').focus(); return toast(t('E_COMMENT_REQUIRED'), 'bad'); }
  if (reason === 'DISPOSAL' && !expired && !comment) { $('#spComment').focus(); return toast(t('E_DISPOSAL_REASON_REQUIRED'), 'bad'); }
  const witnessId = reason === 'DISPOSAL' && it.strict ? ($('#spWitness') || {}).value || '' : '';
  if (reason === 'DISPOSAL' && it.strict && !witnessId && $('#spWitness') && $('#spWitness').options.length > 1) { $('#spWitness').focus(); return toast(t('E_WITNESS_REQUIRED'), 'bad'); }
  if (reason === 'PATIENT' && qty > lot.qty) return shortageModal(lot.id, qty, reason, comment, visit, usedAt);
  closeModal();
  doSpend(lot, it, qty, reason, comment, visit, usedAt, witnessId);
}
function undoOp(opId) {
  // в приложении: сначала узнать, не отправил ли списание фоновый помощник (иначе «отменили» бы только на экране)
  if (window.PWA_MODE && navigator.locks && navigator.locks.request) { pwaLock(() => undoOpInner(opId)); return; }
  undoOpInner(opId);
}
function undoOpInner(opId) {
  const m = S.mine.find(x => x.opId === opId);
  if (!m || m.undone || m.undoPending) return;
  const qi = S.queue.findIndex(q => q.opId === opId);
  if (qi !== -1 && S.inFlight !== opId) {
    m.undone = true;
    saveMine();
    // ещё не ушло на сервер — просто убираем из очереди
    qTrail('undo-local', S.queue[qi]);
    S.queue.splice(qi, 1);
    markDone(opId);
    saveQueue();
    recompute(); renderAll();
    toast(t('undone'));
    return;
  }
  m.undoPending = true;
  saveMine();
  enqueue('undo', { storeId: m.storeId || S.storeId, targetOpId: opId }, { label: m.name });
}

function itemStats(it) {
  const lots = S.view.lots.filter(l => l.itemId === it.id);

  const expired = lots.filter(l => lotStatus(l).cls === 'expired').reduce((s, l) => s + l.qty, 0);
  const norms = (S.view.norms || []).filter(n => n.itemId === it.id).map(n => {
    const have = lots.filter(l => l.locationId === n.locationId && lotStatus(l).cls !== 'expired').reduce((s, l) => s + l.qty, 0);
    return { n, have, short: have < n.norm };
  });
  const sg = subGroup(it);
  const deficit = (it.minTotal > 0 && usable < it.minTotal) || norms.some(x => x.short) || (sg.min > 0 && sg.have < sg.min);

/* ---------- «Проверить»: спорные места, которые надо пересчитать руками ---------- */
function daysSince(dt) {
  if (!dt) return 9999;
  const a = Date.parse(dt.slice(0, 10) + 'T00:00:00Z');
  const b = Date.parse(bakuToday() + 'T00:00:00Z');
  return Math.round((b - a) / 86400000);
}
function lotUnchecked(l) { return !l.checkedAt || (l.lastInAt && l.checkedAt < l.lastInAt); }
function buildChecks() {
  if (!canStock() || !S.view) return [];
  const lots = S.view.lots.filter(l => l.id.indexOf('tmp_') !== 0);
  const tasks = [];
  // 1. Одна серия в нескольких местах
  const bySeries = {};
  lots.forEach(l => { if (l.series) (bySeries[l.itemId + '|' + normSeries(l.series) + '|' + l.expiry] = bySeries[l.itemId + '|' + normSeries(l.series) + '|' + l.expiry] || []).push(l); });
  Object.values(bySeries).forEach(g => {
    if (g.length >= 2 && g.some(lotUnchecked)) tasks.push({ kind: 'multi', item: itemById(g[0].itemId), lots: g, pri: 1 });
  });
  // 2. Несколько приходов в одну партию за сутки
  ((S.extras && S.extras.bursts) || []).forEach(b => {
    const l = lots.find(x => x.id === b.lotId);
    if (l && (!l.checkedAt || l.checkedAt < b.lastAt)) tasks.push({ kind: 'burst', item: itemById(l.itemId), lots: [l], burst: b, pri: 1 });
  });
  // 3. Не удалось списать: по учёту меньше, чем было на руках (с любого телефона — из журнала сервера)
  ((S.extras && S.extras.rejected) || []).filter(rj => rj.code === 'E_NOT_ENOUGH' || rj.code === 'E_NO_LOT').forEach(rj => {
    const l = lots.find(x => x.id === rj.lotId);
    if (l && (!l.checkedAt || l.checkedAt < rj.time) && !tasks.some(x => x.kind === 'mismatch' && x.lots[0].id === l.id)) tasks.push({ kind: 'mismatch', item: itemById(l.itemId), lots: [l], pri: 0 });
  });
  S.failed.forEach((op, i) => {
    if (S.me && op.userId && op.userId !== S.me.id) return;
    if (op.action === 'spend' && op.error && op.error.code === 'E_NOT_ENOUGH') {
      const l = lots.find(x => x.id === op.payload.lotId);
      if (l && !tasks.some(x => x.kind === 'mismatch' && x.lots[0].id === l.id) && (!l.checkedAt || l.checkedAt.replace(' ', 'T') < new Date(op.ts + 4 * 3600000).toISOString().slice(0, 16))) tasks.push({ kind: 'mismatch', item: itemById(l.itemId), lots: [l], pri: 0, failedIdx: i });
    }
  });
  // 4. Просроченное по местам
  const expByLoc = {};
  lots.forEach(l => { if (lotStatus(l).cls === 'expired') (expByLoc[l.locationId] = expByLoc[l.locationId] || []).push(l); });
  Object.keys(expByLoc).forEach(loc => tasks.push({ kind: 'expired', loc, lots: expByLoc[loc], pri: 2 }));
  // 4б. Внесено без срока / с пометкой «уточнить» (начальная загрузка, акт)
  noteChecks(lots).forEach(x => tasks.push(x));
  // 5. Похожие карточки
  ((S.extras && S.extras.duplicates) || []).forEach(ids => {
    const its = ids.map(itemById).filter(Boolean);
    if (its.length >= 2) tasks.push({ kind: 'dup', items: its, lots: [], pri: 3 });
  });
  // 6. Давно не пересчитывали — по местам
  const stale = {};
  lots.forEach(l => { if (daysSince(l.checkedAt || l.createdAt) > STALE_DAYS) (stale[l.locationId] = stale[l.locationId] || []).push(l); });
  Object.keys(stale).forEach(loc => tasks.push({ kind: 'stale', loc, lots: stale[loc], pri: 4 }));
  return tasks.filter(x => x.kind === 'dup' || x.kind === 'expired' || x.kind === 'stale' || x.kind === 'note' || x.item).sort((a, b) => a.pri - b.pri);
}
function checksHtml() {
  const tasks = buildChecks();

    let text = '';
    const nm = task.item ? task.item.name + ' ' + task.item.dosage : '';
    if (task.kind === 'multi') text = t('chkMulti', { name: nm, s: task.lots[0].series });
    if (task.kind === 'burst') text = t('chkBurst', { name: nm, loc: locName(task.lots[0].locationId), n: task.burst.count, qtys: task.burst.qtys.map(q => '+' + q).join(', ') });
    if (task.kind === 'mismatch') text = t('chkMismatch', { name: nm, loc: locName(task.lots[0].locationId) });

    if (task.kind === 'dup') text = t('chkDup', { names: task.items.map(i => i.name + ' ' + i.dosage).join(' / ') });

        (task.kind === 'note' ? '<button class="btn small primary" data-act="editLotModal" data-lot="' + esc(l.id) + '">' + esc(t('editLotBtn')) + '</button>' : '') +
        '<button class="btn small ghost" data-act="auditModal" data-lot="' + esc(l.id) + '">' + esc(t('recount', { loc: byPlace ? '' : locName(l.locationId) }).replace(/:\s*$/, '')) + '</button></div></div>';
    }).join('');
    const acts = task.kind === 'dup'
      ? '<button class="btn small ghost" data-act="stockView" data-view="dup">' + esc(t('openDups')) + '</button>'
      : (task.kind === 'expired' || task.kind === 'note' ? '' : '<button class="btn small primary" data-act="markChecked" data-lots="' + esc(task.lots.map(l => l.id).join(',')) + '" data-failed="' + (task.failedIdx !== undefined ? task.failedIdx : '') + '">' + esc(t('allCorrect')) + '</button>');
    return '<div class="grp"><div class="grp-h"><div class="t" style="font-weight:600">' + esc(text) + '</div></div>' + (lotsList ? '<div class="lots">' + lotsList + '</div>' : '') +
      (acts ? '<div style="padding:0 12px 12px;display:flex;justify-content:flex-end">' + acts + '</div>' : '') + '</div>';
  }).join('');

function readExp(prefix) {
  if ($('#' + prefix + 'No').checked) return { noExpiry: true, expiry: '' };
  const m = $('#' + prefix + 'M').value, y = $('#' + prefix + 'Y').value, d = $('#' + prefix + 'D').value;
  if (!m || !y) return null;
  const dd = d ? +d : lastDay(+y, +m);
  if (dd > lastDay(+y, +m)) return null;
  return { noExpiry: false, expiry: y + '-' + m + '-' + String(dd).padStart(2, '0') };
}

/* =====================================================================
 * Фото упаковки и штрихкод
 * ===================================================================== */
function loadScript(src) {
  return new Promise((res, rej) => {
    if (document.querySelector('script[data-src="' + src + '"]')) { res(); return; }
    const s = document.createElement('script');
    s.src = src; s.async = true; s.dataset.src = src;
    s.crossOrigin = 'anonymous'; // так фоновый помощник может сохранить сканер и для работы без интернета
    s.onload = () => res(); s.onerror = () => { s.remove(); rej(new Error('load')); };
    document.head.appendChild(s);
  });
}
function fileToImage(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); res(img); };
    img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('img')); };
    img.src = url;
  });
}
/** Миниатюра упаковки: до 200 px, сжимаем, пока не влезет в ячейку таблицы. */
async function makeThumb(file) {
  const img = await fileToImage(file);
  for (const [size, q] of [[200, 0.7], [180, 0.6], [150, 0.5], [120, 0.45]]) {
    const sc = Math.min(1, size / Math.max(img.width, img.height));
    const c = document.createElement('canvas');
    c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
    c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
    const url = c.toDataURL('image/jpeg', q);
    if (url.length < 40000) return url;
  }
  throw new Error('big');
}
async function decodeBarcode(file) {
  const img = await fileToImage(file);
  if ('BarcodeDetector' in window) {
    try {
      const det = new BarcodeDetector();
      const found = await det.detect(img);
      if (found && found.length) return found[0].rawValue;
    } catch (e) { }
  }
  await loadScript(ZXING_URL);
  const tries = [];
  const maxSide = Math.max(img.width, img.height);
  [1600, 1000].forEach(lim => [0, 90].forEach(rot => tries.push({ lim, rot })));
  for (const tr of tries) {
    const sc = Math.min(1, tr.lim / maxSide);
    const w = Math.round(img.width * sc), h = Math.round(img.height * sc);
    const c = document.createElement('canvas');
    const ctx = c.getContext('2d');
    if (tr.rot) { c.width = h; c.height = w; ctx.translate(h, 0); ctx.rotate(Math.PI / 2); } else { c.width = w; c.height = h; }
    ctx.drawImage(img, 0, 0, w, h);
    const data = ctx.getImageData(0, 0, c.width, c.height).data;
    const lum = new Uint8ClampedArray(c.width * c.height);
    for (let i = 0, j = 0; i < data.length; i += 4, j++) lum[j] = (data[i] * 299 + data[i + 1] * 587 + data[i + 2] * 114) / 1000;
    try {
      const src = new ZXing.RGBLuminanceSource(lum, c.width, c.height);
      const bmp = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(src));
      const hints = new Map();
      hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
      const reader = new ZXing.MultiFormatReader();
      reader.setHints(hints);
      return reader.decode(bmp).getText();
    } catch (e) { }
  }
  return '';
}
async function onScanFile(file) {

  const gsAny = parseGs1(code);

  while ($('#toasts').children.length > 2) $('#toasts').firstChild.remove();
}
/** Кнопка блокируется сразу после нажатия и до ответа сервера — двойного нажатия не бывает. */
async function busy(btn, fn, raw) {
  if (btn && btn.disabled) return null;
  const all = btn ? [btn] : [];
  const was = btn ? btn.textContent : '';
  all.forEach(b => { b.disabled = true; b.textContent = '⏳'; });
  try { return await fn(); }
  catch (e) { if (raw) throw e; return null; }
  finally { all.forEach(b => { if (document.body.contains(b)) { b.disabled = false; b.textContent = was; } }); }
}

function bind() {
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]');
    if (!el || el.disabled) return;
    const fn = H[el.dataset.act];
    if (fn) fn(el, e);
  });
  $('#visitInp').addEventListener('input', e => setVisit(e.target.value.trim()));
  $('#revBox').addEventListener('input', e => { if (e.target.classList.contains('rv-in')) revInput(e.target); });
  let sT = null;
  $('#spendQ').addEventListener('input', e => { clearTimeout(sT); sT = setTimeout(() => { S.spend.q = e.target.value; renderSpend(); }, 150); });
  $('#spendLoc').addEventListener('change', e => { S.spend.loc = e.target.value; renderSpend(); });
  let kT = null;
  $('#stockQ').addEventListener('input', e => { clearTimeout(kT); kT = setTimeout(() => { S.stock.q = e.target.value; renderStock(); }, 150); });
  $('#stockLoc').addEventListener('change', e => { S.stock.loc = e.target.value; renderStock(); });
  $('#rcvForm').addEventListener('change', () => { $('#rcvUnit').value = formInfo($('#rcvForm').value).unit; updateDoseLabel(); });
  $('#rcvNoExp').addEventListener('change', e => $('#rcvExpWrap').classList.toggle('hidden', e.target.checked));
  ['#rcvQty', '#rcvPackCount'].forEach(s => $(s).addEventListener('input', updateQtyCalc));
  $('#rcvUnit').addEventListener('change', updateQtyCalc);
  $('#rcvDate').addEventListener('change', () => rcvDateChanged());
  $('#fileDoc').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (f) docPhotoFile(f); });
  $('#rcvDoc').addEventListener('change', () => { S.rcv.doc = $('#rcvDoc').value.trim(); S.rcv.docDay = bakuToday(); });
  $('#rcvName').addEventListener('input', () => { S.rcv.pickedItemId = ''; $('#rcvNameNote').innerHTML = ''; if (!$('#rcvName').value.trim()) { showBrands(null); $('#rcvRefInfo').innerHTML = ''; $('#rcvSub').value = ''; } });
  $('#rcvName').addEventListener('blur', () => setTimeout(canonicalizeName, 220));
  $('#rcvSub').addEventListener('change', () => showRefInfo(refBySubstance($('#rcvSub').value)));
  $('#repType').addEventListener('change', repTypeChanged);
  window.addEventListener('resize', () => { if (S.screen === 'reports' && S.report) { clearTimeout(S.rzT); S.rzT = setTimeout(renderReport, 200); } });
  attachSuggest($('#rcvName'), q => nameSuggestions(q, S.rcv.cat), onPickName);
  attachSuggest($('#rcvSub'), subSuggestionsCat, o => {
    if (o.kind === 'inn') { $('#rcvSub').value = o.label; if (!$('#rcvName').value.trim()) $('#rcvName').value = o.label; return; }
    $('#rcvSub').value = o.so.s; showRefInfo(o.so); if (!$('#rcvName').value.trim()) $('#rcvName').value = o.so.s; showBrands(o.so, $('#rcvName').value, true);
  });
  $('#rcvName').addEventListener('change', () => { if (!S.rcv.pickedItemId) showCatVariants($('#rcvName').value.trim()); });
  $('#rcvBrand').addEventListener('change', onBrandChosen);
  attachSuggest($('#reqName'), q => nameSuggestions(q, 'med'), o => { $('#reqName').value = o.label; if (o.item) $('#reqDose').value = o.item.dosage; });
  $('#fileScan').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (f) onScanFile(f); });
  $('#filePhoto').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (f) onPhotoFile(f); });
  window.addEventListener('storage', e => {
    if (e.key === 'MED2_QUEUE') { saveQueue(); recompute(); renderAll(); }
  });
  window.addEventListener('online', () => { S.online = true; flushQueue(); refreshState(); });
  window.addEventListener('offline', () => { S.online = false; renderStatus(); });
  document.addEventListener('visibilitychange', () => { if (!document.hidden) { flushQueue(); refreshState(); } });
  setInterval(() => { if (!document.hidden) refreshState(); }, 60000);
  setInterval(() => { if (S.screen === 'spend') renderMine(); }, 30000);
}

function readUrlLocation() {
  try {
    if (window.PWA_MODE) {
      const id = new URLSearchParams(location.search).get('loc');
      if (id && S.sess) { if (canStock()) { S.stock.loc = id; setScreen('stock'); } else { S.spend.loc = id; S.spend.showAll = true; setScreen('spend'); } }
      return;
    }
    if (S.gas && google.script.url) {
      google.script.url.getLocation(loc => {
        const id = loc && loc.parameter && loc.parameter.loc;
        if (!id) return;
        if (!S.sess) return;
        if (canStock()) { S.stock.loc = id; setScreen('stock'); } else { S.spend.loc = id; S.spend.showAll = true; setScreen('spend'); }
      });
    }
  } catch (e) { }
}

/** Права на текущем складе — из ответа сервера о входе (обновляются с каждым состоянием). Сервер всё равно проверяет каждое действие. */
function can(p) {
  const me = S.me;
  if (!me || !S.sess) return false;
  if (me.owner) return true;
  const st = (me.stores || []).find(s => s.id === S.storeId);
  const perms = st ? st.perms : [];
  const list = Array.isArray(p) ? p : [p];
  return list.some(x => perms.indexOf(x) !== -1);
}
function canStock() { return can(['stock', 'move', 'revision', 'edit', 'incidents']); }
function isOwner() { return !!(S.me && S.me.owner); }
/** Состояние склада кэшируется отдельно для каждого пользователя: другой человек на этом телефоне чужого не увидит. */
function stateKey(id, uid) { return 'MED4_STATE:' + (uid || (S.me && S.me.id) || '-') + ':' + (id || S.storeId); }
function storeName(st) { return st ? (S.lang === 'az' ? (st.nameAz || st.nameRu) : st.nameRu) : ''; }
function myStores() { return (S.me && S.me.stores) || []; }
function deviceName() {
  const ua = navigator.userAgent || '';
  const m = ua.match(/\(([^)]+)\)/);
  const os = m ? m[1].split(';').slice(0, 2).join(' ').trim() : '';
  const br = /Edg\//.test(ua) ? 'Edge' : /SamsungBrowser/.test(ua) ? 'Samsung' : /Chrome\//.test(ua) ? 'Chrome' : /Safari\//.test(ua) ? 'Safari' : /Firefox\//.test(ua) ? 'Firefox' : '';
  return (br + ' · ' + os).slice(0, 110);
}

  if (S.me) LS.set('MED4_ME', S.me); else LS.del('MED4_ME');

}
function setMe(me) {
  if (!me) return;

/** Сеанс закрыт (вышел на другом телефоне, сменили пароль, админ закрыл): очередь сохраняется, просим войти снова. */

function afterLogin(r) {

  saveSession(r.sess, r.me);
  setMe(r.me);
  LS.set('MED4_LASTUSER', r.me.id);
  // другой человек на этом телефоне: черновики и состояние прежнего не показываем
  if (prevUser && prevUser !== r.me.id) { S.base = null; S.extras = null; S.report = null; }
  // временный пароль: пока не сменит — интерфейс склада не показываем
  if (r.me.mustChange) { changePasswordModal(true); return; }
  document.body.classList.remove('logged-out');
  $('#scrLogin').classList.add('hidden');
  enterApp();
}
/** После входа: выбрать склад (последний или единственный), загрузить его состояние. */
function enterApp() {
  const stores = myStores();
  if (!stores.length) { S.screen = 'spend'; renderAll(); return noStoresModal(); }
  if (!stores.some(s => s.id === S.storeId)) {
    const last = LS.get('MED4_STORE', '');
    S.storeId = stores.some(s => s.id === last) ? last : (stores.length === 1 ? stores[0].id : '');
  }
  if (!S.storeId) return storePicker(true);
  switchStore(S.storeId, true);
}
function noStoresModal() {
  openModal('<h3>' + esc(t('noStoresTitle')) + '</h3><div class="muted">' + esc(t('noStoresHint')) + '</div><div class="acts"><button class="btn ghost" data-act="logout">' + esc(t('logout')) + '</button><button class="btn primary" data-act="reloadMe">' + esc(t('retry')) + '</button></div>');

function storePicker(force) {

    (force ? '' : '<div class="acts"><button class="btn ghost" data-act="closeModal">' + esc(t('close')) + '</button></div>'));

function switchStore(id, initial) {
  if (!myStores().some(s => s.id === id)) return;
  if (typeof fFlush === 'function') fFlush(); // недописанное в форме — в её склад, до переключения
  const changed = id !== S.storeId;
  S.storeId = id;
  LS.set('MED4_STORE', id);
  if (changed || initial) {
    S.base = LS.get(stateKey(id), null);
    if (S.base && S.base.store && S.base.store.id !== id) S.base = null;
    S.extras = null; S.report = null; S.thumbs = {};
    S.spend.loc = 'ALL'; S.spend.q = ''; S.spend.showAll = false; S.stock.loc = 'ALL';
    S.rev = loadRevDraft();
    $('#spendQ').value = '';
  }
  closeModal();
  recompute();
  if (!screenAllowed(S.screen)) S.screen = firstScreen();
  setScreen(S.screen);
  refreshState(true);
}
function screenAllowed(scr) {
  if (scr === 'spend') return can('spend');
  if (scr === 'receive') return can('receive') || can('opening');
  if (scr === 'stock') return canStock();
  if (scr === 'revision') return can('revision');
  if (scr === 'reports') return can(['reports', 'incidents']);
  if (scr === 'forms') return can(['forms', 'formsEdit']);
  return false;
}
function firstScreen() { return ['spend', 'receive', 'stock', 'revision', 'forms', 'reports'].find(screenAllowed) || 'spend'; }
function loadRevDraft() {
  let d = LS.get('MED3_REV:' + S.storeId, null);
  if (!d && S.storeId === 'S1') { d = LS.get('MED3_REV', null); if (d) { LS.set('MED3_REV:S1', d); LS.del('MED3_REV'); } }
  return d;
}

async function logout() {
  if (typeof fFlush === 'function') fFlush();

  if (mine && !confirm(t('logoutQueued', { n: mine }))) return;
  const sess = S.sess;
  // данные склада и формы этого человека на телефоне больше не нужны (следующий не увидит их даже через отладку браузера)
  if (S.me) {
    const pre = ['MED4_STATE:' + S.me.id + ':', 'MED5_FORMS:' + S.me.id + ':'];
    try { Object.keys(localStorage).forEach(k => { if (pre.some(p => k.indexOf(p) === 0)) localStorage.removeItem(k); }); } catch (e) { }
  }
  saveSession('', null);
  S.base = null; S.extras = null; S.report = null; S.view = null; S.rev = null; S.fv = null; S.fd = {}; S.fc = null; S.fSearch = null; S.fHist = null; S.fImg = null; S.fvCtx = '';

  if (S.gas && sess) rpc('logout', { sess }).catch(() => { });
  toast(t('loggedOut'));
  showLogin();
}

/* ---------- GS1 DataMatrix на коробке: код товара, серия, срок одним снимком ---------- */
function parseGs1(raw) {
  let s = String(raw || '').replace(/^\]d2|^\]C1|^\]Q3/, '').replace(/^\u001d/, '');
  if (!/^(01|17|10|21)/.test(s)) return null;
  const FIXED = { '01': 14, '17': 6, '11': 6, '15': 6, '00': 18 };
  const out = {};
  let guard = 0;
  while (s.length && guard++ < 12) {
    const ai = s.slice(0, 2);
    s = s.slice(2);
    if (FIXED[ai]) { out[ai] = s.slice(0, FIXED[ai]); s = s.slice(FIXED[ai]).replace(/^\u001d/, ''); continue; }
    if (ai === '10' || ai === '21' || ai === '24' || ai === '91' || ai === '92') {
      const k = s.indexOf('\u001d');
      out[ai === '24' ? '240' : ai] = k === -1 ? s : s.slice(0, k);
      s = k === -1 ? '' : s.slice(k + 1);
      continue;
    }
    break;
  }
  if (!out['01'] && !out['10'] && !out['17']) return null;
  let expiry = '';
  if (out['17'] && /^\d{6}$/.test(out['17'])) {
    const y = 2000 + +out['17'].slice(0, 2), m = +out['17'].slice(2, 4), d = +out['17'].slice(4, 6);
    if (m >= 1 && m <= 12) expiry = y + '-' + String(m).padStart(2, '0') + '-' + String(d === 0 ? lastDay(y, m) : Math.min(d, lastDay(y, m))).padStart(2, '0');
  }
  const gtin = out['01'] || '';
  return { gtin, ean: gtin.length === 14 && gtin[0] === '0' ? gtin.slice(1) : gtin, series: out['10'] || '', expiry, serial: out['21'] || '' };
}

function hashStr(s) {
  let h1 = 0x811c9dc5, h2 = 0x01000193;
  for (let i = 0; i < s.length; i++) { const c = s.charCodeAt(i); h1 = Math.imul(h1 ^ c, 16777619) >>> 0; h2 = Math.imul(h2 ^ c, 2246822519) >>> 0; }
  return h1.toString(36) + h2.toString(36);
}

const BULK_UNITS = [[/^(амп|ампул\S*|amp\S*)$/i, 'amp'], [/^(фл|флак\S*|flak\S*|şüşə)$/i, 'vial'], [/^(таб|табл\S*|tab\S*)$/i, 'tab'], [/^(капс\S*|kaps\S*|cap\S*)$/i, 'cap'],
  [/^(неб\S*|neb\S*)$/i, 'neb'], [/^(туб\S*|tüb\S*|tub\S*)$/i, 'tube'], [/^(шт|штук\S*|əd|ədəd|pcs)$/i, 'pcs'], [/^(уп|упак\S*|qutu|pack)$/i, 'pack'], [/^(пар\S*|cüt|pair)$/i, 'pair'],
  [/^(пак\S*|саше|paket|sachet)$/i, 'sachet'], [/^(свеч\S*|şam\S*)$/i, 'pcs']];
const BULK_SUP = [[/шприц|şpris/i, 'sup_syringe'], [/систем|sistem/i, 'sup_ivset'], [/катетер|канюл|branul|kateter|kanyul/i, 'sup_cath'], [/игл|iynə/i, 'sup_needle'], [/бинт|bint/i, 'sup_bandage'],
  [/марл|салфет|cuna|salfet/i, 'sup_gauze'], [/^ват|pambıq/i, 'sup_cotton'], [/пластыр|plastır/i, 'sup_plaster'], [/перчат|əlcək/i, 'sup_gloves'], [/шовн|викрил|кетгут|нить|tikiş/i, 'sup_suture']];
const BULK_FORM_BY_UNIT = { amp: 'med_amp', vial: 'med_vial', tab: 'med_tab', cap: 'med_cap', neb: 'med_neb', tube: 'med_oint', sachet: 'med_other', pcs: 'med_other', bottle: 'med_spray', pack: 'med_other', pair: 'med_other' };
function bulkUnit(w) { w = String(w || '').replace(/\.$/, '').trim(); for (const [re, u] of BULK_UNITS) if (re.test(w)) return u; return ''; }
function parseExpText(s) {
  s = String(s || '').trim();
  let m = s.match(/^(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})$/);
  if (m) { const y = m[3].length === 2 ? 2000 + +m[3] : +m[3], mo = +m[2], d = +m[1]; if (mo >= 1 && mo <= 12 && d >= 1 && d <= lastDay(y, mo)) return y + '-' + String(mo).padStart(2, '0') + '-' + String(d).padStart(2, '0'); return null; }
  m = s.match(/^(\d{1,2})[./-](\d{2}|\d{4})$/);
  if (m) { const y = m[2].length === 2 ? 2000 + +m[2] : +m[2], mo = +m[1]; if (mo >= 1 && mo <= 12) return y + '-' + String(mo).padStart(2, '0') + '-' + String(lastDay(y, mo)).padStart(2, '0'); return null; }
  m = s.match(/^(\d{4})-(\d{2})(?:-(\d{2}))?$/);
  if (m) { const y = +m[1], mo = +m[2], d = m[3] ? +m[3] : lastDay(y, mo); if (mo >= 1 && mo <= 12 && d <= lastDay(y, mo)) return y + '-' + m[2] + '-' + String(d).padStart(2, '0'); }
  return null;
}
/** Одна строка акта → позиция. Понимает «Атропин 0,1% 1 мл — 10 амп. до 09.2027 серия A12» и строки из Excel (через Tab). */
function parseBulkLine(line) {
  let s = String(line || '').replace(/ /g, ' ').trim();
  if (!s) return null;
  let name = '', dosage = '', qty = null, unitW = '', series = '', expTxt = '';
  const cells = s.split('\t').map(x => x.trim());
  if (cells.length >= 3) {
    [name, dosage] = cells; qty = cells[2]; unitW = cells[3] || ''; series = cells[4] || ''; expTxt = cells[5] || '';
    if (/^\d+$/.test(name) && cells.length >= 4) { [, name, dosage, qty, unitW, series, expTxt] = cells.concat(['', '', '']); }
  } else {
    s = s.replace(/^\s*\d{1,3}[.)]\s+/, '');
    const sm = s.match(/(?:серия|сер\.|seriya|lot|s\/n)\s*[:№#]?\s*([A-Za-zА-Яа-я0-9][A-Za-zА-Яа-я0-9\-\/]*)/i);
    if (sm) { series = sm[1]; s = s.replace(sm[0], ' '); }
    const em = s.match(/(?:годен до|годен|срок|до|exp\.?|son tarix)\s*[:]?\s*(\d{1,2}[./-]\d{1,2}[./-]\d{2,4}|\d{1,2}[./-]\d{2,4})/i) || s.match(/\b(\d{1,2}[./]\d{4})\b/);
    if (em) { expTxt = em[1]; s = s.replace(em[0], ' '); }
    s = s.replace(/\s+/g, ' ').trim();
    const qm = s.match(/(?:^|[\s—–:×x*-])\s*(\d{1,6})\s*([^\d\s.,;]{1,12})?\.?\s*$/i);
    if (qm && (bulkUnit(qm[2]) || !qm[2])) { qty = qm[1]; unitW = qm[2] || ''; s = s.slice(0, qm.index).replace(/[\s—–:×*-]+$/, '').trim(); }
    const toks = s.split(' ');
    const k = toks.findIndex((w, i) => i > 0 && /\d/.test(w));
    if (k > 0) { name = toks.slice(0, k).join(' '); dosage = toks.slice(k).join(' '); } else name = s;
    name = name.replace(/[,;—–-]+$/, '').trim(); dosage = dosage.replace(/[,;—–-]+$/, '').trim();
  }
  const exp = expTxt ? parseExpText(expTxt) : '';
  const unit = bulkUnit(unitW);
  const row = { item: { category: 'med', form: 'med_other', name, dosage: dosage || '—', unit: unit || 'pcs' }, qty: Number(qty), series: normSeries(series), expiry: exp || '', noExpiry: !exp, note: exp ? '' : 'срок не указан', bad: !name || !(Number(qty) >= 1) || exp === null };
  bulkMatchRow(row, unit);
  return row;
}
/** Сверяем с базой: та же карточка — берём её форму/единицу; иначе угадываем по слову единицы и названию. */
function bulkMatchRow(row, unitGiven) {
  const it = row.item;
  const same = S.view.items.filter(i => skel(i.name) === skel(it.name));
  const exact = same.find(i => normDose(i.dosage) === normDose(it.dosage)) || (it.dosage === '—' && same.length === 1 ? same[0] : null);
  if (exact) { Object.assign(it, { category: exact.category, form: exact.form, name: exact.name, dosage: exact.dosage, unit: exact.unit, substance: exact.substance || '' }); row.match = exact.id; return; }
  row.match = '';
  const sup = BULK_SUP.find(x => x[0].test(it.name));
  if (sup) { it.category = 'sup'; it.form = sup[1]; if (!unitGiven) it.unit = formInfo(sup[1]).unit; }
  else {
    it.category = 'med';
    it.form = BULK_FORM_BY_UNIT[it.unit] || 'med_other';
    const sub = refSubOf(it.name);
    if (sub) { it.substance = sub.s; const canon = (S.refIdx.byBrandSk[skel(it.name)] || [])[0]; if (canon) it.name = canon.b; }
  }
}

async function bulkSubmit(btn, force, forceDoc) {
  const b = S.bulk; if (!b) return;
  if (bulkNeedsAnswer(b)) return toast(t('bulkAskN', { n: '' }), 'bad');
  b.loc = ($('#bulkLoc') || {}).value || b.loc;
  const rows = b.rows.map(r => ({ item: r.item, qty: r.qty, series: r.series, expiry: r.expiry, noExpiry: r.noExpiry, note: r.note, locationId: b.loc }));
  const df = bulkDateFields(b);
  const payload = Object.assign({ rows, source: b.source, presetKey: b.presetKey || '', force: !!force }, df, forceDoc ? { forceDoc: true } : {});
  // номер операции — от содержимого списка и даты: если ответ потерялся и список отправят снова, второй раз он не внесётся
  const opId = ('b' + hashStr(JSON.stringify(rows) + '|' + bakuToday() + '|' + df.receivedAt + '|' + String(df.counted) + '|' + (df.docNo || '')) + (force || forceDoc ? 'f' + Date.now().toString(36) : '')).slice(0, 60);
  let r;
  try { r = await busy(btn, () => rpcD('bulkReceive', payload, { opId, timeout: 300000, quiet: true }), true); }
  catch (e) {
    const res = e && e.res;
    if (res && res.code === 'E_PRESET_DONE') {
      if (confirm(t('presetAgain', { d: fmtDt(res.info.at) }))) return bulkSubmit($('[data-act=bulkSubmit]'), true, forceDoc);
      return;
    }
    if (res && res.code === 'E_DOC_DONE') {
      if (confirm(t('E_DOC_DONE', { doc: res.info.doc, who: res.info.who || '' }))) return bulkSubmit($('[data-act=bulkSubmit]'), force, true);
      return;
    }
    if (res) toast(errText(res), 'bad');
    return;
  }
  if (!r) return;
  if (b.loc !== '__HOLD') LS.set('MED2_LASTLOC', b.loc);
  S.bulk = null;
  closeModal();
  toast(r.duplicate ? t('bulkAlready') : t('bulkDone', { n: r.result.count }) + (r.result.hist ? ' ' + t('bulkHistDone', { n: r.result.hist }) : '') + (r.result.askMissed ? ' ' + t('bulkAskMissed', { n: r.result.askMissed }) : '') + (r.result.counted ? ' ' + t('bulkRevDone', { n: r.result.counted }) : ''));
}

S.rev = null; // черновик ревизии — свой у каждого склада (загружается при выборе склада)
function revSave() { const k = 'MED3_REV:' + S.storeId; if (S.rev) LS.set(k, S.rev); else LS.del(k); }

function revLotsAt(locId) {
  const r = S.rev;
  const out = S.view.lots.filter(l => l.locationId === locId && l.id.indexOf('tmp_') !== 0).map(l => ({ id: l.id, live: l }));
  const have = {};
  out.forEach(x => { have[x.id] = 1; });
  // партия могла уйти в ноль (врач списал во время ревизии) — она всё равно остаётся в черновике
  Object.values(r.lines).forEach(ln => { if (ln.locationId === locId && !have[ln.lotId]) out.push({ id: ln.lotId, live: null }); });
  const info = x => x.live ? { itemId: x.live.itemId, series: x.live.series, expiry: x.live.expiry, qty: x.live.qty, note: x.live.note } : (() => { const ln = r.lines[x.id]; return { itemId: ln.itemId, series: ln.series, expiry: ln.expiry, qty: 0, note: '' }; })();
  return out.map(x => Object.assign({ id: x.id }, info(x))).filter(x => itemById(x.itemId))
    .sort((a, b) => itemById(a.itemId).name.localeCompare(itemById(b.itemId).name, 'ru') || (a.expiry || '9').localeCompare(b.expiry || '9'));
}
function revCounted(ln) { return ln && ln.actual !== null && ln.actual !== undefined && ln.actual !== ''; }
function revProgress(locId) {

function revLine(lot) {

  return r.lines[lot.id];
}

  const kws = String(line.keywords || '').split(';').map(k => skel(k)).filter(Boolean);

/** Одна полоса из частей (годно / скоро / просрочено) с легендой: значок + подпись + число. */
function stackBar(segs, opt) {

  if (!total) return null;
  const fs = 12, barH = 18, gap = 2;
  const avail = W - gap * (segs.length - 1);
  let x = 0, b = '';
  segs.forEach((s, i) => {
    const w = Math.max(3, s.value / total * avail);
    const r = 4;
    const first = i === 0, last = i === segs.length - 1;
    let d;
    if (first && last) d = 'M' + r + ' 0H' + r1(w - r) + 'A4 4 0 0 1 ' + r1(w) + ' 4V' + (barH - 4) + 'A4 4 0 0 1 ' + r1(w - r) + ' ' + barH + 'H' + r + 'A4 4 0 0 1 0 ' + (barH - 4) + 'V4A4 4 0 0 1 ' + r + ' 0Z';
    else if (first) d = barPath(x, 0, w, barH, 'l');
    else if (last) d = barPath(x, 0, w, barH, 'r');
    else d = 'M' + r1(x) + ' 0h' + r1(w) + 'v' + barH + 'h' + r1(-w) + 'Z';
    b += '<path d="' + d + '" fill="' + s.color + '"' + tipAttr(s.icon + ' ' + s.label + ': ' + fmtNum(s.value)) + '/>';

    b += '<rect x="' + r1(lx) + '" y="' + (ly - 10) + '" width="10" height="10" rx="2" fill="' + s.color + '"/><text x="' + r1(lx + 15) + '" y="' + ly + '" font-size="' + fs + '" fill="' + th.ink2 + '">' + esc(txt) + '</text>';
    lx += tw;
  });

}

/* Подсказка при наведении/касании */
function vizTipInit() {
  const tip = document.createElement('div');

  document.body.appendChild(tip);
  const show = (el, e) => {
    tip.textContent = el.getAttribute('data-tip');
    tip.classList.remove('hidden');
    const w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.max(6, Math.min(window.innerWidth - w - 6, e.clientX - w / 2)) + 'px';
    tip.style.top = Math.max(6, e.clientY - h - 12) + 'px';
  };
  document.addEventListener('pointermove', e => {
    const el = e.target.closest && e.target.closest('.viz [data-tip]');
    if (el) show(el, e); else if (e.pointerType === 'mouse') tip.classList.add('hidden');
  });
  document.addEventListener('pointerdown', e => {
    const el = e.target.closest && e.target.closest('.viz [data-tip]');
    if (el) show(el, e); else tip.classList.add('hidden');
  });
  window.addEventListener('scroll', () => tip.classList.add('hidden'), { passive: true });
}

const CORR_COLS = [['revShortage', 'colRevShortage', true], ['revSurplus', 'colRevSurplus'], ['incFound', 'colIncFound'], ['otherCorr', 'colOtherCorr']];
/** Поправки строки для экрана: по видам, если сервер их дал. */
function corrSpans(x) {
  if (!('revShortage' in x)) return x.corrections ? '<span>' + (x.corrections > 0 ? '+' : '') + x.corrections + ' ' + esc(t('colCorrections').toLowerCase()) + '</span>' : '';
  return CORR_COLS.filter(c => x[c[0]]).map(c => { const v = (c[2] ? -1 : 1) * x[c[0]]; return '<span>' + (v > 0 ? '+' : v < 0 ? '−' : '') + Math.abs(v) + ' ' + esc(t(c[1]).toLowerCase()) + '</span>'; }).join('');

/** Пометки к месячному отчёту: когда начат учёт, что значит «до ввода остатка», пояснение ко всему отчёту. */
function monthlyNotices(r) {
  const out = [];
  if (r.openingFirst) out.push(t('repOpeningNote', { d: fmtDate(r.openingFirst) + (r.openingLast && r.openingLast !== r.openingFirst ? '–' + fmtDate(r.openingLast) : '') }));
  if (r.rows.some(x => x.receivedHist)) out.push(t('repHistNote'));
  const all = (r.notes || {})['*'];
  if (all && all.note) out.push(t('colNote') + ': ' + all.note);
  return out;
}
/** Таблица для Google Таблицы: пометки — строками в конце. */

/** Решение по расхождению: служебные значения сервера — переводом, текст админа — как есть. */

/** Понятное описание строки «Спорного» на текущем языке. */
function suspText(x) {
  const u = x.unit ? unitShort(x.unit) : '';
  switch (x.kind) {
    case 'incident': return t('incKind_' + x.incKind) + ': ' + x.qty + ' ' + u + ' · ' + t('incStatus_' + x.status) + (x.resolution ? ' (' + resolutionText(x.resolution) + ')' : '') + (x.visit ? ' · 🧾 ' + x.visit : '');
    case 'rejected': return t('suspRejected', { qty: x.qty, have: x.have === '' ? '?' : x.have });
    case 'burst': return t('suspBurst', { n: x.count, qtys: (x.qtys || []).map(q => '+' + q).join(', '), who: (x.whoAll || []).join(', ') });
    case 'revShort': return t('suspRevShort', { n: x.qty, u });
    case 'revSurplus': return t('suspRevSurplus', { n: x.qty, u });
    case 'undo': return t('suspUndo', { n: x.qty, u });

function renderReport() {
  const r = S.report;
  const box = $('#repOut');
  if (!r) { box.innerHTML = '<div class="empty">' + esc(t('repFirst')) + '</div>'; return; }
  const W = Math.max(280, Math.min(720, box.clientWidth - 26));
  const m = reportModel(r, vizTheme(false), W);
  const head = '<h2 class="scr">' + esc(m.title) + '</h2><div class="muted" style="margin-bottom:10px">' + esc(m.sub) + '</div>';
  if (!r.rows.length && !(r.requests || []).length) { box.innerHTML = head + (r.type === 'monthly' ? monthlyCloseHtml(r) : '') + '<div class="empty">' + esc(t('repEmpty')) + '</div>'; return; }
  box.innerHTML = head + '<div class="tiles">' + m.tiles.join('') + '</div>' +
    m.charts.map(c => '<div class="chart"><div class="ch-t">' + esc(c.title) + '</div>' + c.c.svg + '</div>').join('') +
    '<div class="rep-body">' + m.body + '</div>';
}
/** PDF: та же модель в светлой теме, графики — картинками; сохраняется в папку «Медпункт — отчёты PDF» на Google Диске. */
async function repPdf(btn) {
  if (!S.report) return toast(t('repFirst'), 'bad');
  const m = reportModel(S.report, vizTheme(true), 680);
  const old = btn.textContent;
  btn.disabled = true; btn.textContent = '⏳';
  $('#repLink').innerHTML = '<div class="muted">' + esc(t('pdfMaking')) + '</div>';
  try {
    const imgs = [];
    for (const c of m.charts) imgs.push({ title: c.title, src: await svgToPng(c.c), w: c.c.w, h: c.c.h });
    const html = pdfHtml(m, imgs);
    const r = await rpcA('makePdf', { title: m.title, html }, { timeout: 300000 });
    $('#repLink').innerHTML = '<a class="btn primary block" style="display:flex;align-items:center;justify-content:center;text-decoration:none;margin-bottom:6px" href="' + esc(r.url) + '" target="_blank" rel="noopener">' + esc(t('pdfReady')) + '</a>' +
      '<a class="btn ghost block" style="display:flex;align-items:center;justify-content:center;text-decoration:none" href="https://wa.me/?text=' + encodeURIComponent(m.title + '\n' + r.url) + '" target="_blank" rel="noopener">' + esc(t('pdfShare')) + '</a>';
  } catch (e) {
    $('#repLink').innerHTML = '';
  } finally { btn.disabled = false; btn.textContent = old; }
}
/** Конвертер Google в PDF может не знать эмодзи — в PDF они убираются. */
function noEmoji(v) { return String(v === null || v === undefined ? '' : v).replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{200D}]/gu, '').replace(/\s{2,}/g, ' ').trim(); }
function pdfHtml(m, imgs) {
  const tilesPlain = m.tiles.map(h => { const d = document.createElement('div'); d.innerHTML = h; const el = d.firstChild; return { v: el.querySelector('.tv').textContent, l: el.querySelector('.tl').textContent, k: el.className.replace('tile', '').trim() }; });
  const kc = { crit: '#d03b3b', warn: '#fab219', good: '#0ca30c' };

/* =====================================================================
 * v11: распознавание с фото.
 *  — FİN с удостоверения: сначала штрихкод/QR (если есть), потом машиночитаемые строки на обороте (MRZ «IDAZE…<<<»),
 *    потом надпись «FİN» на лицевой стороне. Подходит и для старых образцов — FİN ищется по тексту. Всё — на подтверждение.
 *  — Бланк / чек: распознаём текст и предлагаем, что подставить в форму (№ бланка, FİN, ФИО, дата рождения, пол, телефон,
 *    номер чека, время) — каждое поле можно исправить или не подставлять. Фото прикрепляется к форме.
 * Распознавание работает на телефоне (Tesseract). Первый раз нужен интернет — скачиваются ~5–9 МБ, дальше из памяти.
 * ===================================================================== */
const TESS = {
  js: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js',
  worker: 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/worker.min.js',
  core: 'https://cdn.jsdelivr.net/npm/tesseract.js-core@5.1.1'
};
const OCR_WORKERS = {};
async function ocrWorker(langs) {
  if (OCR_WORKERS[langs]) return OCR_WORKERS[langs];
  if (!window.Tesseract) {
    await loadScript(TESS.js);
    for (let i = 0; i < 100 && !window.Tesseract; i++) await new Promise(r => setTimeout(r, 100));
    if (!window.Tesseract) throw new Error('ocr-load');
  }
  OCR_WORKERS[langs] = Tesseract.createWorker(langs, 1, {
    workerPath: TESS.worker, corePath: TESS.core,
    logger: m => { if (m && m.status && /recogniz|load/.test(m.status) && S.ocrNote) S.ocrNote(m); }
  });
  OCR_WORKERS[langs].catch(() => { delete OCR_WORKERS[langs]; });
  return OCR_WORKERS[langs];
}
/** Фото → серое, контрастное, не больше 2200 px по длинной стороне (быстрее и точнее). */
async function ocrCanvas(file, rot) {
  const img = await fileToImage(file);
  const sc = Math.min(1, 2200 / Math.max(img.width, img.height));
  const w = Math.round(img.width * sc), h = Math.round(img.height * sc);
  const c = document.createElement('canvas');
  const ctx = c.getContext('2d');
  if (rot) { c.width = h; c.height = w; ctx.translate(h / 2, w / 2); ctx.rotate(rot * Math.PI / 180); ctx.drawImage(img, -w / 2, -h / 2, w, h); }
  else { c.width = w; c.height = h; ctx.drawImage(img, 0, 0, w, h); }
  const d = ctx.getImageData(0, 0, c.width, c.height);
  const px = d.data;
  let mn = 255, mx = 0;
  for (let i = 0; i < px.length; i += 4) { const g = (px[i] * 299 + px[i + 1] * 587 + px[i + 2] * 114) / 1000; px[i] = g; if (g < mn) mn = g; if (g > mx) mx = g; }
  const k = mx > mn ? 255 / (mx - mn) : 1;
  for (let i = 0; i < px.length; i += 4) { const g = Math.max(0, Math.min(255, (px[i] - mn) * k)); px[i] = px[i + 1] = px[i + 2] = g; }
  ctx.putImageData(d, 0, 0);
  return c;
}
async function ocrData(file, langs, rot) {
  const w = await ocrWorker(langs);
  const c = await ocrCanvas(file, rot || 0);
  const r = await w.recognize(c);
  return (r && r.data) || { text: '' };
}
async function ocrText(file, langs, rot) { return String((await ocrData(file, langs, rot)).text || ''); }

/* ---------- FİN: штрихкод → MRZ → надпись ---------- */
const FIN_RE = /^[0-9A-Z]{7}$/;
function finClean(s) { return String(s || '').toUpperCase().replace(/İ/g, 'I').replace(/[^0-9A-Z<\n ]/g, ''); }
/** Машиночитаемая зона удостоверения (3 строки по 30 знаков): ФИО, дата рождения, пол, FİN в доп. поле. */
function parseMrz(text) {
  const lines = String(text || '').toUpperCase().replace(/İ/g, 'I').split(/\n/).map(l => l.replace(/\s+/g, '').replace(/[«‹(\[{]/g, '<')).filter(l => (l.match(/</g) || []).length >= 2 && l.length >= 20);
  if (!lines.length) return null;
  const out = {};
  const l1 = lines.find(l => /^[I1][DO0<A-Z]?[A-Z<]{3}/.test(l) && /AZE/.test(l.slice(0, 8))) || lines.find(l => /^I[A-Z<]/.test(l));
  if (l1) {
    const opt = l1.slice(15, 30).replace(/</g, ' ').trim();
    const cand = opt.split(/\s+/).filter(x => FIN_RE.test(x));
    if (cand.length) out.fin = cand[0];
    else { const m = opt.replace(/\s+/g, '').match(/[0-9A-Z]{7}/); if (m) out.fin = m[0]; }
    out.doc = l1.slice(5, 14).replace(/</g, '');
  }
  const l2 = lines.find(l => /^\d{6}[0-9<][MF<]\d{6}/.test(l.replace(/O/g, '0')));
  if (l2) {
    const s = l2.replace(/O/g, '0');
    const yy = +s.slice(0, 2), mm = s.slice(2, 4), dd = s.slice(4, 6);
    const nowY = new Date().getFullYear() % 100;
    if (+mm >= 1 && +mm <= 12 && +dd >= 1 && +dd <= 31) out.birth = (yy > nowY ? 1900 + yy : 2000 + yy) + '-' + mm + '-' + dd;
    if (s[7] === 'M') out.sex = 'm'; else if (s[7] === 'F') out.sex = 'f';
  }
  const l3 = lines.find(l => /^[A-Z]+<<[A-Z]/.test(l));
  if (l3) {
    const parts = l3.split('<<');
    const sur = parts[0].replace(/</g, ' ').trim(), given = (parts[1] || '').replace(/</g, ' ').trim();
    const cap = s => s.toLowerCase().replace(/(^|\s)\S/g, x => x.toUpperCase());
    if (sur || given) out.name = cap([given, sur].filter(Boolean).join(' '));
  }
  return Object.keys(out).length ? out : null;
}
/** FİN по тексту: после надписи «FİN/FIN/ФИН», иначе — 7 знаков из букв и цифр (обязательно и то и то). */
function finFromText(text) {
  const up = String(text || '').toUpperCase().replace(/İ/g, 'I').replace(/Ф[ИI]Н/g, 'FIN');
  const m = up.match(/F[I1L|][NH][^0-9A-Z]{0,6}([0-9A-Z]{7})(?![0-9A-Z])/);
  if (m) return m[1];
  const toks = (up.match(/(?:^|[^0-9A-Z])([0-9A-Z]{7})(?![0-9A-Z])/g) || []).map(x => x.replace(/^[^0-9A-Z]/, ''));
  const good = toks.filter(x => /\d/.test(x) && /[A-Z]/.test(x) && !/^(AZE|IDAZE)/.test(x));
  return good[0] || '';
}
async function readIdCard(file, onStep) {
  // 1) штрихкод / QR (на некоторых образцах)
  try {
    const code = await decodeBarcode(file);
    if (code) {
      const mz = parseMrz(code.replace(/\r/g, '\n'));
      if (mz && mz.fin) return Object.assign(mz, { how: 'barcode' });
      const f = finFromText(code);
      if (f) return { fin: f, how: 'barcode' };
    }
  } catch (e) { }
  // 2) текст: машиночитаемые строки на обороте, надпись «FİN» на лицевой; если не вышло — повёрнутое фото
  for (const rot of [0, 90, 270]) {
    if (onStep) onStep(rot);
    const txt = await ocrText(file, 'eng', rot);
    const mz = parseMrz(txt);
    if (mz && mz.fin) return Object.assign(mz, { how: 'mrz', raw: txt });
    const f = finFromText(txt);
    if (f) return Object.assign(mz || {}, { fin: f, how: 'text', raw: txt });
  }
  return null;
}

/* ---------- бланк / чек: что можно подставить в форму ---------- */
function blankFields(text) {
  const t0 = String(text || '');
  const up = t0.toUpperCase().replace(/İ/g, 'I');
  const out = {};
  const mz = parseMrz(t0);
  if (mz) Object.assign(out, { fin: mz.fin, pBirth: mz.birth, pSex: mz.sex, pName: mz.name });
  if (!out.fin) { const f = finFromText(t0); if (f) out.fin = f; }
  const bn = t0.match(/(?:№|N[o°º]\.?|NO\.?|blank|бланк)\s*[:#]?\s*([0-9]{3,10})/i);
  if (bn) out.blankNo = bn[1];
  const dates = [];
  t0.replace(/\b(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4}|\d{2})\b/g, (m, d, mo, y) => { const Y = y.length === 2 ? (+y > 30 ? '19' + y : '20' + y) : y; if (+mo >= 1 && +mo <= 12 && +d >= 1 && +d <= 31) dates.push({ s: Y + '-' + String(mo).padStart(2, '0') + '-' + String(d).padStart(2, '0'), at: t0.indexOf(m) }); return m; });
  const birthLbl = /(do[ğg]um|рожд|д\.?\s?р\.?|birth)/i;
  const bd = dates.find(d => birthLbl.test(t0.slice(Math.max(0, d.at - 40), d.at))) || dates.find(d => d.s < String(new Date().getFullYear() - 1));
  if (bd && !out.pBirth) out.pBirth = bd.s;
  const tm = t0.match(/\b(\d{1,2}):(\d{2})\b/);
  const today = dates.find(d => d !== bd);
  if (today) out.arrivedAt = today.s + (tm ? 'T' + tm[1].padStart(2, '0') + ':' + tm[2] : '');
  const ph = t0.replace(/[\s()-]/g, '').match(/(?:\+?994|0)(?:10|12|50|51|55|60|70|77|99)\d{7}/);
  if (ph) out.phone = ph[0];
  const nm = t0.match(/(?:soyad[ıi],?\s*ad[ıi]|ad[ıi],?\s*soyad[ıi]|ф\.?\s?и\.?\s?о\.?|фамилия,?\s*имя|xəstə|пациент)\s*[:\-]?\s*([A-Za-zƏəÖöÜüĞğİıŞşÇçА-Яа-яЁё]+(?:\s+[A-Za-zƏəÖöÜüĞğİıŞşÇçА-Яа-яЁё]+){1,2})/i);
  if (nm && !out.pName) out.pName = nm[1].trim();
  if (/\b(ki[şs]i|муж)/i.test(t0) && !out.pSex) out.pSex = 'm';
  else if (/\b(qad[ıi]n|жен)/i.test(t0) && !out.pSex) out.pSex = 'f';
  const rc = up.match(/(?:FISKAL|ФИСКАЛ|ÇEK|CHEK|ЧЕК)[^0-9A-Z]{0,20}([0-9A-Z]{6,20})/);
  if (rc) out.receipt = rc[1];
  Object.keys(out).forEach(k => { if (!out[k]) delete out[k]; });
  return out;
}

/** Список форм для <select>: по группам; старая форма карточки («без уточнения») видна, только если она уже стоит. */
function formOptsHtml(list, cur) {
  const lbl = f => esc(S.lang === 'az' ? f[4] : f[3]);
  let h = '', g = null, open = false;
  if (cur && !list.some(f => f[0] === cur)) {
    const lg = (window.FORMS_LEGACY || []).find(f => f[0] === cur);
    h += '<option value="' + esc(cur) + '" selected>' + (lg ? lbl(lg) : esc(cur)) + '</option>';
  }
  list.forEach(f => {
    if (f[6] && f[6] !== g) { if (open) h += '</optgroup>'; g = f[6]; h += '<optgroup label="' + esc(S.lang === 'az' ? g[1] : g[0]) + '">'; open = true; }
    h += '<option value="' + f[0] + '"' + (cur && f[0] === cur ? ' selected' : '') + '>' + lbl(f) + '</option>';
  });
  return h + (open ? '</optgroup>' : '');
}

/** Форма по тексту названия/дозы; cat — 'med' / 'sup' / '' (тогда сначала расходники). */
function guessForm(text, cat) {
  const s = String(text || '');
  const lists = cat === 'med' ? [GUESS_MED] : cat === 'sup' ? [GUESS_SUP] : [GUESS_SUP, GUESS_MED];
  for (const L of lists) for (const [re, code] of L) if (re.test(s)) return code;
  return '';
}
(function () {
  if (typeof bulkMatchRow !== 'function') return;
  const orig = bulkMatchRow;
  const BY_UNIT = { amp: 'med_amp', vial: 'med_vial', tab: 'med_tab', cap: 'med_cap', neb: 'med_neb', tube: 'med_oint', sachet: 'med_sach', bottle: 'med_solor', dose: 'med_vacc' };
  window.bulkMatchRow = function (row, unitGiven) {
    const r = orig.apply(this, arguments);
    const it = row.item;
    if (row.match) return r;
    const txt = it.name + ' ' + (it.dosage || '');
    const sup = guessForm(it.name, 'sup');
    if (sup) { it.category = 'sup'; it.form = sup; if (!unitGiven) it.unit = formInfo(sup).unit; return r; }
    let g = guessForm(txt, 'med');
    const u = BY_UNIT[unitGiven || ''];
    if (u && (!g || g === 'med_solor' || g === 'med_tab')) g = u;
    it.category = 'med';
    it.form = g || 'med_other'; // «без уточнения» — в списке попросит выбрать форму
    if (!unitGiven && g) it.unit = formInfo(g).unit;
    return r;
  };
})();

const MON_AZ = { yan: 1, fev: 2, mar: 3, apr: 4, may: 5, iyn: 6, iyl: 7, avq: 8, sen: 9, okt: 10, noy: 11, dek: 12, jan: 1, feb: 2, jun: 6, jul: 7, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
/** Срок годности из текста: «Son istifadə tarixi / Годен до / EXP 03.2028 / 2028-03 / 31.03.2028». Дата изготовления — не срок. */
function boxExpiry(text) {
  const t0 = String(text || '');
  const lab = /(son\s*istifad[əe]\s*tarixi|istifad[əe]\s*m[üu]dd[əe]ti|yararl[ıi]l[ıi]q|годен\s*до|срок\s*годности|годен|exp(?:iry|\.|iration)?|use\s*by|best\s*before|s\.?\s*i\.?\s*t\.?)/ig;
  const mk = (y, m, d) => { y = +y; if (y < 100) y += 2000; m = +m; if (!(m >= 1 && m <= 12) || y < 2000 || y > 2100) return ''; const dd = d ? Math.min(+d, 31) : lastDay(y, m); return y + '-' + String(m).padStart(2, '0') + '-' + String(dd).padStart(2, '0'); };
  const dateAt = s => {
    let m = s.match(/(\d{1,2})[.\/\-](\d{1,2})[.\/\-](\d{2,4})/); if (m && +m[2] <= 12) return mk(m[3], m[2], m[1]);
    m = s.match(/(\d{4})[.\/\-](\d{1,2})(?:[.\/\-](\d{1,2}))?/); if (m) return mk(m[1], m[2], m[3]);
    m = s.match(/(\d{1,2})[.\/\-](\d{2,4})/); if (m) return mk(m[2], m[1]);
    m = s.match(/([a-zа-я]{3})[a-zа-я]*[.\s\/-]*(\d{2,4})/i); if (m && MON_AZ[m[1].toLowerCase()]) return mk(m[2], MON_AZ[m[1].toLowerCase()]);
    return '';
  };
  let mm;
  while ((mm = lab.exec(t0))) { const d = dateAt(t0.slice(mm.index + mm[0].length, mm.index + mm[0].length + 30)); if (d) return d; }
  // без надписи: самая поздняя дата в будущем (дата изготовления — раньше)
  const all = [];
  t0.replace(/\b(\d{1,2})[.\/](\d{1,2})[.\/](\d{2,4})\b|\b(\d{1,2})[.\/](20\d{2})\b/g, (m0, d, mo, y, mo2, y2) => { const v = y ? mk(y, mo, d) : mk(y2, mo2); if (v) all.push(v); return m0; });
  const fut = all.filter(d => d > bakuToday()).sort();
  return fut.length ? fut[fut.length - 1] : '';
}
/** Серия: «Seriya / Серия / LOT / Batch / Partiya / B.N.» и код после неё. */
function boxSeries(text) {
  const m = String(text || '').match(/(?:seriya|seria|серия|сер\.|lot|batch|partiya|партия|b\.?\s?n\.?|ch\.?-?b\.?)\s*[:№#.]?\s*([A-Z0-9][A-Z0-9\-\/]{2,15})/i);
  return m ? m[1].toUpperCase() : '';
}
/** Доза с коробки: «500 mg», «100 мг/мл», «0,9%», «5 ml». */
function boxDoses(text) {
  const out = [];
  String(text || '').replace(/(\d+(?:[.,]\d+)?)\s*(mq|mg|мг|mkq|mcg|мкг|q|g|г|IU|ME|МЕ|ЕД|BV|%)(?:\s*\/\s*(\d+(?:[.,]\d+)?)?\s*(ml|мл|doza|доза|dose))?/gi, (m) => { out.push(normDose(m)); return m; });
  const vols = [];
  String(text || '').replace(/(\d+(?:[.,]\d+)?)\s*(ml|мл)\b/gi, (m, n) => { vols.push(n.replace('.', ',')); return m; });
  return { doses: out, vols };
}
/** Фирма с коробки: самое длинное совпадение слов текста с названиями каталога (и с карточками базы). */
// слова формы выпуска и упаковки — не фирма (в реестре есть даже «İNYEKSİYA ÜÇÜN MƏHLUL»)
const BOX_GENERIC = /^(inyeksiya|infuziya|ucun|üçün|mehlul|məhlul|tablet|tabletler|kapsul|ampul|ampulada|flakon|damci|damcı|melhem|məlhəm|krem|gel|sprey|toz|serbet|şərbət|suspenziya|istifade|istifadə|tarixi|seriya|son|xarici|daxile|раствор|для|инъекций|таблетки|капсулы|ампулы|мазь|крем|гель|серия|годен|до|solution|for|injection|tablets|capsules|film|coated|mg|ml)$/i;
function boxBrand(text, bigText) {
  const split = s => String(s || '').replace(/[®™©]/g, ' ').split(/[^A-Za-zА-Яа-яЁёƏəÖöÜüĞğİıŞşÇçІіЇїЄєҐґ0-9\-]+/).filter(w => w.length >= 3);
  const words = split(text);
  const big = {}; split(bigText).forEach(w => { big[skel(w)] = 1; });
  const { doses, vols } = boxDoses(text);
  let best = null;
  const take = (cand, n) => { if (!best || n > best.n) best = Object.assign(cand, { n }); };
  for (let i = 0; i < words.length; i++) for (let k = 3; k >= 1; k--) {
    if (i + k > words.length) continue;
    const ws = words.slice(i, i + k);
    if (ws.every(w => BOX_GENERIC.test(w.replace(/İ/g, 'I').toLowerCase()))) continue;
    if (BOX_GENERIC.test(ws[0].replace(/İ/g, 'I').toLowerCase())) continue;
    const sk = skel(ws.join(' '));
    if (sk.length < 4) continue;
    // очки: длина совпадения + крупный шрифт (обычно это фирма) + доза на коробке совпадает с вариантом реестра
    const bonus = (ws.some(w => big[skel(w)]) ? 15 : 0);
    const base = S.view.items.find(it => skel(it.name) === sk);
    if (base) take({ kind: 'item', item: base }, sk.length + bonus + 5);
    const reg = S.catBy && S.catBy[sk];
    if (reg && reg.length) {
      const dm = reg.some(e => doses.some(d => normDose(e.d).indexOf(d) !== -1)) ? 10 : 0;
      take({ kind: 'cat', list: reg }, sk.length + bonus + dm);
    }
    const sup = S.supBy && S.supBy[sk];
    if (sup && sup.length) take({ kind: 'sup', list: sup }, sk.length + bonus);
  }
  return best;
}
/** Что нашлось на фото коробки → варианты для окна проверки. */
function boxParse(text, gs, bigText) {
  const res = { name: '', form: '', dose: '', series: '', expiry: '', mfr: '', barcode: '', pick: null };
  if (gs) { res.series = gs.series || ''; res.expiry = gs.expiry || ''; res.barcode = gs.gtin || gs.ean || ''; }
  const bb = boxBrand(text, bigText);
  const { doses, vols } = boxDoses(text);
  if (bb && bb.kind === 'item') { res.pick = { kind: 'item', item: bb.item }; res.name = bb.item.name; res.form = bb.item.form; res.dose = bb.item.dosage; }
  else if (bb && bb.kind === 'cat') {
    // из вариантов фирмы — тот, чья доза (и объём) есть на коробке
    const sc = e => { const d = normDose(e.d); let s = 0; doses.forEach(x => { if (d.indexOf(x) !== -1) s += 3; }); vols.forEach(v => { if (e.d.indexOf(v + ' мл') !== -1) s += 2; }); return s; };
    const list = bb.list.slice().sort((a, b) => sc(b) - sc(a));
    const e = list[0];
    res.pick = { kind: 'cat', e, alts: list.slice(0, 12) };
    res.name = e.b; res.form = e.code; res.dose = e.d; res.mfr = e.mfr || '';
  } else if (bb && bb.kind === 'sup') {
    const e = bb.list.find(x => vols.some(v => x.z.indexOf(v) !== -1) || doses.some(d => normDose(x.z).indexOf(d) !== -1)) || bb.list[0];
    res.pick = { kind: 'sup', e }; res.name = e.ru; res.form = e.code; res.dose = e.z;
  } else {
    res.dose = doses[0] || (vols[0] ? vols[0] + ' мл' : '');
  }
  // форма не пришла из каталога — по словам на коробке («ампулы», «таблетки, покрытые оболочкой», «göz damcısı»…)
  if (!res.form && typeof guessForm === 'function') res.form = guessForm(text, S.rcv && S.rcv.cat === 'sup' ? 'sup' : 'med');
  if (!res.series) res.series = boxSeries(text);
  if (!res.expiry) res.expiry = boxExpiry(text);
  if (!res.mfr) { const m = String(text).match(/(?:istehsalçı|производитель|manufacturer|изготовитель|mfd\.?\s*by)\s*[:\-]?\s*([^\n]{3,60})/i); if (m) res.mfr = m[1].trim(); }
  return res;
}
async function boxPhotoFile(file) {
  openModal('<h3>' + esc(t('boxReading')) + '</h3><div class="muted" id="ocrProg">' + esc(t('ocrLoading')) + '</div><div class="muted" style="margin-top:8px">' + esc(t('ocrFirstTime')) + '</div>');
  ocrProgress(t('ocrReading'));
  let gs = null, txt = '';
  try { const code = await decodeBarcode(file); if (code) gs = parseGs1(code) || { ean: String(code).trim() }; } catch (e) { }
  let big = '';
  try {
    const data = await ocrData(file, 'aze+rus+eng');
    txt = String(data.text || '');
    // самые крупные строки на коробке — обычно название
    const lines = (data.lines || []).map(l => ({ t: l.text, h: l.bbox ? l.bbox.y1 - l.bbox.y0 : 0 })).filter(l => l.t && l.t.trim());
    lines.sort((a, b) => b.h - a.h);
    big = lines.slice(0, 2).map(l => l.t).join(' ');
  } catch (e) { if (!gs) { closeModal(); return toast(t('ocrNoNet'), 'bad', null, 8000); } }
  S.ocrNote = null;
  const r = boxParse(txt, gs, big);
  S.boxFound = r;
  S.boxFile = file;
  boxReviewModal(r, txt);
}
function boxReviewModal(r, raw) {
  const fOpts = FORMS[S.rcv.cat === 'sup' || (r.pick && r.pick.kind === 'sup') ? 'sup' : 'med'];
  const row = (k, lbl, ctl) => '<div class="field"><label class="check" style="margin:0 0 4px"><input type="checkbox" id="bxOn_' + k + '"' + (r[k] ? ' checked' : '') + '><span>' + esc(lbl) + '</span></label>' + ctl + '</div>';
  const inp = (k, ph) => '<input type="text" id="bx_' + k + '" value="' + esc(r[k] || '') + '" placeholder="' + esc(ph || '') + '">';
  const alts = r.pick && r.pick.kind === 'cat' && r.pick.alts.length > 1 ? '<div class="lbl" style="margin:4px 0">' + esc(t('boxAlts')) + '</div><div class="chips">' + r.pick.alts.map((e, i) => '<button class="chip' + (i === 0 ? ' on' : '') + '" data-act="boxAlt" data-i="' + i + '">' + esc(e.d + ' · ' + formName(e.code)) + '</button>').join('') + '</div>' : '';
  openModal('<h3>' + esc(t('boxFound')) + '</h3><div class="muted" style="margin-bottom:10px">' + esc(t('scanCheck')) + '</div>' +
    row('name', t('boxName'), inp('name')) + alts +
    row('form', t('formLabel'), '<select id="bx_form">' + formOptsHtml(fOpts, r.form) + '</select>') +
    row('dose', t('doseResult'), inp('dose')) +
    row('series', t('seriesLabel'), inp('series')) +
    row('expiry', t('expiryLabel'), '<input type="date" id="bx_expiry" value="' + esc(r.expiry || '') + '">') +
    row('mfr', t('boxMfr'), inp('mfr')) +
    (r.barcode ? row('barcode', t('barcodeLabel'), inp('barcode')) : '') +
    '<div class="note">' + esc(t('boxPackNote')) + '</div>' +
    (raw ? '<details class="card f-sec" style="margin-top:8px"><summary>' + esc(t('scanRaw')) + '</summary><pre style="white-space:pre-wrap;font-size:12px;max-height:200px;overflow:auto">' + esc(String(raw).slice(0, 3000)) + '</pre></details>' : '') +
    '<div class="acts"><button class="btn ghost" data-act="closeModal">' + esc(t('cancel')) + '</button><button class="btn primary" data-act="boxApply">' + esc(t('scanApply')) + '</button></div>');
}
function boxAltPick(i) {
  const r = S.boxFound; if (!r || !r.pick || !r.pick.alts) return;
  const e = r.pick.alts[i]; if (!e) return;
  r.pick.e = e;
  $('#bx_dose').value = e.d; $('#bx_form').value = e.code; $('#bx_name').value = e.b;
  $$('[data-act=boxAlt]').forEach((b, k) => b.classList.toggle('on', k === i));
}
function boxApply() {
  const r = S.boxFound; if (!r) return closeModal();
  const on = k => { const c = $('#bxOn_' + k); return c && c.checked; };
  const val = k => { const el = $('#bx_' + k); return el ? el.value.trim() : ''; };
  // выбранная строка каталога / карточка базы — как будто её выбрали в подсказке (форма, МНН, единица, упаковка)
  if (on('name') && r.pick) {
    if (r.pick.kind === 'item') fillFromItem(r.pick.item);
    else if (r.pick.kind === 'cat') catFill(r.pick.e);
    else if (r.pick.kind === 'sup') supFill(r.pick.e);
  }
  if (on('name')) $('#rcvName').value = val('name');
  if (on('form') && val('form')) { const cat = formInfo(val('form')).cat; if (S.rcv.cat !== cat) { S.rcv.cat = cat; renderReceiveSelects(); } $('#rcvForm').value = val('form'); $('#rcvUnit').value = formInfo(val('form')).unit; }
  if (on('dose')) $('#rcvDose').value = val('dose');
  if (on('series')) $('#rcvSeries').value = val('series').toUpperCase();
  if (on('expiry') && /^\d{4}-\d{2}-\d{2}$/.test(val('expiry'))) {
    const e = val('expiry');
    $('#rcvNoExp').checked = false; $('#rcvExpWrap').classList.remove('hidden');
    $('#rcvExpY').value = e.slice(0, 4); $('#rcvExpM').value = e.slice(5, 7);
    $('#rcvExpD').value = +e.slice(8, 10) === lastDay(+e.slice(0, 4), +e.slice(5, 7)) ? '' : e.slice(8, 10);
  }
  if (on('mfr') && val('mfr') && !$('#rcvPackInfo').value.includes(val('mfr'))) $('#rcvPackInfo').value = ($('#rcvPackInfo').value ? $('#rcvPackInfo').value + ' · ' : '') + val('mfr');
  if (on('barcode') && val('barcode')) $('#rcvBarcode').value = val('barcode');
  // количество в упаковке — только человек
  $('#rcvPackCount').value = '';
  updateDoseLabel(); updateQtyCalc();
  closeModal();
  $('#rcvNameNote').innerHTML = '<div class="note fix">✓ ' + esc(t('boxApplied')) + '</div>';
  ($('#rcvPackCount').closest('.field').classList.contains('hidden') ? $('#rcvQty') : $('#rcvPackCount')).focus();
}
Object.assign(H, {
  boxPhoto: () => { const f = $('#fileBoxPhoto'); f.value = ''; f.click(); },
  boxApply: () => boxApply(),
  boxAlt: el => boxAltPick(+el.dataset.i)
});

  const go = () => { try { rcvLooseInit(); renderDoseParts(); } catch (e) { } };

})();

  vizTipInit();
  applyStatic();
  buildRefIdx(LS.get('MED2_REF', null));

}

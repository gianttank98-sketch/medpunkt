  const numCol = tb.rows.length ? tb.rows[0].map((_, j) => tb.rows.every(r => r[j] === '' || r[j] === null || typeof r[j] === 'number' || /^[+−-]?\d+$/.test(String(r[j])))) : [];
  return '<!DOCTYPE html><html><head><meta charset="utf-8"><style>' +
    'body{font-family:Arial,Helvetica,sans-serif;color:#0b0b0b;font-size:10.5px;margin:22px 26px}' +
    '.brand{color:#52514e;font-size:10px;letter-spacing:.3px;text-transform:uppercase}h1{font-size:19px;margin:4px 0 2px}.sub{color:#52514e;margin-bottom:14px;font-size:11px}' +
    'table.tiles{border-collapse:separate;border-spacing:6px 0;margin:0 -6px 14px;width:100%}table.tiles td{border:1px solid #e1e0d9;border-radius:8px;padding:9px 11px;vertical-align:top}' +
    '.tv{font-size:20px;font-weight:bold}.tl{color:#52514e;font-size:10px;margin-top:2px}' +
    'h2{font-size:12.5px;margin:14px 0 6px}.ch{margin-bottom:6px}' +
    'table.t{width:100%;border-collapse:collapse;margin-top:6px}table.t th{background:#f0efec;text-align:left;padding:5px 6px;font-size:9.5px;border-bottom:1px solid #c3c2b7}' +
    'table.t td{padding:4px 6px;border-bottom:1px solid #e1e0d9;font-size:9.5px;vertical-align:top}td.n,th.n{text-align:right}' +
    '.foot{color:#898781;font-size:9px;margin-top:14px}</style></head><body>' +
    '<div class="brand">' + esc(t('reportFor')) + '</div><h1>' + esc(m.title) + '</h1><div class="sub">' + esc(m.sub) + '</div>' +
    (tb.notes || []).map(n => '<div style="border-left:3px solid #fab219;padding:4px 8px;margin:0 0 8px;background:#fbf8ef">' + esc(noEmoji(n)) + '</div>').join('') +
    '<table class="tiles"><tr>' + tilesPlain.map(x => '<td style="' + (kc[x.k] ? 'border-left:4px solid ' + kc[x.k] : '') + '"><div class="tv">' + esc(x.v) + '</div><div class="tl">' + esc(x.l) + '</div></td>').join('') + '</tr></table>' +
    imgs.map(c => '<h2>' + esc(noEmoji(c.title)) + '</h2><div class="ch"><img src="' + c.src + '" width="' + c.w + '" height="' + c.h + '"></div>').join('') +
    (tb.rows.length ? '<table class="t"><thead><tr>' + tb.header.map((h, j) => '<th' + (numCol[j] ? ' class="n"' : '') + '>' + esc(h) + '</th>').join('') + '</tr></thead><tbody>' +
      tb.rows.map(r => '<tr>' + r.map((v, j) => '<td' + (numCol[j] ? ' class="n"' : '') + '>' + esc(noEmoji(v)) + '</td>').join('') + '</tr>').join('') + '</tbody></table>' : '') +
    '<div class="foot">' + esc(t('generated', { d: fmtDt(nowBakuStr()) })) + '</div></body></html>';
}

/* ---------- хранение на телефоне ---------- */
function fKey() { return 'MED5_FORMS:' + (S.me ? S.me.id : '') + ':' + S.storeId; }
function fCache() {
  if (!S.fc || S.fc.key !== fKey()) { const c = LS.get(fKey(), null) || {}; S.fc = { key: fKey(), list: c.list || [], full: c.full || {}, ts: c.ts || 0 }; }
  return S.fc;
}
function fSaveCache() {
  const c = fCache();
  // держим на телефоне только недавние и неотправленные формы
  const pend = {};
  S.queue.forEach(o => { if (o.payload && o.payload.id && /^form/.test(o.action)) pend[o.payload.id] = 1; if (o.payload && o.payload.formId) pend[o.payload.formId] = 1; });
  const ids = Object.keys(c.full).sort((a, b) => (c.full[b]._seen || 0) - (c.full[a]._seen || 0));
  ids.forEach((id, i) => { if (!pend[id] && (i >= 25 || Date.now() - (c.full[id]._seen || 0) > 4 * 86400000)) delete c.full[id]; });
  if (!LS.set(c.key, { list: c.list.slice(0, 150), full: c.full, ts: c.ts })) LS.set(c.key, { list: [], full: c.full, ts: 0 });
}
function newFormId() {
  let r = '';
  try { const a = new Uint8Array(6); crypto.getRandomValues(a); r = Array.from(a, b => (b % 36).toString(36)).join(''); } catch (e) { r = Math.random().toString(36).slice(2, 8); }
  return ('F' + Date.now().toString(36) + r).toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 24);
}
function nowLocal() { return new Date(Date.now() + 4 * 3600e3).toISOString().slice(0, 16); }

/** Заплатка накладывается так же, как на сервере: строки таблиц — по полям, null — удалить. */
const F_ROWS = { vit: 1, rx: 1, cons: 1 };
const F_BAD = { __proto__: 1, constructor: 1, prototype: 1 };
const fOwn = (o, k) => Object.prototype.hasOwnProperty.call(o, k);
function mergePatch(d, patch) {
  Object.keys(patch || {}).forEach(k => {
    if (k === '__proto__' || fOwn(F_BAD, k)) return;
    const v = patch[k];
    if (fOwn(F_ROWS, k)) {
      const rows = fOwn(d, k) && d[k] && typeof d[k] === 'object' ? d[k] : (d[k] = {});
      Object.keys(v || {}).forEach(rid => {
        if (rid === '__proto__' || fOwn(F_BAD, rid)) return;
        if (v[rid] === null) { delete rows[rid]; return; }
        const row = fOwn(rows, rid) ? rows[rid] : (rows[rid] = {});
        Object.keys(v[rid]).forEach(f => { if (f === '__proto__' || fOwn(F_BAD, f)) return; if (v[rid][f] === null) delete row[f]; else row[f] = v[rid][f]; });
      });
    } else if (v === null) delete d[k];
    else d[k] = v;
  });
  return d;
}

/** Фото документа: до 2000 px по длинной стороне, JPEG — текст ЭКГ и анализов остаётся читаемым. */
async function photoB64(file, maxSide) {
  const img = await fileToImage(file);
  const sc = Math.min(1, maxSide / Math.max(img.width, img.height));
  const c = document.createElement('canvas');
  c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  for (const q of [0.82, 0.7, 0.55]) { const u = c.toDataURL('image/jpeg', q); if (u.length < 4.5e6) return u.split(',')[1]; }
  throw new Error('big');
}

/* ---------- витальные показатели: подсветка тревожных ---------- */
function vitLevel(f, v) {
  if (v === '' || v === null || v === undefined || isNaN(+v)) return '';
  v = +v;
  const lv = (crit, warn) => crit ? 'crit' : warn ? 'warn' : '';
  switch (f) {
    case 'bpRs': case 'bpLs': return lv(v < 90 || v >= 180, v < 100 || v >= 160);
    case 'bpRd': case 'bpLd': return lv(v >= 120, v >= 100 || v < 50);
    case 'pulse': return lv(v < 40 || v >= 130, v < 50 || v >= 110);
    case 'spo2': return lv(v < 90, v < 95);
    case 'rr': return lv(v < 8 || v >= 30, v < 12 || v >= 22);
    case 'temp': return lv(v < 35 || v >= 39.5, v < 35.5 || v >= 37.5);
    case 'glu': return v > 35 ? lv(v < 54 || v >= 400, v < 70 || v >= 250) : lv(v < 3 || v >= 22, v < 3.9 || v >= 13.9);
    default: return '';
  }
}
/** Отмечен ли вариант в списке с несколькими ответами (анализы, исследования, осмотр). */
function isOn(d, k, code) { return d[k + '_' + code] === true || String(d[k] || '').split(',').indexOf(code) !== -1; }

function ageOf(birth, at) {
  if (!/^\d{4}-\d{2}-\d{2}$/.test(birth || '')) return '';
  const day = (at || bakuToday()).slice(0, 10);
  let y = +day.slice(0, 4) - +birth.slice(0, 4);

  return y >= 0 && y < 130 ? y : '';
}
function rowsOf(d, k) { const m = d[k] || {}; return Object.keys(m).map(id => Object.assign({ _id: id }, m[id])).sort((a, b) => String(a.ord || a._id).localeCompare(String(b.ord || b._id))); }

    patient: [d.pName, d.pFather].filter(Boolean).join(' '), fin: String(d.fin || '').toUpperCase(), birthDate: d.pBirth || '', sex: d.pSex || '', triage: d.triage || '',

}

/* ---------- Защита от двойного пациента ----------

 * 3) то же имя (без FİN и даты рождения) в тот же день. Предупреждаем в форме и спрашиваем при закрытии. */

function fDupWarn(id) {

  const out = [];
  const rows = fListRows().filter(x => x.id !== id);
  const bn = String(me.blankNo || '').toUpperCase().replace(/[\s№#.\-]/g, '');
  const tm = s => { const v = Date.parse(String(s || '').replace(' ', 'T') + ':00'); return isNaN(v) ? 0 : v; };
  const myT = tm(me.arrivedAt) || Date.now();
  const nm2 = fNameSk(String(me.patient).split(' ').slice(0, 2).join(' '));
  const seen = {};
  const say = (x, why) => { if (seen[x.id]) return; seen[x.id] = 1; out.push({ id: x.id, text: t(why, { b: x.blankNo || '—', p: x.patient || '', d: fmtDt(x.arrivedAt || x.createdAt) }) }); };

  });
  const near = x => Math.abs((tm(x.arrivedAt || x.createdAt) || 0) - myT) < 12 * 3600000;

}

  const L2 = r => esc(fdLabel(r));
  const val = k => d[k] === undefined || d[k] === null ? '' : d[k];
  const inp = (k, label, o) => { o = o || {}; return '<div class="field' + (o.cls ? ' ' + o.cls : '') + '"><label>' + esc(label) + '</label><input type="' + (o.type || 'text') + '" data-f="' + k + '" value="' + esc(val(k)) + '"' + (o.ph ? ' placeholder="' + esc(o.ph) + '"' : '') + (o.im ? ' inputmode="' + o.im + '"' : '') + ' maxlength="' + (o.max || 300) + '" autocomplete="off"></div>'; };
  const ta = (k, label, o) => '<div class="field"><label>' + esc(label) + '</label><textarea data-f="' + k + '" maxlength="' + ((o && o.max) || 3000) + '">' + esc(val(k)) + '</textarea></div>';
  const seg = (k, list, o) => '<div class="chips f-chips">' + list.map(x => '<button type="button" class="chip' + (val(k) === x[0] ? ' on' : '') + (o && o.color ? ' tri-' + x[0] : '') + '" data-act="fSetV" data-f="' + k + '" data-v="' + x[0] + '">' + L2(x) + '</button>').join('') + '</div>';

  const al = allergyText(d);
  const age = ageOf(d.pBirth, d.arrivedAt);

  // 1. пациент
  const hist = S.fHist && S.fHist.id === id ? S.fHist.rows : [];

  const sPatient = (ro ? '' : '<button type="button" class="btn small ghost block" style="margin-bottom:10px" data-act="fScanBlank" data-kind="blank">' + esc(t('scanBlankBtn')) + '</button>') + '<div class="grid2 stack">' + inp('pName', L(['Имя, фамилия', 'Ad / Soyad']), { max: 120 }) + inp('pFather', L(['Отчество', 'Ata adı']), { max: 60 }) + '</div>' +
    '<div class="grid2"><div class="field"><label>' + esc(L(['Дата рождения', 'Doğum tarixi'])) + '<b id="fAgeLbl">' + (age !== '' ? ' · ' + esc(t('fAge', { n: age })) : '') + '</b></label><input type="date" data-f="pBirth" value="' + esc(val('pBirth')) + '"></div>' +
    '<div class="field"><label>FİN</label><div class="row" style="gap:6px"><input type="text" data-f="fin" maxlength="7" autocapitalize="characters" class="grow ' + (finOk(d.fin) ? '' : 'f-bad') + '" value="' + esc(String(val('fin')).toUpperCase()) + '">' + (ro ? '' : '<button type="button" class="btn icon ghost" data-act="fScanId" title="' + esc(t('scanIdBtn')) + '">🪪</button>') + '</div><div class="note f-finnote' + (finOk(d.fin) ? ' hidden' : '') + '" style="margin:2px 0 0;color:var(--red)">' + esc(t('fFinBad')) + '</div></div></div>' +

    (hist.length ? '<div class="info">' + esc(t('fHistoryN', { n: hist.length })) + ': ' + hist.slice(0, 5).map(h => '<a href="#" data-act="fOpen" data-id="' + esc(h.id) + '">№' + esc(h.blankNo || '—') + ' ' + esc(fmtDate(String(h.arrivedAt || h.createdAt).slice(0, 10))) + (h.dx ? ' — ' + esc(h.dx) : '') + '</a>').join('; ') +
      (histAl.length ? '<div style="color:var(--red);font-weight:700;margin-top:4px">⚠️ ' + esc(t('fHistoryAllergy', { a: histAl.join(', ') })) + '</div>' : '') + '</div>' : '') +
    '<div class="field"><label>' + esc(t('fReceipt')) + '</label><div class="row"><input type="text" class="grow" data-f="receipt" maxlength="120" value="' + esc(val('receipt')) + '"><button type="button" class="btn icon ghost" data-act="fScanReceipt" title="' + esc(t('fReceiptScan')) + '">🔍</button><button type="button" class="btn icon ghost" data-act="fScanBlank" data-kind="receipt" title="' + esc(t('scanReceiptBtn')) + '">🔤</button><button type="button" class="btn icon ghost" data-act="fPhoto" data-kind="receipt" title="' + esc(t('fReceiptPhoto')) + '">📷</button></div></div>' +
    '<div class="field"><label>' + esc(t('fArrivedAt')) + '</label><input type="datetime-local" data-f="arrivedAt" value="' + esc(String(val('arrivedAt')).replace(' ', 'T')) + '"></div>' +
    '<div class="field"><label>' + esc(L(['Вид поступления', 'Gəlişin növü'])) + '</label>' + seg('arrType', FD.arrType) + (d.arrType === 'other' ? inp('arrTypeO', t('fOther')) : '') + '</div>' +
    '<div class="field"><label>' + esc(L(['Откуда доставлен', 'Xəstənin gəldiyi yer'])) + '</label>' + seg('arrFrom', FD.arrFrom) + (d.arrFrom === 'other' ? inp('arrFromO', t('fOther')) : '') + '</div>' +
    '<div class="field"><label>' + esc(t('fFlags')) + '</label>' + FD.flags.map(x => chk(x[0], fdLabel(x))).join('') + inp('flagO', t('fOther')) + '</div>';

  // 2. триаж и показатели
  const vits = rowsOf(d, 'vit');
  const vin = (r, fl, ph, w) => { const v = r[fl] === undefined ? '' : r[fl]; const lv = vitLevel(fl, v); return '<input type="' + (fl === 't' ? 'time' : 'number') + '" step="any" inputmode="decimal" class="v-in' + (lv ? ' v-' + lv : '') + '" style="width:' + (w || 64) + 'px" data-row="vit" data-rid="' + esc(r._id) + '" data-rf="' + fl + '" value="' + esc(v) + '" placeholder="' + esc(ph) + '">'; };
  const sTriage = '<div class="field"><label>' + esc(L(['Триаж', 'Triaj'])) + '</label>' + seg('triage', FD.triage, { color: 1 }) + '</div>' + inp('triBy', t('fTriageBy'), { max: 80 }) +
    '<div class="lbl">' + esc(t('fVitals')) + '</div>' + vits.map(r => '<div class="f-vit">' +
      '<div class="row wrap">' + vin(r, 't', '', 96) + '<span class="muted">' + esc(r.byName || '') + '</span><span class="grow"></span>' + (ro ? '' : '<button type="button" class="btn small ghost" data-act="fRowDel" data-row="vit" data-rid="' + esc(r._id) + '">✕</button>') + '</div>' +
      '<div class="f-vgrid"><label>' + esc(t('fBpR')) + '<span>' + vin(r, 'bpRs', '') + '/' + vin(r, 'bpRd', '') + '</span></label><label>' + esc(t('fBpL')) + '<span>' + vin(r, 'bpLs', '') + '/' + vin(r, 'bpLd', '') + '</span></label>' +
      '<label>' + esc(t('fPulse')) + vin(r, 'pulse', '') + '</label><label>' + esc(t('fSpo2')) + vin(r, 'spo2', '') + '</label><label>' + esc(t('fRr')) + vin(r, 'rr', '') + '</label><label>' + esc(t('fTemp')) + vin(r, 'temp', '') + '</label><label>' + esc(t('fGlu')) + vin(r, 'glu', '') + '</label></div></div>').join('') +
    (ro ? '' : '<button type="button" class="btn ghost block" data-act="fVitAdd">' + esc(t('fVitAdd')) + '</button>') +
    '<div class="lbl" style="margin-top:12px">' + esc(L(['Эпиданамнез', 'Epid. anamnez'])) + '</div>' + FD.epi.map(q => '<div class="f-q"><div>' + L2(q) + '</div>' + seg(q[0], [['y', t('fYes'), t('fYes')], ['n', t('fNo'), t('fNo')]]) + '</div>').join('');

  // 3. жалобы и анамнез
  const sHist = ta('compl', L(['Жалобы', 'Şikayət'])) +
    (d.pSex !== 'm' ? '<div class="field"><label>' + esc(L(['Беременность', 'Hamiləlik vəziyyəti'])) + '</label>' + seg('preg', FD.preg) + inp('pregO', t('fOther')) + '</div>' : '') +
    '<div class="field"><label>' + esc(L(['Аллергия', 'Alergiya'])) + '</label><input type="text" data-f="allergy" maxlength="300" class="' + (al ? 'f-allergy' : '') + '" value="' + esc(val('allergy')) + '"' + (d.allergyNone ? ' disabled' : '') + '></div>' + chk('allergyNone', t('formNoAllergyKnown')) +
    ta('meds', L(['Принимает препараты', 'İstifadə etdiyi dərmanlar'])) + ta('amorbi', 'Anamnesis morbi') + ta('avitae', 'Anamnesis vitae') +
    '<div class="field"><label>' + esc(t('fChronic')) + '</label><div class="f-chk">' + FD.chronic.map(x => chk(x[0], fdLabel(x))).join('') + '</div>' +
    '<div class="grid2">' + inp('av_o1', t('fOther')) + inp('av_o2', t('fOther')) + '</div></div>' + inp('habits', L(['Вредные привычки', 'Zərərli vərdişlər'])) +
    '<div class="field"><label>' + esc(t('fPainScale')) + '</label><div class="chips f-chips">' + Array.from({ length: 11 }, (_, i) => '<button type="button" class="chip' + (String(val('pain')) === String(i) ? ' on' : '') + '" data-act="fSetV" data-f="pain" data-v="' + i + '">' + i + '</button>').join('') + '</div></div>';

  // 4. осмотр
  const sExam = (ro ? '' : '<button type="button" class="btn ghost block" style="margin-bottom:10px" data-act="fExamNorm">' + esc(t('fExamNorm')) + '</button>') +
    FD.exam.map(g => '<div class="field"><label>' + esc(S.lang === 'az' ? g[2] : g[1]) + '</label>' + multi('ex_' + g[0], g[3]) + '</div>').join('') +
    inp('ex_head', L(['Голова / шея', 'Baş / Boyun'])) + ta('ex_note', t('fExamNote'));

  // 5. диагноз
  const sDx = inp('dx1', L(['Предварительный диагноз 1', 'İlkin diaqnoz 1']), { max: 300 }) + inp('dx2', L(['Предварительный диагноз 2', 'İlkin diaqnoz 2']), { max: 300 }) +
    '<div class="grid2 stack"><div class="field"><label>' + esc(t('fDoctor')) + '</label><div class="row"><input type="text" class="grow" data-f="exDoc" maxlength="80" value="' + esc(val('exDoc')) + '">' + (ro ? '' : '<button type="button" class="btn small ghost" data-act="fMe" data-f="exDoc" data-at="exAt">' + esc(t('fMe')) + '</button>') + '</div></div>' +
    '<div class="field"><label>' + esc(t('fWhen')) + '</label><input type="datetime-local" data-f="exAt" value="' + esc(String(val('exAt')).replace(' ', 'T')) + '"></div></div>';

  // 6. анализы и исследования
  const sLabs = '<div class="lbl">' + esc(L(['Лабораторные исследования', 'Laborator müayinələr'])) + '</div>' + multi('labs', FD.labs) +
    FD.labs.filter(x => isOn(d, 'labs', x[0])).map(x => inp('lab_' + x[0], fdLabel(x) + ' — ' + t('fResult'), { max: 500 })).join('') +
    '<div class="grid2">' + inp('labO1', t('fOther')) + inp('labO2', t('fOther')) + '</div>' +
    '<div class="lbl" style="margin-top:6px">' + esc(L(['Визуализация', 'Görüntüləmə'])) + '</div>' + multi('img', FD.imaging) +
    FD.imaging.filter(x => isOn(d, 'img', x[0])).map(x => '<div class="f-img"><b>' + L2(x) + '</b>' + seg('imgc_' + x[0], FD.contrast) + inp('img_' + x[0], t('fResult'), { max: 600 }) + '</div>').join('') +
    inp('imgO', t('fOther'), { max: 300 });

  // 7. назначения
  const rx = rowsOf(d, 'rx');
  const sRx = (al ? '<div class="f-alert">' + esc(t('formAllergyBanner', { a: al })) + '</div>' : '') + rx.map(r => {
    const given = !!r.given;
    const it = r.itemId ? itemById(r.itemId) : null;
    const info = given ? '<div class="note fix" style="margin:4px 0 0">' + esc(t('fRxGivenAt', { t: fmtDt(r.givenAt), who: r.givenByName || '' })) + (r.spendOp ? ' · ' + esc(t('fRxFromStock', { n: r.qty || '', u: it ? unitShort(it.unit) : '' })) : r.own ? ' · ' + esc(t('fRxOwn')) : ' · <span style="color:var(--red)">' + esc(t('fRxNotSpent')) + '</span>') + '</div>' : '';
    return '<div class="f-rx' + (given ? ' given' : '') + '"><div class="row"><input type="text" class="grow" data-row="rx" data-rid="' + esc(r._id) + '" data-rf="drug" maxlength="200" value="' + esc(r.drug || '') + '" placeholder="' + esc(t('fRxDrugPh')) + '"' + (given ? ' readonly' : '') + '>' +
      (ro || given ? '' : '<button type="button" class="btn small ghost" data-act="fRowDel" data-row="rx" data-rid="' + esc(r._id) + '">✕</button>') + '</div>' +
      '<div class="row" style="margin-top:6px"><label class="muted">' + esc(t('fRxTime')) + '</label><input type="time" style="width:110px;min-height:38px" data-row="rx" data-rid="' + esc(r._id) + '" data-rf="at" value="' + esc(r.at || '') + '"><span class="grow"></span>' +
      (ro ? '' : !given ? '<button type="button" class="btn small primary" data-act="fGive" data-rid="' + esc(r._id) + '">' + esc(t('fRxGiven')) + '</button>' : (!r.spendOp && !r.own && can('spend') ? '<button type="button" class="btn small ghost" data-act="fGive" data-rid="' + esc(r._id) + '">' + esc(t('fRxSpendNow')) + '</button>' : '')) + '</div>' + info + '</div>';
  }).join('') + (ro ? '' : '<div class="row" style="margin-top:8px"><input type="text" id="fRxNew" class="grow" maxlength="200" placeholder="' + esc(t('fRxDrugPh')) + '"><button type="button" class="btn primary" data-act="fRxAdd">' + esc(t('fRxAdd')) + '</button></div>');

  // 8. наблюдение врача
  const sObs = ta('obsNote', t('fObsNote')) + '<div class="grid2 stack"><div class="field"><label>' + esc(t('fDoctor')) + '</label><div class="row"><input type="text" class="grow" data-f="obsDoc" maxlength="80" value="' + esc(val('obsDoc')) + '">' + (ro ? '' : '<button type="button" class="btn small ghost" data-act="fMe" data-f="obsDoc" data-at="obsAt">' + esc(t('fMe')) + '</button>') + '</div></div>' +
    '<div class="field"><label>' + esc(t('fWhen')) + '</label><input type="datetime-local" data-f="obsAt" value="' + esc(String(val('obsAt')).replace(' ', 'T')) + '"></div></div>';

  // 9. консультации
  const cons = rowsOf(d, 'cons');
  const cin = (r, fl, label, type) => '<div class="field"><label>' + esc(label) + '</label><input type="' + (type || 'text') + '" data-row="cons" data-rid="' + esc(r._id) + '" data-rf="' + fl + '" maxlength="300" value="' + esc(String(r[fl] || '').replace(' ', 'T')) + '"></div>';
  const sCons = cons.map((r, i) => '<div class="f-cons"><div class="row"><b>' + esc(t('fConsN', { n: i + 1 })) + '</b><span class="grow"></span>' + (ro ? '' : '<button type="button" class="btn small ghost" data-act="fRowDel" data-row="cons" data-rid="' + esc(r._id) + '">✕</button>') + '</div>' +
    cin(r, 'dept', t('fConsDept')) + '<div class="grid2 stack">' + cin(r, 'req', t('fConsReq'), 'datetime-local') + cin(r, 'arr', t('fConsArr'), 'datetime-local') + '</div>' +
    '<div class="field"><label>' + esc(t('fConsNote')) + '</label><textarea data-row="cons" data-rid="' + esc(r._id) + '" data-rf="note" maxlength="590">' + esc(r.note || '') + '</textarea></div>' + cin(r, 'doc', t('fConsDoc')) + '</div>').join('') +
    (ro || cons.length >= 3 ? '' : '<button type="button" class="btn ghost block" data-act="fConsAdd">' + esc(t('fConsAdd')) + '</button>');

  // 10. исход
  const sOut = '<div class="f-out">' + FD.outcome.map(x => '<button type="button" class="f-outb' + (d.outcome === x[0] ? ' on' : '') + '" data-act="fSetV" data-f="outcome" data-v="' + x[0] + '">' + esc(fdLabel(x)) + '</button>').join('') + '</div>' +
    (d.outcome === 'transfer' ? inp('outTo', t('fOutTo'), { max: 200 }) : '') + (d.outcome === 'death' ? '<div class="field"><label>' + esc(t('fOutDeathAt')) + '</label><input type="time" data-f="outDeathAt" value="' + esc(val('outDeathAt')) + '"></div>' : '') +
    '<div class="grid2 stack"><div class="field"><label>' + esc(t('fDoctor')) + '</label><div class="row"><input type="text" class="grow" data-f="outDoc" maxlength="80" value="' + esc(val('outDoc')) + '">' + (ro ? '' : '<button type="button" class="btn small ghost" data-act="fMe" data-f="outDoc" data-at="outAt">' + esc(t('fMe')) + '</button>') + '</div></div>' +
    '<div class="field"><label>' + esc(t('fWhen')) + '</label><input type="datetime-local" data-f="outAt" value="' + esc(String(val('outAt')).replace(' ', 'T')) + '"></div></div>';

  // 11. фото (вне блокировки «только чтение»: смотреть можно всегда)
  const pendAtt = S.queue.filter(o => o.action === 'formAttach' && o.payload.formId === id);
  const att = (f.att || []).filter(a => !a.removed);
  const sAtt = '<div class="f-atts">' + att.map(a => '<div class="f-att"><div class="grow"><b>' + esc(t('attKind_' + a.kind)) + '</b>' + (a.caption ? ' — ' + esc(a.caption) : '') + '<div class="muted">' + esc(fmtDt(a.time)) + ' · ' + esc(a.byName || '') + '</div></div>' +
    '<button type="button" class="btn small ghost" data-act="fAttOpen" data-id="' + esc(a.id) + '">' + esc(t('fAttOpen')) + '</button>' + (ro ? '' : '<button type="button" class="btn small ghost" data-act="fAttDel" data-id="' + esc(a.id) + '">✕</button>') + '</div>').join('') +
    pendAtt.map(o => '<div class="f-att">' + (S.fThumbs && S.fThumbs[o.payload.idb] ? '<img class="thumb" src="' + S.fThumbs[o.payload.idb] + '" alt="">' : '') + '<div class="grow"><b>' + esc(t('attKind_' + o.payload.kind)) + '</b>' + (o.payload.caption ? ' — ' + esc(o.payload.caption) : '') + '<div class="muted">⏳ ' + esc(t('fAttWait')) + '</div></div></div>').join('') + '</div>' +
    (ro ? '' : '<div class="f-attbtns">' + [['ecg', 'fAttEcg'], ['lab', 'fAttLab'], ['img', 'fAttImg'], ['doc', 'fAttDoc'], ['receipt', 'fReceiptPhoto']].map(x => '<button type="button" class="btn small ghost" data-act="fPhoto" data-kind="' + x[0] + '">' + esc(t(x[1])) + '</button>').join('') + '</div>');

  const need = [];
  if (!d.blankNo) need.push(t('fNeedBlank'));
  if (!d.pName) need.push(t('fNeedName'));
  if (!d.outcome) need.push(t('fNeedOutcome'));
  const head = '<div class="f-head card"><div class="row"><button type="button" class="btn small ghost" data-act="fBack">' + esc(t('formBack')) + '</button><span class="grow"></span><span id="fSaveState" class="tag"></span>' +
    '<button type="button" class="btn small ghost" data-act="fMenu">' + esc(t('fMenu')) + '</button></div>' +
    '<div class="row" style="margin-top:8px"><label class="lbl" style="margin:0;white-space:nowrap">' + esc(t('formBlankNo')) + '</label><input type="text" id="fBlank" data-f="blankNo" maxlength="40" inputmode="numeric" class="grow' + (d.blankNo ? '' : ' f-bad') + '" value="' + esc(val('blankNo')) + '" placeholder="' + esc(t('formBlankNoPh')) + '"' + (ro ? ' disabled' : '') + '></div>' +
    (d.blankNo ? '' : '<div class="note f-blanknote" style="margin:4px 0 0;color:var(--red)">' + esc(t('formBlankNeed')) + '</div>') +
    '<div class="muted" style="margin-top:6px">' + (st === 'closed' ? '<span class="tag green">' + esc(t('formClosed')) + '</span> ' + esc(fmtDt(f.closedAt)) + ' · ' + esc(f.closedByName || '') : st === 'closing' ? '<span class="tag amber">' + esc(t('formClosing')) + '</span>' : '<span class="tag">' + esc(t('formDraft')) + '</span>') +
    (f.editsAfterClose ? ' · ' + esc(t('formEditsAfter', { n: f.editsAfterClose })) : '') + '</div>' +
    '<div id="fAllergy">' + (al ? '<div class="f-alert">' + esc(t('formAllergyBanner', { a: al })) + '</div>' : '') + '</div>' +
    (st === 'closed' && !S.fv.edit ? '<div class="info" style="margin:8px 0 0">' + esc(t('fReadOnly')) + '</div>' + (can('formsEdit') ? '<button type="button" class="btn ghost block" style="margin-top:8px" data-act="fEditClosed">' + esc(t('fEditClosed')) + '</button>' : '') : '') +
    (S.fv.edit ? '<div class="f-alert" style="background:var(--amber-soft);color:var(--amber)">' + esc(t('fEditClosedOn')) + '</div>' : '') + '</div>';
  const crit = vits.some(r => VIT_FIELDS.some(fl => vitLevel(fl, r[fl]) === 'crit'));
  box.innerHTML = head + '<fieldset class="f-fs"' + (ro ? ' disabled' : '') + '>' +
    sec('patient', t('secPatient'), sPatient, d.pName ? ' · <span class="muted">' + esc(d.pName) + '</span>' : '') +
    sec('triage', t('secTriage'), sTriage, (d.triage ? ' ' + { green: '🟢', yellow: '🟡', red: '🔴', black: '⚫' }[d.triage] : '') + (crit ? ' ⚠️' : '')) +
    sec('history', t('secHistory'), sHist) + sec('exam', t('secExam'), sExam) + sec('dx', t('secDx'), sDx, d.dx1 ? ' · <span class="muted">' + esc(d.dx1) + '</span>' : '') +
    sec('labs', t('secLabs'), sLabs) + sec('rx', t('secRx'), sRx, rx.length ? ' · ' + rx.filter(r => r.given).length + '/' + rx.length : '') + sec('obs', t('secObs'), sObs) +
    sec('cons', t('secCons'), sCons, cons.length ? ' · ' + cons.length : '') + sec('outcome', t('secOutcome'), sOut, d.outcome ? ' ✓' : '') + '</fieldset>' +
    sec('att', t('secAtt'), sAtt, att.length + pendAtt.length ? ' · ' + (att.length + pendAtt.length) : '') +
    (st !== 'closed' && st !== 'closing' && can('forms') ? '<div class="card">' + (need.length ? '<div class="note" style="margin:0 0 8px;color:var(--red)">' + esc(t('fCloseNeed', { what: need.join(', ') })) + '</div>' : '') +
      '<button type="button" class="btn primary block" data-act="fClose"' + (need.length ? ' disabled' : '') + '>' + esc(t('fClose')) + '</button></div>' : '');
  $$('details.f-sec', box).forEach(el => el.addEventListener('toggle', () => { S.fOpen[el.dataset.sec] = el.open ? 1 : 0; }));
  fRenderSaveState();
  window.scrollTo(0, keepScroll ? y : 0);
  fHistoryCheck(d);
}

/** Прошлые обращения по FİN или ФИО + дата рождения (спрашиваем сервер, когда эти поля изменились). */
async function fHistoryCheck(d) {
  if (!S.fv || !S.gas) return;
  const id = S.fv.id;
  const key = (d.fin || '') + '|' + (d.pName || '') + '|' + (d.pBirth || '');
  if (S.fHist && S.fHist.id === id && S.fHist.key === key) return;
  const fin = String(d.fin || '').toUpperCase();
  if (fin.length < 7 && !(d.pName && d.pBirth)) { S.fHist = { id, key, rows: [] }; return; }
  S.fHist = { id, key, rows: (S.fHist && S.fHist.id === id) ? S.fHist.rows : [] };
  let r;
  try { r = await rpc('formHistory', { fin, name: d.pName || '', birth: d.pBirth || '', exceptId: id }); } catch (e) { return; }
  if (!r || !r.ok || !S.fv || S.fv.id !== id) return;
  const had = S.fHist.rows.length;
  S.fHist = { id, key, rows: r.rows };
  if (r.rows.length !== had) {
    const ae = document.activeElement;
    if (!(ae && ae.closest && ae.closest('#formsBox') && /INPUT|TEXTAREA/.test(ae.tagName))) fRenderEditor(true);
    else { const al = r.rows.map(h => h.allergy).filter(a => a && a !== '—'); toast(t('fHistoryN', { n: r.rows.length }) + (al.length ? ' · ⚠️ ' + al[0] : ''), al.length ? 'bad' : '', null, 7000); }
  }
}

/* ---------- ввод в полях ---------- */
function fInputVal(el) {
  if (el.type === 'checkbox') return el.checked ? true : null;
  if (el.type === 'number') return el.value === '' ? null : Number(el.value);
  if (el.type === 'datetime-local') return el.value ? el.value : null;
  const v = el.value;
  return v === '' ? null : v;
}
function fOnInput(el, commit) {
  if (!S.fv || !el.closest('#formsBox')) return;
  if (el.dataset.f) {
    let v = fInputVal(el);
    if (el.dataset.f === 'fin' && v) { v = String(v).toUpperCase().replace(/\s+/g, ''); el.classList.toggle('f-bad', !finOk(v)); const n = el.parentElement.querySelector('.f-finnote'); if (n) n.classList.toggle('hidden', finOk(v)); }
    if (el.dataset.f === 'blankNo') { el.classList.toggle('f-bad', !v); const n = $('.f-blanknote'); if (n) n.classList.toggle('hidden', !!v); }
    fSet({ [el.dataset.f]: v });
    if (el.dataset.f === 'allergy') { const a = String(v || '').trim(); $('#fAllergy').innerHTML = a ? '<div class="f-alert">' + esc(t('formAllergyBanner', { a })) + '</div>' : ''; }

    if (el.dataset.f === 'allergyNone') { const ai = $('[data-f=allergy]'); if (ai) ai.disabled = !!v; const a = v ? '' : String(fData(S.fv.id).allergy || '').trim(); $('#fAllergy').innerHTML = a ? '<div class="f-alert">' + esc(t('formAllergyBanner', { a })) + '</div>' : ''; }
    if (commit && ['pBirth', 'fin', 'pName'].indexOf(el.dataset.f) !== -1) { fFlush(); fHistoryCheck(fData(S.fv.id)); return; }
  } else if (el.dataset.row) {

    fSet({ [el.dataset.row]: { [el.dataset.rid]: { [el.dataset.rf]: v } } });
  } else return;
  if (commit) fFlush();
}

function fAllergyHit(d, drug) {
  const al = allergyText(d);
  if (!al) return '';
  const ds = skel(drug);
  return al.split(/[,;/]+|\s+/).map(w => w.trim()).filter(w => w.length >= 4).find(w => { const ws = skel(w).slice(0, 5); return ws.length >= 4 && ds.indexOf(ws) !== -1; }) ? al : '';
}
function fRxAdd() {
  const el = $('#fRxNew');

  if (hit && !confirm(t('fRxAllergy', { a: hit }))) return;

/** Форма заведена сегодня, а пациент поступил раньше — по умолчанию «ввели» в день поступления. */
function fGiveDefaultWhen(d) {
  const now = nowLocal();
  const arr = String(d.arrivedAt || '').replace(' ', 'T');
  return arr && arr.slice(0, 10) < now.slice(0, 10) ? arr.slice(0, 16) : now;
}
function fGiveGo() {
  if (!S.fv || !S.fGive) return closeModal();
  const id = S.fv.id, rid = S.fGive.rid;
  const own = $('#fgOwn').checked;
  const nowL = nowLocal();
  let when = ($('#fgWhen') && $('#fgWhen').value) || nowL;
  if (when > nowL) when = nowL;
  if (when.slice(0, 10) < addDaysStr(nowL.slice(0, 10), -30)) return toast(t('fGiveTooOld'), 'bad');
  const now = when.replace('T', ' ');
  const usedAt = when.slice(0, 10) < nowL.slice(0, 10) ? when.slice(0, 10) : '';
  const row = { given: true, givenAt: now, givenBy: S.me.id, givenByName: S.me.name };
  if (own) row.own = true;
  else if (can('spend') && S.fGive.lotId) {
    const lot = lotById(S.fGive.lotId), it = lot && itemById(lot.itemId);
    const qty = Number($('#fgQty').value);
    if (!lot || !it) return toast(t('fGiveNone'), 'bad');
    if (!Number.isInteger(qty) || qty < 1) return toast(t('E_BAD_QTY', { min: 1, max: 100000 }), 'bad');
    const d = fData(id);
    const visit = String(d.blankNo || id).slice(0, 60);
    fFlush(); // форма — раньше списания
    const op = enqueue('spend', { doctorId: S.docId, lotId: lot.id, qty, reason: 'PATIENT', comment: '', visit, reportShortage: true, usedAt }, { label: it.name, shortageKnown: qty > lot.qty });
    S.mine.push({ opId: op.opId, action: 'spend', type: 'SPEND', doctorId: S.docId, lotId: lot.id, itemId: it.id, series: lot.series, expiry: lot.expiry, locationId: lot.locationId, name: it.name + ' ' + it.dosage, qty, delta: -qty, ts: Date.now(), status: 'pending', visit });
    saveMine();
    Object.assign(row, { itemId: it.id, lotId: lot.id, qty, spendOp: op.opId });
  } else if (can('spend')) return toast(t('fGiveNone'), 'bad');
  closeModal();
  fSet({ rx: { [rid]: row } });
  fFlush();
  fRenderEditor(true);
}

/* =====================================================================
 * v6: установленное приложение (PWA) — страница с GitHub Pages, сервер тот же (Apps Script /exec, doPost).
 * Открывается без интернета (service worker), очередь и ключ сеанса дублируются в IndexedDB,
 * чтобы фоновый помощник (sw.js) мог сам отправить накопленное, когда появится сеть.
 * В веб-версии внутри Apps Script этот модуль ничего не делает (PWA_MODE нет).
 * ===================================================================== */
const PWA = !!window.PWA_MODE;
const PWA_URL = 'https://gianttank98-sketch.github.io/medpunkt/';

function pwaApi() { return LS.get('MED6_API', ''); }
/** SHA-256 (для «привязки» приложения к одному серверу: в публичной сборке лежит только отпечаток ссылки, не она сама). */
function sha256Hex(str) {
  const K = [0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5, 0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
    0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da, 0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
    0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85, 0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
    0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3, 0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2];
  const bytes = Array.from(new TextEncoder().encode(str));
  const bitLen = bytes.length * 8;
  bytes.push(0x80);
  while (bytes.length % 64 !== 56) bytes.push(0);
  for (let i = 7; i >= 0; i--) bytes.push(i >= 4 ? 0 : (bitLen >>> (i * 8)) & 0xff);
  const H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
  const rotr = (x, n) => (x >>> n) | (x << (32 - n));
  for (let o = 0; o < bytes.length; o += 64) {
    const w = new Array(64);
    for (let i = 0; i < 16; i++) w[i] = (bytes[o + i * 4] << 24) | (bytes[o + i * 4 + 1] << 16) | (bytes[o + i * 4 + 2] << 8) | bytes[o + i * 4 + 3];
    for (let i = 16; i < 64; i++) {
      const s0 = rotr(w[i - 15], 7) ^ rotr(w[i - 15], 18) ^ (w[i - 15] >>> 3), s1 = rotr(w[i - 2], 17) ^ rotr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
      w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
    }
    let [a, b, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const t1 = (h + (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
      const t2 = ((rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + c) | 0; H[3] = (H[3] + d) | 0; H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
  }
  return H.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');

/** Приложение привязано к серверу владельца: любая другая ссылка (даже настоящая ссылка Apps Script) не принимается. */
function apiPinned(u) { return !window.PWA_API_SHA256 || sha256Hex(u) === window.PWA_API_SHA256; }

function apiShort(u) { const m = String(u || '').match(/\/s\/([A-Za-z0-9_-]+)\/exec$/) || String(u || '').match(/\/\/([^/]+)/); const id = m ? m[1] : ''; return id.length > 14 ? id.slice(0, 6) + '…' + id.slice(-6) : id; }

/** Запрос к серверу из приложения: обычный POST с JSON (текстом — так браузер не делает лишний предварительный запрос). */
async function rpcFetch(action, p, timeoutMs) {
  const url = pwaApi();
  if (!url) throw new Error('NO_API');
  const ctl = typeof AbortController === 'function' ? new AbortController() : null;
  const tm = setTimeout(() => { if (ctl) ctl.abort(); }, timeoutMs || 60000);
  try {
    const res = await fetch(url, { method: 'POST', body: JSON.stringify({ action, payload: p }), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow', signal: ctl ? ctl.signal : undefined, cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const txt = await res.text();
    try { return JSON.parse(txt); } catch (e) { throw new Error('BAD_JSON'); } // страница входа Google вместо ответа = доступ не «для всех»
  } finally { clearTimeout(tm); }
}

/* ---------- общее хранилище с фоновым помощником ---------- */
function kvOpen() {
  if (S.kvP) return S.kvP;
  S.kvP = new Promise((res, rej) => {
    try {
      const rq = indexedDB.open('med5q', 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore('kv');
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error);
    } catch (e) { rej(e); }
  });
  S.kvP.catch(() => { S.kvP = null; });
  return S.kvP;
}
async function kvSet(k, v) {
  if (!PWA) return;
  try { const db = await kvOpen(); await new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); } catch (e) { }
}
async function kvGet(k) {
  try { const db = await kvOpen(); return await new Promise(res => { const rq = db.transaction('kv').objectStore('kv').get(k); rq.onsuccess = () => res(rq.result); rq.onerror = () => res(undefined); }); } catch (e) { return undefined; }
}

/** После каждого изменения очереди и входа/выхода: копия для фонового помощника + просьба отправить, когда будет сеть. */
function pwaMirror() {
  if (!PWA) return;
  const q = JSON.parse(JSON.stringify(S.queue));
  const auth = S.sess && S.me ? { userId: S.me.id, sess: S.sess } : null;
  kvSet('queue', q).then(() => kvSet('auth', auth)).then(() => kvSet('api', pwaApi())).then(() => kvSet('done', doneList().slice(-1000))).then(() => { if (q.length) pwaSyncRequest(); });
  pwaBadge();
}
function pwaSyncRequest() {
  if (!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.ready.then(reg => {
    if (reg.sync && reg.sync.register) reg.sync.register('med-flush').catch(() => { });
  }).catch(() => { });
}
function pwaBadge() {
  try {
    const n = S.queue.filter(o => o.userId === (S.me && S.me.id)).length;
    if (navigator.setAppBadge) { if (n) navigator.setAppBadge(n).catch(() => { }); else navigator.clearAppBadge().catch(() => { }); }
  } catch (e) { }
}

/** Что фоновый помощник уже отправил, пока приложение было закрыто или свёрнуто: убираем из своей очереди. */
async function pwaReconcile() {
  if (!PWA) return;
  const done = (await kvGet('swDone')) || [];
  const failed = (await kvGet('swFailed')) || [];
  if (!done.length && !failed.length) return;
  const doneSet = {}, resOf = {};
  done.forEach(e => { const id = typeof e === 'string' ? e : e.id; doneSet[id] = 1; if (e && e.res) resOf[id] = e.res; });
  S.queue = S.queue.filter(o => {
    if (!doneSet[o.opId]) return true;
    markDone(o.opId); markMine(o.opId, 'sent'); qTrail('sw-sent', o);
    // то же, что сделало бы приложение, получив ответ само (отмена списания, нехватка при списании)
    if (DONE[o.action]) { try { DONE[o.action](o, { ok: true, result: resOf[o.opId] }); } catch (e) { } }
    return false;
  });
  failed.forEach(f => {
    if (doneSet[f.op.opId] || isDone(f.op.opId)) return; // ушла раньше (дубль из старой копии очереди) — это не отказ
    const i = S.queue.findIndex(o => o.opId === f.op.opId);
    if (i !== -1) S.queue.splice(i, 1);
    if (!S.failed.some(o => o.opId === f.op.opId)) { f.op.error = f.error; S.failed.push(f.op); markMine(f.op.opId, 'rejected'); if (FAIL[f.op.action]) { try { FAIL[f.op.action](f.op); } catch (e) { } } }
    markDone(f.op.opId);
  });
  // очищаем только то, что прочитали (помощник мог дописать новое)
  const now = (await kvGet('swDone')) || [];
  await kvSet('swDone', now.filter(e => !doneSet[typeof e === 'string' ? e : e.id]));
  const nowF = (await kvGet('swFailed')) || [];
  await kvSet('swFailed', nowF.filter(f => !failed.some(x => x.op.opId === f.op.opId)));

}

/* ---------- фоновый помощник ---------- */
function pwaInit() {
  if (!PWA) return;
  // сохранённый ранее сервер не совпадает с привязкой этой сборки — забываем его (и вход к нему)
  if (pwaApi() && !apiPinned(pwaApi())) { LS.del('MED6_API'); saveSession('', null); kvSet('auth', null); }
  pwaReadApiParam();
  S.gas = !!pwaApi();
  if (S.pwaApiIgnored) setTimeout(() => toast(t('pwaApiIgnored'), 'bad', null, 9000), 600);
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => { });
    // установленное приложение на Android может само просыпаться раз в 15+ минут и отправлять накопленное
    navigator.serviceWorker.ready.then(async reg => {
      try {
        if (!reg.periodicSync || !navigator.permissions) return;
        const st = await navigator.permissions.query({ name: 'periodic-background-sync' });
        if (st.state === 'granted') await reg.periodicSync.register('med-flush', { minInterval: 15 * 60 * 1000 });
      } catch (e) { }
    }).catch(() => { });
    navigator.serviceWorker.addEventListener('message', e => {
      const m = e.data || {};
      if (m.type === 'flush') flushQueue();
      if (m.type === 'flushed') pwaReconcile().then(() => refreshState());
    });
  }
  // хранилище «не стирать при нехватке места» — очередь без связи важнее кэша
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { pwaMirror(); return; }
    pwaReconcile().then(() => flushQueue());
  });
  kvSet('api', pwaApi());
  pwaReconcile();
  pwaMirror();
}

/* =====================================================================
 * v7: начальный остаток и «когда привезли»
 *  • «📥 Начальный остаток» — то, что уже лежит в отделении на дату, когда начали вести учёт. Не приход: в отчёте отдельной графой.
 *    Дата пишется в карточку препарата.
 *  • «Когда привезли» — приход задним числом. Если ЭТОТ препарат привезли до того, как его внесли в начальный остаток,
 *    это количество уже лежит в остатке: в отчёт «Получено» — да, к остатку второй раз — нет.
 *    В дни ввода его остатка человек отвечает явно: «уже учтено» или «привезли после пересчёта».
 *    Сервер решает по тем же правилам; если телефон решил иначе (старые данные), приложение предупредит.
 * ===================================================================== */
function openingDates() { return (S.base && S.base.opening) || { first: '', last: '' }; }
function rcvMode() { return !can('receive') ? 'opening' : (S.rcv.mode === 'opening' && can('opening') ? 'opening' : 'receive'); }
function addDaysStr(s, n) { return new Date(Date.parse(s + 'T00:00:00Z') + n * 86400000).toISOString().slice(0, 10); }
/** Даты начального остатка препарата: из карточки + то, что ещё ждёт отправки в очереди. */
function itemOpening(item) {
  const key = itemKey(item.name, item.form, item.dosage);
  const it = (S.view.items || []).find(i => itemKey(i.name, i.form, i.dosage) === key);
  let f = it && it.openFirst || '', l = it && (it.openLast || it.openFirst) || '';
  S.queue.forEach(q => {
    if (q.action !== 'opening' || itemKey(q.payload.item.name, q.payload.item.form, q.payload.item.dosage) !== key) return;
    const d = q.payload.asOf || bakuToday();
    if (!f || d < f) f = d;
    if (!l || d > l) l = d;
  });
  return { first: f, last: l };
}
/** Уже посчитано? То же правило, что на сервере (countState_):
 *  'hist' — препарат внесён в начальный остаток после даты прихода: только в отчёт;
 *  'ask' — в день ввода его остатка: нужен явный ответ;
 *  'askRev' — ревизия этого места была в день прихода или позже: нужен явный ответ (rev — какая, sur — сколько она нашла лишнего);
 *  '' — обычный приход. */
function rcvCountState(item, receivedAt, locationId) {
  const od = itemOpening(item);
  const today = bakuToday();
  const d = receivedAt || today;
  if (od.first) {
    if (d < od.first) return { state: 'hist', od };
    if (d <= od.last) return { state: 'ask', od };

/** Строки для окна проверки: дата, «только в отчёт», «ревизия уже посчитала?», «на этом месте уже есть», «такой же приход уже есть». */
function rcvCheckExtra(p, mode, exist) {

  const c = rcvCountState(p.item, p.receivedAt, p.locationId);
  const od = c.od || { first: '', last: '' };

/** «Такой же приход уже внесли» — по недавним приходам с сервера и по очереди этого телефона. */
function rcvDuplicate(p, exist) {
  const day = p.receivedAt || bakuToday();
  const doc = String(p.docNo || '').toUpperCase().replace(/\s+/g, '');
  const key = itemKey(p.item.name, p.item.form, p.item.dosage);
  const list = ((S.base && S.base.receipts) || []).map(r => ({ itemId: r[0], series: r[1], qty: r[2], day: r[3], doc: r[4], who: r[5], opId: r[6] }));
  S.queue.forEach(q => {
    if (q.action !== 'receive' || itemKey(q.payload.item.name, q.payload.item.form, q.payload.item.dosage) !== key) return;
    list.push({ key, series: q.payload.series, qty: q.payload.qty, day: q.payload.receivedAt || bakuToday(), doc: String(q.payload.docNo || '').toUpperCase().replace(/\s+/g, ''), who: t('thisPhone'), opId: q.opId });
  });
  const same = x => (x.key ? x.key === key : exist && x.itemId === exist.id);
  const d = list.find(x => same(x) && normSeries(x.series || '') === p.series && x.qty === p.qty && x.day === day);
  if (d) return t('dupReceiptWarn', { who: d.who || '?', d: fmtDate(d.day) });
  const dd = doc && list.find(x => same(x) && x.doc && x.doc === doc);
  if (dd) return t('dupDocWarn', { n: doc, who: dd.who || '?' });
  return '';
}

/** Ответ сервера по приходу: если телефон ждал другого (данные устарели), честно предупредить.

DONE.receive = function (op, r) {
  const x = r && r.result;
  if (!x) return;
  const was = op.meta.noStock || (op.meta.hist ? 'hist' : '');
  const now = x.hist ? 'hist' : x.counted ? 'rev' : '';
  const m = S.mine.find(y => y.opId === op.opId);
  if (m) { m.type = now === 'hist' ? 'RECEIVE_HIST' : 'RECEIVE'; saveMine(); }
  const name = op.meta.label || '';
  if (was !== now) toast(t(now === 'hist' ? 'histServerHist' : now === 'rev' ? 'revServerCounted' : 'histServerAdd', { name }), 'bad', null, 12000);
  else if (x.askMissed) toast(t('histAskMissed', { name }), 'bad', null, 12000);
  else if (op.payload.receivedAt && op.payload.receivedAt < bakuToday() && can('incidents')) {
    const inc = (S.view.incidents || []).filter(i => i.itemId === x.itemId && String(i.time).slice(0, 10) >= op.payload.receivedAt);
    if (inc.length) toast(t('incAfterReceipt', { n: inc.length }), '', { label: t('open'), act: 'incList' }, 12000);
  }
};

/* ---------- ревизия: на дату и «похоже, переложили» ---------- */
/** Пары «недостача в одном месте + излишек/находка того же препарата, серии и срока в другом» → перемещение. */
function revPairs() {
  const r = S.rev;
  if (!r) return [];
  const lines = Object.values(r.lines).filter(l => revCounted(l) && !l.edit);
  const need = {}; // сколько ещё можно «объяснить» излишком
  const out = [];
  const key = (itemId, series, expiry) => itemId + '|' + normSeries(series || '') + '|' + (expiry || '');
  const sur = [];
  lines.forEach(l => { if (l.actual > l.expected && !l.moveTo) sur.push({ kind: 'line', lotId: l.lotId, loc: l.locationId, k: key(l.itemId, l.series, l.expiry), left: l.actual - l.expected }); });
  r.found.forEach((f, i) => {
    const it = S.view.items.find(x => itemKey(x.name, x.form, x.dosage) === itemKey(f.item.name, f.item.form, f.item.dosage));
    if (it) sur.push({ kind: 'found', idx: i, loc: f.locationId, k: key(it.id, f.series, f.noExpiry ? '' : f.expiry), left: f.qty });
  });
  lines.forEach(a => {
    if (!(a.actual < a.expected) || a.moveTo) return;
    let short = a.expected - a.actual;
    const k = key(a.itemId, a.series, a.expiry);
    const b = sur.find(x => x.k === k && x.loc !== a.locationId && x.left > 0);
    if (!b) return;
    const q = Math.min(short, b.left);
    b.left -= q;
    out.push({ a: a.lotId, item: a.itemId, from: a.locationId, to: b.loc, q, b });
  });
  return out;
}
function revPairsHtml() {
  const ps = revPairs();
  if (!ps.length) return '';
  return '<div class="info" style="background:var(--amber-soft)"><b>🔄 ' + esc(t('revPairsTitle')) + '</b>' +
    ps.map(p => { const it = itemById(p.item) || { name: '?', dosage: '' }; return '<div style="margin-top:4px">' + esc(it.name + ' ' + it.dosage) + ': ' + esc(locName(p.from)) + ' → ' + esc(locName(p.to)) + ', ' + p.q + '</div>'; }).join('') +
    '<div class="muted" style="margin-top:6px">' + esc(t('revPairsHint')) + '</div>' +
    '<button class="btn small primary" style="margin-top:8px" data-act="revPairsApply">' + esc(t('revPairsBtn')) + '</button></div>';
}
function revPairsApply() {
  const r = S.rev;
  revPairs().forEach(p => {
    const a = r.lines[p.a];
    if (!a || a.moveTo) return;
    a.actual += p.q; a.moveTo = p.to; a.moveQty = p.q;
    if (p.b.kind === 'line') { const b = r.lines[p.b.lotId]; if (b) b.actual -= p.q; }
    else { const f = r.found[p.b.idx]; if (f) f.qty -= p.q; }
  });
  r.found = r.found.filter(f => f.qty > 0);
  revSave();
  renderRevision();
  revFinishModal();
  toast(t('revPairsDone'));
}

  return '<div class="field"><label>' + esc(t('revAsOfLbl')) + '</label><select id="revAsOf">' +

function revAsOfFields() {

    return { asOf: v, closedReason: reason };

  return { asOf: v };
}

/* ---------- 1. Пополнение сумки после списания ---------- */
/** Сколько должно быть в этом месте по укладке / норме и сколько есть годного (для этого препарата). */
function kitNeed(item, locId) {
  let target = 0, kitLine = null;
  (S.view.kits || []).forEach(k => { if (k.locationId === locId && k.norm > 0 && kitMatch(k, item) && k.norm > target) { target = k.norm; kitLine = k; } });
  (S.view.norms || []).forEach(n => { if (n.locationId === locId && n.itemId === item.id && n.norm > target) { target = n.norm; kitLine = null; } });
  if (!target) return null;
  const usable = l => l.locationId === locId && l.qty > 0 && lotStatus(l).cls !== 'expired';
  const have = S.view.lots.filter(l => usable(l) && (kitLine ? kitMatch(kitLine, itemById(l.itemId) || {}) : l.itemId === item.id)).reduce((s, l) => s + l.qty, 0);
  return { target, have, need: Math.max(0, target - have) };
}
/** Где взять: тот же препарат в другом месте, годный, не из другой сумки с укладкой (сначала — где больше). */
function restockSources(item, locId) {
  return S.view.lots.filter(l => l.itemId === item.id && l.locationId !== locId && l.qty > 0 && lotStatus(l).cls !== 'expired' && String(l.id).indexOf('tmp_') !== 0)
    .filter(l => !kitNeed(item, l.locationId)).sort((a, b) => b.qty - a.qty);
}
function restockSuggest(lot, it) {
  if (!can('spend')) return;
  const n = kitNeed(it, lot.locationId);
  if (!n || !n.need) return;
  const src = restockSources(it, lot.locationId);
  if (!src.length) return;
  S.restockHint = { itemId: it.id, toLoc: lot.locationId, need: n.need, have: n.have, target: n.target };
  setTimeout(() => toast(t('restockToast', { loc: locName(lot.locationId), name: it.name, have: n.have, target: n.target }), '', { label: t('restockBtn'), act: 'restockOpen' }, 10000), 400);
}
function restockModal() {
  const h = S.restockHint; if (!h) return;
  const it = itemById(h.itemId); if (!it) return;
  const src = restockSources(it, h.toLoc);
  if (!src.length) return toast(t('restockNone'), 'bad');
  openModal('<h3>🎒 ' + esc(t('restockTitle', { loc: locName(h.toLoc) })) + '</h3>' +
    '<div class="sum" style="margin-bottom:10px"><div><b>' + esc(it.name) + '</b> · ' + esc(it.dosage) + '</div><div>' + esc(t('restockState', { have: h.have, target: h.target, u: unitShort(it.unit) })) + '</div></div>' +
    '<div class="field"><label>' + esc(t('restockFrom')) + '</label><select id="rsFrom">' + src.map(l => '<option value="' + esc(l.id) + '">' + esc(locName(l.locationId)) + ' · ' + esc(l.series ? t('seriesShort', { s: l.series }) : t('noSeries')) + ' · ' + l.qty + '</option>').join('') + '</select></div>' +
    '<div class="field"><label>' + esc(t('qty')) + '</label><input type="number" id="rsQty" min="1" inputmode="numeric" value="' + Math.min(h.need, src[0].qty) + '"></div>' +
    '<div class="acts"><button class="btn ghost" data-act="closeModal">' + esc(t('cancel')) + '</button><button class="btn primary" data-act="restockSave">' + esc(t('restockBtn')) + '</button></div>');
}
function restockSave() {
  const h = S.restockHint; if (!h) return closeModal();
  const lot = lotById($('#rsFrom').value);
  const qty = Number($('#rsQty').value);
  if (!lot || !Number.isInteger(qty) || qty < 1 || qty > lot.qty) return toast(t('E_NOT_ENOUGH', { available: lot ? lot.qty : 0 }), 'bad');
  const it = itemById(lot.itemId);
  closeModal();
  enqueue('restock', { lotId: lot.id, toLocationId: h.toLoc, qty }, { label: it.name });
  S.restockHint = null;
  toast(t('restockDone', { name: it.name, qty, loc: locName(h.toLoc) }) + (!S.online ? ' ' + t('queuedToast') : ''));
}

function handoverModal(locId) {
  if (!needDoctor()) return;
  const kitLocs = (S.view.locations || []).filter(l => (S.view.kits || []).some(k => k.locationId === l.id));
  const locs = kitLocs.length ? kitLocs : (S.view.locations || []);
  const cur = locId || (S.hoLoc && locs.some(l => l.id === S.hoLoc) ? S.hoLoc : (locs[0] || {}).id);
  S.hoLoc = cur;
  const lots = S.view.lots.filter(l => l.locationId === cur && l.qty > 0 && String(l.id).indexOf('tmp_') !== 0);
  const people = (S.view.doctors || []).filter(d => !S.me || d.id !== S.me.id);
  openModal('<h3>🔁 ' + esc(t('hoTitle')) + '</h3>' +
    '<div class="field"><label>' + esc(t('hoLoc')) + '</label><select id="hoLoc">' + locs.map(l => '<option value="' + esc(l.id) + '"' + (l.id === cur ? ' selected' : '') + '>' + esc(locName(l.id)) + '</option>').join('') + '</select></div>' +
    '<div class="muted" style="margin-bottom:6px">' + esc(t('hoHint')) + '</div>' +
    '<div class="card" style="padding:4px 12px;max-height:40vh;overflow:auto">' + (lots.length ? lots.map(l => { const it = itemById(l.itemId) || { name: '?', dosage: '', unit: 'pcs' }; return '<div class="list-row"><div class="grow"><b>' + esc(it.name) + '</b> ' + esc(it.dosage) + '<div class="muted">' + esc(l.series ? t('seriesShort', { s: l.series }) : t('noSeries')) + ' · ' + esc(t('hoBook', { n: l.qty, u: unitShort(it.unit) })) + '</div></div><input type="number" min="0" inputmode="numeric" style="width:76px" data-ho="' + esc(l.id) + '" value="' + l.qty + '"></div>'; }).join('') : '<div class="muted">' + esc(t('hoEmpty')) + '</div>') + '</div>' +
    '<div class="field"><label>' + esc(t('hoTo')) + '</label><select id="hoTo"><option value="">—</option>' + people.map(d => '<option value="' + esc(d.id) + '">' + esc(docName(d)) + '</option>').join('') + '</select></div>' +
    '<div class="field"><label>' + esc(t('comment')) + '</label><input type="text" id="hoComment" maxlength="200"></div>' +
    '<div class="acts"><button class="btn ghost" data-act="closeModal">' + esc(t('cancel')) + '</button><button class="btn primary" data-act="handoverSave"' + (lots.length ? '' : ' disabled') + '>' + esc(t('hoSave')) + '</button></div>');
  $('#hoLoc').addEventListener('change', e => handoverModal(e.target.value));
  $$('[data-ho]').forEach(inp => inp.addEventListener('input', () => {
    const l = lotById(inp.dataset.ho);
    inp.classList.toggle('warn-field', l && Number(inp.value) !== l.qty);
  }));
}
function handoverSave() {
  const to = $('#hoTo').value;
  if (!to) return toast(t('hoNeedTo'), 'bad');
  const lines = [];
  for (const inp of $$('[data-ho]')) {
    const v = Number(inp.value);
    if (inp.value === '' || !Number.isInteger(v) || v < 0) { inp.focus(); return toast(t('E_BAD_QTY', { min: 0, max: 100000 }), 'bad'); }
    const l = lotById(inp.dataset.ho);
    lines.push({ lotId: inp.dataset.ho, actual: v, expected: l ? l.qty : undefined });
  }
  const diffs = lines.filter(x => { const l = lotById(x.lotId); return l && l.qty !== x.actual; }).length;
  const loc = S.hoLoc;
  const comment = ($('#hoComment').value || '').trim();
  closeModal();
  enqueue('handover', { locationId: loc, toUserId: to, lines, comment }, { label: locName(loc) });
  toast(diffs ? t('hoDoneDiff', { n: diffs }) : t('hoDone', { loc: locName(loc) }) + (!S.online ? ' ' + t('queuedToast') : ''), diffs ? 'bad' : '');
}

function withLang(lang, fn) { const o = S.lang; S.lang = lang; try { return fn(); } finally { S.lang = o; } }
function deficitRequestText(r, lang) {
  return withLang(lang, () => {
    const by = {};
    r.rows.forEach(x => {
      const k = (x.name || '') + '|' + (x.dosage || '') + '|' + (x.unit || '');
      const e = by[k] || (by[k] = { name: x.name, dosage: x.dosage, unit: x.unit, n: 0 });
      e.n += Number(x.missing) || 0;
    });
    (r.requests || []).forEach(q => { const k = q.name + '|' + (q.dosage || '') + '|'; const e = by[k] || (by[k] = { name: q.name, dosage: q.dosage, unit: '', n: 0 }); e.n += Number(q.qty) || 0; });
    const lines = Object.values(by).filter(e => e.n > 0).sort((a, b) => a.name.localeCompare(b.name)).map((e, i) => (i + 1) + '. ' + e.name + (e.dosage && e.dosage !== '—' ? ' ' + e.dosage : '') + ' — ' + e.n + (e.unit ? ' ' + unitShort(e.unit) : ''));
    const store = S.base && S.base.store ? (lang === 'az' ? S.base.store.nameAz || S.base.store.nameRu : S.base.store.nameRu) : '';
    return t('reqWaHead', { store, d: fmtDate(bakuToday()) }) + '\n\n' + lines.join('\n') + '\n\n' + t('reqWaFoot', { who: S.me ? S.me.name : '' });
  });
}

/* ---------- 7. Минимум по МНН: все фирмы одного вещества (та же дозировка и форма) вместе ---------- */
/** Ключ группы — как на сервере (subKey_): МНН (или название) + дозировка + форма. */
function subKey(it) { return skel(it.substance || it.name) + '|' + normDose(it.dosage) + '|' + (it.form || ''); }
function subGroup(it) {
  const k = subKey(it);
  const m = ((S.view && S.view.subMins) || []).find(x => x.key === k);
  const items = (S.view.items || []).filter(i => subKey(i) === k);

/* =====================================================================
 * v10: каталог всех зарегистрированных в Азербайджане препаратов (Тарифный совет, список цен по торговым названиям).
 * Фирма, МНН, доза (с объёмом ампулы/флакона), форма, упаковка, сколько в упаковке, производитель.
 * Файл лежит на GitHub рядом с приложением; телефон скачивает его один раз и хранит у себя (работает без интернета).
 * Подсказки — с первой буквы, как для карточек базы и справочника; выбор заполняет форму, дозу, единицу, упаковку.
 * ===================================================================== */
const CAT_URL = window.PWA_MODE ? './catalog.json' : 'https://gianttank98-sketch.github.io/medpunkt/catalog.json';
const CAT_MAX_AGE = 7 * 86400000;

function catDb() {
  if (S.catDbP) return S.catDbP;
  S.catDbP = new Promise((res, rej) => {
    try {
      const rq = indexedDB.open('med10cat', 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore('kv');
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error);
    } catch (e) { rej(e); }
  });
  S.catDbP.catch(() => { S.catDbP = null; });
  return S.catDbP;
}
async function catGet() { try { const db = await catDb(); return await new Promise(res => { const rq = db.transaction('kv').objectStore('kv').get('catalog'); rq.onsuccess = () => res(rq.result || null); rq.onerror = () => res(null); }); } catch (e) { return null; } }
async function catPut(v) { try { const db = await catDb(); await new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, 'catalog'); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); } catch (e) { } }

function catIndex(data) {
  if (!data || !Array.isArray(data.items)) return;
  const by = {}, inns = {};
  S.cat = data.items.map(x => {
    const e = { b: x[0], inn: x[1], d: x[2], code: FORMS.med.some(f => f[0] === x[3]) ? x[3] : 'med_other', pack: x[4], cnt: x[5], mfr: x[6], ru: x[7] || '', sk: skel(x[0]), qb: qkey(x[0]), qi: qkeyEn(x[1]) };
    e.qr = e.ru ? qkey(e.ru) : ''; // русское название фирмы (из аптечного каталога), если есть
    (by[e.sk] = by[e.sk] || []).push(e);
    if (e.inn && e.inn.indexOf('+') === -1 && !inns[e.qi]) inns[e.qi] = e.inn;
    return e;
  });
  S.catBy = by;
  S.catInns = Object.keys(inns).map(k => ({ s: catInnName(inns[k]), q: k }));
  S.catMeta = { ver: data.ver, source: data.source, n: S.cat.length, at: data.at || 0, nSup: 0, nDev: 0, sources: data.sources || null };
  // расходники: стандартные виды и размеры (рус / азерб. / англ.) + названия из реестра медизделий АР
  const supBy = {};
  S.catSup = (data.sup || []).map(x => {
    const e = { ru: x[0], az: x[1], en: x[2], z: x[3], code: FORMS.sup.some(f => f[0] === x[4]) ? x[4] : 'sup_other', unit: x[5] || 'pcs', syn: x[6] || '', sk: skel(x[0]), skAz: skel(x[1]) };
    e.qs = [qkey(x[0]), qkey(x[1]), qkeyEn(x[2])].concat(String(e.syn).split(',').map(w => qkey(w.trim())).filter(Boolean));
    e.qz = qkey(x[0] + ' ' + x[3]);
    (supBy[e.sk] = supBy[e.sk] || []).push(e);
    (supBy[e.skAz] = supBy[e.skAz] || []).push(e);
    return e;
  });
  S.supBy = supBy;
  S.catDev = (data.dev || []).map(x => ({ n: x[0], code: FORMS.sup.some(f => f[0] === x[1]) ? x[1] : 'sup_other', q: qkeyEn(x[0]), sk: skel(x[0]) }));
  S.catMeta.nSup = S.catSup.length; S.catMeta.nDev = S.catDev.length;
}
/** Подсказки расходников: «шприц», «şpris», «syringe», «канюля 18», «венфлон» — все размеры. */
function supSuggest(qs, fuzzy, short, qFull) {
  if (!S.catSup || !qs) return [];
  const out = [], seen = {};
  const qz = qFull ? qk(qFull) : '';
  // размер в запросе («перчатки 7», «канюля 18», «шприц 5»): число из запроса есть в размере — выше
  const qd = (String(qFull || '').match(/\d+(?:[.,]\d+)?/g) || []).map(x => x.replace('.', ','));
  const sizeHit = z => qd.some(d => new RegExp('(^|[^\\d,])' + d.replace(',', '[.,]') + '([.,]0)?([^\\d,]|$)').test(String(z || '')));
  for (const e of S.catSup) {
    let sc = 0;
    if (short) sc = e.qs.some(k => k.startsWith(qs)) ? 55 : 0;
    else { sc = Math.max.apply(null, e.qs.map(k => score(qs, k, fuzzy))); if (sc > 0 && ((qz && qz !== qs && e.qz.indexOf(qz) !== -1) || sizeHit(e.z))) sc += 15; }
    if (sc <= 0) continue;
    // без размера в запросе — один ряд на вид («Бинт эластичный — 24 размера»), размер выбирается кнопками после выбора;
    // с размером («канюля 18», «шприц 5») — конкретные размеры
    const many = (S.supBy[e.sk] || []).filter(x => x.ru === e.ru).length > 1;
    const collapse = many && !/\d/.test(String(qFull || ''));
    const k = collapse ? e.ru : e.ru + '|' + e.z;
    if (seen[k]) continue;
    seen[k] = 1;
    if (collapse) {
      const n = (S.supBy[e.sk] || []).filter(x => x.ru === e.ru).length;
      out.push({ kind: 'sup', label: e.ru, sub: e.az + ' · ' + t('supNSizes', { n }) + ' · ' + formName(e.code), se: e, multi: true, pri: 0, sc: sc - 1 });
    } else out.push({ kind: 'sup', label: e.ru + (e.z ? ' ' + e.z : ''), sub: e.az + (e.z ? ' ' + e.z : '') + ' · ' + formName(e.code), se: e, pri: 0, sc: sc - 1 });
    if (out.length > 300) break;
  }
  if (!short || qs.length >= 2) {
    // фирменные изделия из реестра медизделий: по их названию (латиницей) и по виду, который нашёлся по-русски/по-азербайджански
    // («система для инфузий» → все зарегистрированные infusion set разных фирм)
    const fam = [];
    out.forEach(o => { if (o.kind !== 'sup' || !o.se.en) return; const w = o.se.en.toLowerCase().replace(/\(.*?\)/g, '').split(/\s+/).filter(x => x && !/^(\d|iv$|2-way|3-way|disposable|sterile|non-sterile|adult|pediatric)/.test(x)); const k = w.slice(-2).join(' '); if (k && fam.indexOf(k) === -1) fam.push(k); });
    let n = 0;
    const seenDev = {};
    for (const d of S.catDev || []) {
      let sc = short ? (d.q.startsWith(qs) ? 30 : 0) : score(qs, d.q, false) - 20;
      if (sc <= 0 && fam.length && !short) { const low = d.n.toLowerCase(); if (fam.some(k => low.indexOf(k) !== -1)) sc = 25; }
      if (sc <= 0 || seenDev[d.n]) continue;
      seenDev[d.n] = 1;
      out.push({ kind: 'dev', label: d.n, sub: formName(d.code) + ' · ' + t('devTag'), de: d, pri: 0, sc });
      if (++n >= 40) break;
    }
  }
  return out;
}

/** «CALCIUM GLUCONATE» → «Calcium gluconate». */
function catInnName(s) { s = String(s || '').toLowerCase(); return s.charAt(0).toUpperCase() + s.slice(1); }
/** Загрузить каталог: сначала из памяти телефона, раз в неделю (или по кнопке) — свежий с GitHub. */
async function loadCatalog(force) {
  if (S.catLoading) return;
  S.catLoading = true;
  try {
    if (!S.cat) { const c = await catGet(); if (c) catIndex(c); }
    const old = !S.catMeta || Date.now() - (S.catMeta.at || 0) > CAT_MAX_AGE;
    if (force || old) {
      const r = await fetch(CAT_URL, { cache: force ? 'reload' : 'default' });
      if (r.ok) {
        const data = await r.json();
        data.at = Date.now();
        catIndex(data);
        await catPut(data);
        if (force) toast(t('catLoaded', { n: S.cat.length }));
      } else if (force) toast(t('catFail'), 'bad');
    }
  } catch (e) { if (force) toast(t('catFail'), 'bad'); }
  finally { S.catLoading = false; }
}

/** Варианты каталога для подсказки: с первой буквы (коротко) или по похожести (3+ буквы). */
function catSuggest(qs, fuzzy, short) {
  if (!S.cat || !qs) return [];
  const out = [];
  const seen = {};
  for (const e of S.cat) {
    let sc = 0;
    if (short) sc = e.qb.startsWith(qs) || (e.qr && e.qr.startsWith(qs)) ? 60 : (e.qi.startsWith(qs) ? 40 : 0);
    else sc = Math.max(score(qs, e.qb, fuzzy), e.qr ? score(qs, e.qr, fuzzy) : 0, score(qs, e.qi, fuzzy) - 10);
    if (sc <= 0) continue;
    const k = e.b + '|' + e.d + '|' + e.code;
    if (seen[k]) continue;
    seen[k] = 1;
    out.push({ kind: 'cat', label: e.b, sub: catLine(e), ce: e, pri: 0, sc: sc - 1 });
    if (out.length > 400) break;
  }
  return out;
}

/** Подсказки МНН: справочник (по-русски) + международные названия из реестра. */
function subSuggestionsCat(q) {

/* =====================================================================
 * v11: два написания — латиница/азербайджанский и русский, второе в скобках.
 *  Фирма: «KETONAL (Кетонал)», «Но-шпа (NO-ŞPA)»; если фирма — это и есть МНН, в скобках русское МНН:
 *  «SİPROFLOKSASİN (Ципрофлоксацин)». Вещество: «Дротаверин (Drotaverine)».
 *  Только показ: в базе название и МНН хранятся как есть (ключи карточек и группировка не меняются).
 * ===================================================================== */
const AZ_RU = { a: 'а', b: 'б', c: 'дж', ç: 'ч', d: 'д', e: 'е', ə: 'е', f: 'ф', g: 'г', ğ: 'г', h: 'г', x: 'х', ı: 'ы', i: 'и', j: 'ж', k: 'к', q: 'г', l: 'л', m: 'м', n: 'н', o: 'о', ö: 'ё', p: 'п', r: 'р', s: 'с', ş: 'ш', t: 'т', u: 'у', ü: 'ю', v: 'в', y: 'й', z: 'з', w: 'в' };
const RU_AZ = { а: 'a', б: 'b', в: 'v', г: 'g', д: 'd', е: 'e', ё: 'yo', ж: 'j', з: 'z', и: 'i', й: 'y', к: 'k', л: 'l', м: 'm', н: 'n', о: 'o', п: 'p', р: 'r', с: 's', т: 't', у: 'u', ф: 'f', х: 'x', ц: 'ts', ч: 'ç', ш: 'ş', щ: 'ş', ъ: '', ы: 'ı', ь: '', э: 'e', ю: 'yu', я: 'ya', і: 'i', ї: 'yi', є: 'ye', ґ: 'q' };
function titleCase(s) { return String(s).toLowerCase().replace(/(^|[\s\-(/])([^\s\-(/])/g, (m, a, b) => a + b.toUpperCase()); }
function azToRu(s) {
  // «İ» есть — значит, «I» без точки (ı); написано обычными латинскими заглавными — «I» это и
  const raw = String(s || '');
  let v = (/İ/.test(raw) ? raw.replace(/İ/g, 'i').replace(/I/g, 'ı') : raw.replace(/İ/g, 'i')).toLowerCase().replace(/i̇/g, 'i');
  v = v.replace(/ts/g, 'ц').replace(/sh/g, 'ш').replace(/ch/g, 'ч').replace(/kh/g, 'х').replace(/ph/g, 'ф').replace(/ya/g, 'я').replace(/yu/g, 'ю').replace(/yo/g, 'ё').replace(/(^|[\s-])ye/g, '$1е');
  v = v.replace(/(^|[\s\-(])e/g, '$1э'); // начальное «е» в лекарственных названиях — «э» (Etamzilat = Этамзилат)
  let out = '';
  for (const ch of v) out += AZ_RU[ch] !== undefined ? AZ_RU[ch] : ch;
  return titleCase(out.replace(/ий(?=$|[\s-])/g, 'ий'));
}
function ruToAz(s) {
  let out = '';
  for (const ch of String(s || '').toLowerCase()) out += RU_AZ[ch] !== undefined ? RU_AZ[ch] : ch;
  return out.toUpperCase().replace(/I/g, 'İ').replace(/ı/gi, 'I');
}
const isCyr = s => /[а-яёіїєґ]/i.test(String(s || ''));
const ALT_MEMO = new Map();
/** Второе написание названия (без скобок) или ''. */
function altName(name, substance) {
  const key = S.lang + '|' + name + '|' + (substance || '');
  if (ALT_MEMO.has(key)) return ALT_MEMO.get(key);
  let alt = '';
  const sk = skel(name);
  if (isCyr(name)) {
    // по-русски («Но-шпа», «Кальция глюконат») — в скобках так, как в реестре АР; нет в реестре — без скобок
    const sup = S.supBy && S.supBy[sk];
    if (sup && sup.length) { ALT_MEMO.set(key, sup[0].az); return sup[0].az; }
    let reg = S.catBy && S.catBy[sk];
    if ((!reg || !reg.length) && S.cat) { const q = qk(name); const e = q.length >= 5 && S.cat.find(x => x.qb === q); if (e) reg = [e]; }
    alt = reg && reg.length ? reg[0].b : '';
  } else if (name && S.supBy && S.supBy[sk] && S.supBy[sk][0].skAz === sk) {
    alt = S.supBy[sk][0].ru; // «Şpris» → (Шприц)
  } else if (name && S.lang !== 'az') {
    // фирма = МНН («SİPROFLOKSASİN» = ципрофлоксацин): в скобках русское МНН из справочника
    const reg = S.catBy && S.catBy[sk];
    const inn = reg && reg.length ? reg[0].inn : '';
    const ruSub = (refSubOf(name) || {}).s || (isCyr(substance) ? substance : '');
    const generic = inn && inn.indexOf('+') === -1 && qkeyEn(inn).slice(0, 6) === qk(name).slice(0, 6);
    alt = generic && ruSub ? ruSub : (reg && reg.length && reg[0].ru) ? reg[0].ru : azToRu(name);
  }
  if (alt && skel(alt) === sk && !isCyr(name) === !isCyr(alt)) alt = '';
  if (ALT_MEMO.size > 4000) ALT_MEMO.clear();
  ALT_MEMO.set(key, alt);
  return alt;
}
/** Второе написание МНН: русское ↔ международное. */
function altSub(sub, name) {
  if (!sub) return '';
  if (isCyr(sub)) {
    const reg = S.catBy && name ? S.catBy[skel(name)] : null;
    if (reg && reg.length && reg[0].inn && reg[0].inn.indexOf('+') === -1) return catInnName(reg[0].inn);
    const q = qk(sub);
    const hit = S.catInns && S.catInns.find(x => x.q === q || (q.length >= 6 && x.q.startsWith(q)));
    return hit ? hit.s : '';
  }
  if (S.lang === 'az') return '';

}
function nameWithAlt(name, substance) { const a = altName(name, substance); return a ? name + ' (' + a + ')' : name; }
function subWithAlt(sub, name) { const a = altSub(sub, name); return a ? sub + ' (' + a + ')' : sub; }
/** Для карточки: «KETONAL <span>(Кетонал)</span>» — второе написание тише. */
function nameHtml(it) { const a = altName(it.name, it.substance); return esc(it.name) + (a ? ' <span class="alt">(' + esc(a) + ')</span>' : ''); }
(function () {
  const st = document.createElement('style');
  st.textContent = '.alt{font-weight:400;color:var(--sub);font-size:.92em}';
  document.head.appendChild(st);
})();

const STORNO_OK = ['RECEIVE', 'RECEIVE_HIST', 'OPENING', 'REVISION', 'REVISION_FOUND', 'AUDIT'];

/** Кнопка «отменить» под строкой истории — только для админа (право «редактировать»), только один раз. */
function stornoBtnHtml(r, done) {
  if (!can('edit') || !r.opId || !r.delta || STORNO_OK.indexOf(r.type) === -1 || isStornoRow(r) || (done && done[r.opId + '|' + r.itemId])) return '';
  const desc = opName(r.type) + ' · ' + (r.itemName || '') + ' ' + (r.dosage || '') + ' ' + (r.delta > 0 ? '+' : '') + r.delta + ' · ' + fmtDate(String(r.time).slice(0, 10));
  return ' <button class="btn small ghost" style="padding:2px 8px;min-height:0" data-act="stornoModal" data-op="' + esc(r.opId) + '" data-item="' + esc(r.itemId || '') + '" data-day="' + esc(r.factDate || String(r.time).slice(0, 10)) + '" data-desc="' + esc(desc) + '">' + esc(t('stornoBtn')) + '</button>';
}
function stornoModal(opId, day, desc, itemId) {
  const closed = typeof monthClosed === 'function' && monthClosed(String(day || '').slice(0, 7));
  openModal('<h3>' + esc(t('stornoTitle')) + '</h3><div class="sum" style="margin-bottom:10px">' + esc(desc) + '</div>' +

    '<div class="field"><label>' + esc(t('stornoReason')) + '</label><input id="stReason" maxlength="200" placeholder="' + esc(t('stornoReasonPh')) + '"></div>' +
    (closed ? '<div class="field"><label>' + esc(t('closedReasonLbl')) + '</label><input id="stClosed" maxlength="200"></div>' : '') +
    '<div class="acts"><button class="btn ghost" data-act="closeModal">' + esc(t('cancel')) + '</button><button class="btn danger" data-act="stornoGo" data-op="' + esc(opId) + '" data-item="' + esc(itemId || '') + '">' + esc(t('stornoGo')) + '</button></div>');

async function stornoGo(btn, opId, itemId) {
  const reason = $('#stReason').value.trim();
  if (!reason) { toast(t('stornoNeedReason'), 'bad'); return; }
  const p = { targetOpId: opId, reason, itemId: itemId || '' };
  if ($('#stClosed')) { p.closedReason = $('#stClosed').value.trim(); if (!p.closedReason) { toast(t('stornoNeedReason'), 'bad'); return; } }
  let r = null;
  try { r = await busy(btn, () => rpcA('storno', p, { op: true, opId: newOpId() }), true); }
  catch (e) {
    // часть операции — в закрытом месяце: спросим причину и дадим нажать ещё раз
    if (e && e.res && e.res.code === 'E_MONTH_CLOSED' && !$('#stClosed')) {
      const box = document.createElement('div'); box.className = 'field';
      box.innerHTML = '<label>' + esc(t('closedReasonLbl')) + '</label><input id="stClosed" maxlength="200">';

    return;
  }

  closeModal();

  refreshState(true);
}

const FF_FIELDS = ['status', 'sex', 'ageMin', 'ageMax', 'doctor', 'dx', 'drug', 'allergy', 'flag', 'chronic', 'preg', 'q'];
const FF_MULTI = ['triage', 'outcome', 'arrType', 'arrFrom'];
function ffEmpty() { return { triage: [], outcome: [], arrType: [], arrFrom: [] }; }
function ffActive(f) {
  if (!f) return 0;
  let n = 0;
  FF_FIELDS.forEach(k => { if (f[k] !== undefined && f[k] !== '') n++; });
  FF_MULTI.forEach(k => { if (f[k] && f[k].length) n++; });
  if (f.noBlank) n++; if (f.noFin) n++; if (f.drugGiven) n++;
  return n;
}

/** Без связи: отбираем среди форм на телефоне по тому, что о них известно. */
function ffLocal(rows, f, from, to) {
  const sk = s => skel(String(s || '').toLowerCase().replace(/ə/g, 'a')).replace(/e/g, 'a');
  return rows.filter(x => {
    const day = String(x.arrivedAt || x.createdAt).slice(0, 10);
    if (day < from || day > to) return false;
    if (f.status && (f.status === 'closed' ? x.status !== 'closed' : x.status === 'closed')) return false;
    if (f.triage.length && f.triage.indexOf(x.triage) === -1) return false;
    if (f.outcome.length && f.outcome.indexOf(x.outcome) === -1) return false;
    if (f.sex && x.sex !== f.sex) return false;
    const age = ageOf(x.birthDate, x.arrivedAt || x.createdAt);
    if (f.ageMin !== '' && !(age !== '' && age >= Number(f.ageMin))) return false;
    if (f.ageMax !== '' && !(age !== '' && age <= Number(f.ageMax))) return false;
    if (f.dx && sk(x.dx + ' ' + (x.compl || '')).indexOf(sk(f.dx)) === -1) return false;
    if (f.allergy === 'yes' && !(x.allergy && x.allergy !== '—')) return false;
    if (f.allergy === 'no' && x.allergy && x.allergy !== '—') return false;
    if (f.noBlank && x.blankNo) return false;
    if (f.noFin && x.fin) return false;
    if (f.q && (sk(x.patient) + '|' + String(x.fin).toLowerCase() + '|' + String(x.blankNo).toLowerCase()).indexOf(sk(f.q)) === -1) return false;
    return true;
  });
}

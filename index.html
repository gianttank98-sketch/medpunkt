/* ---------- экран: список форм ---------- */
function fCtxKey() { return S.storeId + '|' + (S.me ? S.me.id : ''); }
/** Вход на экран «Формы» (или смена склада/пользователя): старая открытая форма другого склада не показывается. */
function fEnter() {
  if (S.fvCtx !== fCtxKey()) { if (S.fv && S.fv.storeId) fFlush(); S.fv = null; S.fd = {}; S.fSearch = null; S.fQ = ''; S.fHist = null; S.fc = null; S.fvCtx = fCtxKey(); }
  if (S.fv) fRenderEditor(true); else renderFormsList();
  fLoadList();
}
function renderForms() {
  if (S.fvCtx !== fCtxKey()) return fEnter();
  if (!S.fv) { const ae = document.activeElement; if (ae && ae.id === 'fQ') return; return renderFormsList(); }
  fRenderSaveState();
}
function fListRows() {
  const c = fCache();
  const by = {};
  c.list.forEach(x => { by[x.id] = x; });
  // формы, изменённые на телефоне, — поверх списка с сервера
  Object.keys(c.full).forEach(id => { const f = c.full[id]; if (f.status === 'deleted') { delete by[id]; return; } if (fPendingOps(id).length || f.local || !by[id]) by[id] = Object.assign({}, by[id] || {}, fSummary(Object.assign({}, f, { data: fData(id) })), { status: fStatus(id) }); });
  return Object.keys(by).map(k => by[k]).filter(x => x.status !== 'deleted');
}
function renderFormsList() {
  const box = $('#formsBox');
  if (!box) return;
  const flt = S.fFilter || 'open';
  let rows = S.fSearch ? S.fSearch.rows : fListRows();
  if (!S.fSearch) {
    const tdy = bakuToday();
    if (flt === 'open') rows = rows.filter(x => x.status !== 'closed');
    if (flt === 'today') rows = rows.filter(x => String(x.arrivedAt || x.createdAt).slice(0, 10) === tdy || x.status !== 'closed');
  }
  rows.sort((a, b) => String(b.arrivedAt || b.updatedAt || '').localeCompare(String(a.arrivedAt || a.updatedAt || '')));
  const tri = { green: '🟢', yellow: '🟡', red: '🔴', black: '⚫' };
  box.innerHTML = '<div class="row" style="margin-bottom:10px">' + (can('forms') ? '<button class="btn primary grow" data-act="fNew">' + esc(t('formNew')) + '</button>' : '') + '<button class="btn ghost" data-act="fPrintBlank">' + esc(t('formBlankPrint')) + '</button></div>' +
    '<div class="searchbar"><input type="search" id="fQ" autocomplete="off" placeholder="' + esc(t('formsSearchPh')) + '" value="' + esc(S.fQ || '') + '"></div>' +
    (S.fSearch ? '' : '<div class="chips">' + [['open', 'formsFilterOpen'], ['today', 'formsFilterToday'], ['all', 'formsFilterAll']].map(x => '<button class="chip' + (flt === x[0] ? ' on' : '') + '" data-act="fFilter" data-v="' + x[0] + '">' + esc(t(x[1])) + '</button>').join('') + '</div>') +
    (S.fOffline ? '<div class="info">' + esc(t('formsOfflineList')) + '</div>' : '') +
    (rows.length ? rows.map(x => {
      const age = ageOf(x.birthDate, x.arrivedAt || x.createdAt);
      const unsent = fPendingOps(x.id).length;
      const st = x.status === 'closed' ? '<span class="tag green">' + esc(t('formClosed')) + '</span>' : x.status === 'closing' ? '<span class="tag amber">' + esc(t('formClosing')) + '</span>' : '<span class="tag">' + esc(t('formDraft')) + '</span>';
      return '<button class="card f-card" data-act="fOpen" data-id="' + esc(x.id) + '"><div class="row"><b class="' + (x.blankNo ? '' : 'f-noblank') + '">№ ' + esc(x.blankNo || t('formNoBlank')) + '</b> ' + (tri[x.triage] || '') +
        '<span class="grow" style="text-align:right">' + st + '</span></div>' +
        '<div class="f-pt">' + esc(x.patient || '—') + (age !== '' ? ', ' + esc(t('fAge', { n: age })) : '') + (x.fin ? ' · ' + esc(x.fin) : '') + '</div>' +
        '<div class="muted">' + esc(fmtDt(x.arrivedAt || x.createdAt)) + (x.dx || x.compl ? ' · ' + esc(x.dx || x.compl) : '') + (x.allergy && x.allergy !== '—' ? ' · <span style="color:var(--red)">⚠️ ' + esc(x.allergy) + '</span>' : '') + (unsent ? ' · ' + esc(t('formUnsent')) : '') + '</div></button>';
    }).join('') : '<div class="empty">' + esc(t('formsEmpty')) + '</div>');
  const q = $('#fQ');
  q.addEventListener('input', () => { clearTimeout(S.fqT); S.fqT = setTimeout(() => fSearch(q.value.trim()), 350); });

}
async function fLoadList() {
  if (!S.gas || !S.sess) return;
  const who = S.storeId + '|' + (S.me && S.me.id);
  let r;
  try { r = await rpc('formsList', { days: 30 }); } catch (e) { S.fOffline = true; if (S.screen === 'forms' && !S.fv) renderFormsList(); return; }
  if (who !== S.storeId + '|' + (S.me && S.me.id)) return;
  S.fOffline = false;
  if (r && r.ok) { const c = fCache(); c.list = r.rows; c.ts = Date.now(); fSaveCache(); }
  if (S.screen === 'forms' && !S.fv) renderFormsList();
}
async function fSearch(q) {
  S.fQ = q;
  if (!q) { S.fSearch = null; S.fFocusQ = true; return renderFormsList(); }
  // без связи — ищем среди сохранённых на телефоне
  const local = () => { const qs = skel(q.replace(/ə/gi, 'a')).replace(/e/g, 'a'), qn = q.toUpperCase().replace(/[\s№#.\-]/g, ''); return fListRows().filter(x => String(x.blankNo).toUpperCase().replace(/[\s№#.\-]/g, '') === qn || (qn.length >= 4 && x.fin.indexOf(qn) === 0) || (qs.length >= 3 && skel(String(x.patient).replace(/ə/gi, 'a')).replace(/e/g, 'a').indexOf(qs) !== -1)); };
  let rows = local();
  try { const r = await rpc('formsList', { q }); if (r && r.ok) { const have = {}; r.rows.forEach(x => { have[x.id] = 1; }); rows = r.rows.concat(rows.filter(x => !have[x.id])); } } catch (e) { }
  if (S.fQ !== q) return;
  S.fSearch = { q, rows };
  S.fFocusQ = true;
  renderFormsList();
}

/* ---------- новая форма, открыть ---------- */
function fNew() {
  if (!can('forms')) return;
  const id = newFormId();
  const c = fCache();
  c.full[id] = { id, status: 'draft', data: {}, att: [], createdAt: nowLocal().replace('T', ' '), createdByName: S.me.name, local: true, _seen: Date.now() };
  S.fv = { id, edit: false, storeId: S.storeId };
  S.fd = {};
  S.fOpen = { patient: 1 };
  // сразу на сервер (в очередь): с этого момента форма есть, даже если телефон потеряется
  fQueue('formSave', { id, patch: { arrivedAt: nowLocal(), triBy: S.me.name, vit: { v1: { t: nowLocal().slice(11), ord: '1', byName: S.me.name } } } }, t('formsTitle'));
  fSaveCache();
  fRenderEditor();
  toast(t('fNewToast'));
}
async function fOpen(id) {
  fFlush();
  const c = fCache();
  S.fv = { id, edit: false, storeId: S.storeId };
  S.fd = {};
  S.fOpen = S.fOpen || { patient: 1 };
  fTouch(id);
  fRenderEditor();
  if (!S.gas) return;
  try {
    const r = await rpc('formGet', { id });
    if (r && r.ok && S.fv && S.fv.id === id) {
      c.full[id] = Object.assign(r.form, { _seen: Date.now() });
      fSaveCache();
      const ae = document.activeElement;
      if (!(ae && ae.closest && ae.closest('#formsBox') && /INPUT|TEXTAREA|SELECT/.test(ae.tagName))) fRenderEditor(true);
    }
  } catch (e) { }
}
function fBack() {
  fFlush();
  S.fv = null; S.fd = {};
  S.fHist = null;
  renderFormsList();
  window.scrollTo(0, 0);
  fLoadList();
}

/** Прошлые обращения по FİN или ФИО + дата рождения (спрашиваем сервер, когда эти поля изменились). */
async function fHistoryCheck(d) {
  if (!S.fv || !S.gas) return;
  const id = S.fv.id;
  const key = (d.fin || '') + '|' + (d.pName || '') + '|' + (d.pBirth || '');
  if (S.fHist && S.fHist.id === id && S.fHist.key === key) return;
  const fin = String(d.fin || '').toUpperCase();
  if (fin.length < 7 && !(d.pName && d.pBirth)) { S.fHist = { id, key, rows: [] }; return; }
  S.fHist = { id, key, rows: (S.fHist && S.fHist.id === id) ? S.fHist.rows : [] };
  let r;
  try { r = await rpc('formHistory', { fin, name: d.pName || '', birth: d.pBirth || '', exceptId: id }); } catch (e) { return; }
  if (!r || !r.ok || !S.fv || S.fv.id !== id) return;
  const had = S.fHist.rows.length;
  S.fHist = { id, key, rows: r.rows };
  if (r.rows.length !== had) {
    const ae = document.activeElement;
    if (!(ae && ae.closest && ae.closest('#formsBox') && /INPUT|TEXTAREA/.test(ae.tagName))) fRenderEditor(true);
    else { const al = r.rows.map(h => h.allergy).filter(a => a && a !== '—'); toast(t('fHistoryN', { n: r.rows.length }) + (al.length ? ' · ⚠️ ' + al[0] : ''), al.length ? 'bad' : '', null, 7000); }
  }
}

/* ---------- ввод в полях ---------- */
function fInputVal(el) {
  if (el.type === 'checkbox') return el.checked ? true : null;
  if (el.type === 'number') return el.value === '' ? null : Number(el.value);
  if (el.type === 'datetime-local') return el.value ? el.value : null;
  const v = el.value;
  return v === '' ? null : v;
}
function fOnInput(el, commit) {
  if (!S.fv || !el.closest('#formsBox')) return;
  if (el.dataset.f) {
    let v = fInputVal(el);
    if (el.dataset.f === 'fin' && v) { v = String(v).toUpperCase().replace(/\s+/g, ''); el.classList.toggle('f-bad', !finOk(v)); const n = el.parentElement.querySelector('.f-finnote'); if (n) n.classList.toggle('hidden', finOk(v)); }
    if (el.dataset.f === 'blankNo') { el.classList.toggle('f-bad', !v); const n = $('.f-blanknote'); if (n) n.classList.toggle('hidden', !!v); }
    fSet({ [el.dataset.f]: v });
    if (el.dataset.f === 'allergy') { const a = String(v || '').trim(); $('#fAllergy').innerHTML = a ? '<div class="f-alert">' + esc(t('formAllergyBanner', { a })) + '</div>' : ''; }
    // без перерисовки всей формы: человек уже мог перейти в следующее поле
    if (el.dataset.f === 'pBirth') { const a = ageOf(v, fData(S.fv.id).arrivedAt); const sp = $('#fAgeLbl'); if (sp) sp.textContent = a !== '' ? ' · ' + t('fAge', { n: a }) : ''; }
    if (el.dataset.f === 'allergyNone') { const ai = $('[data-f=allergy]'); if (ai) ai.disabled = !!v; const a = v ? '' : String(fData(S.fv.id).allergy || '').trim(); $('#fAllergy').innerHTML = a ? '<div class="f-alert">' + esc(t('formAllergyBanner', { a })) + '</div>' : ''; }
    if (commit && ['pBirth', 'fin', 'pName'].indexOf(el.dataset.f) !== -1) { fFlush(); fHistoryCheck(fData(S.fv.id)); return; }
  } else if (el.dataset.row) {
    const v = fInputVal(el);
    if (el.dataset.row === 'vit') { const lv = vitLevel(el.dataset.rf, v); el.classList.toggle('v-warn', lv === 'warn'); el.classList.toggle('v-crit', lv === 'crit'); }
    fSet({ [el.dataset.row]: { [el.dataset.rid]: { [el.dataset.rf]: v } } });
  } else return;
  if (commit) fFlush();
}

function fAllergyHit(d, drug) {
  const al = allergyText(d);
  if (!al) return '';
  const ds = skel(drug);
  return al.split(/[,;/]+|\s+/).map(w => w.trim()).filter(w => w.length >= 4).find(w => { const ws = skel(w).slice(0, 5); return ws.length >= 4 && ds.indexOf(ws) !== -1; }) ? al : '';
}
function fRxAdd() {
  const el = $('#fRxNew');

  if (hit && !confirm(t('fRxAllergy', { a: hit }))) return;

    const d = fData(id);

/* ---------- фото: открыть, убрать ---------- */
async function fAttOpen(attId) {
  if (!S.fv) return;
  S.fImg = S.fImg || {};
  const key = S.fv.id + ':' + attId;
  openModal('<div id="fImgBox" class="muted">' + esc(t('fAttLoading')) + '</div><div class="acts"><button class="btn ghost" data-act="closeModal">' + esc(t('close')) + '</button></div>');
  let src = S.fImg[key];
  if (!src) {
    let r;
    try { r = await rpc('formFile', { formId: S.fv.id, attId }); } catch (e) { const b = $('#fImgBox'); if (b) b.textContent = t('fAttNoNet'); return; }
    if (!r || !r.ok) { const b = $('#fImgBox'); if (b) b.textContent = errText(r); return; }
    src = 'data:' + r.mime + ';base64,' + r.b64;
    S.fImg = {}; S.fImg[key] = src; // в памяти — только последнее открытое
  }
  const b = $('#fImgBox'); if (b) { b.classList.remove('muted'); b.innerHTML = '<img src="' + src + '" alt="" style="width:100%;height:auto;border-radius:8px;display:block">'; }
}
function fAttDel(attId) {
  if (!S.fv || !confirm(t('fAttRemove'))) return;
  fQueue('formDetach', { formId: S.fv.id, attId }, t('formsTitle'));
  const f = fCache().full[S.fv.id];
  if (f) (f.att || []).forEach(a => { if (a.id === attId) a.removed = nowLocal(); });
  fSaveCache();
  fRenderEditor(true);
}

/* ---------- меню формы: печать, журнал, удалить ---------- */
function fMenu() {
  const id = S.fv.id, st = fStatus(id), f = fCache().full[id] || {};
  const mineDraft = st === 'draft' && (f.local || f.createdBy === (S.me && S.me.id));
  openModal('<h3>' + esc(t('formsTitle')) + '</h3><div class="col-btns">' +
    '<button class="btn ghost block" data-act="fPrintThis">' + esc(t('fPrint')) + '</button>' +
    (can('formsEdit') ? '<button class="btn ghost block" data-act="fAudit">' + esc(t('fAudit')) + '</button>' : '') +
    (st === 'draft' && (mineDraft || can('formsEdit')) ? '<button class="btn ghost block" style="color:var(--red)" data-act="fDelete">' + esc(t('fDelete')) + '</button>' : '') +
    '</div><div class="acts"><button class="btn ghost" data-act="closeModal">' + esc(t('close')) + '</button></div>');
}
async function fAudit() {
  openModal('<h3>' + esc(t('fAuditTitle')) + '</h3><div id="faBox" class="muted">' + esc(t('loading')) + '</div><div class="acts"><button class="btn ghost" data-act="closeModal">' + esc(t('close')) + '</button></div>');
  let r;
  try { r = await rpc('formAudit', { id: S.fv.id }); } catch (e) { return toast(t('E_NETWORK'), 'bad'); }
  const b = $('#faBox'); if (!b) return;
  if (!r || !r.ok) { b.textContent = errText(r); return; }
  b.classList.remove('muted');
  b.innerHTML = r.rows.slice().reverse().map(x => '<div class="list-row"><div class="grow"><b>' + esc(fmtDt(x.time)) + '</b> · ' + esc(x.userName) + '<div class="muted">' + esc(t('fev_' + x.event)) + (x.info ? ' — ' + esc(x.info) : '') + '</div></div></div>').join('') || '<div class="muted">—</div>';
}
function fDelete() {
  const reason = prompt(t('fDeleteConfirm'), '');
  if (reason === null) return;
  const id = S.fv.id;
  fFlush();
  fQueue('formDelete', { id, reason: reason.slice(0, 300) }, t('formsTitle'));
  const c = fCache();
  if (c.full[id]) c.full[id].status = 'deleted';
  c.list = c.list.filter(x => x.id !== id);
  fSaveCache();
  closeModal();
  toast(t('fDeletedToast'));
  fBack();
}
DONE.formDelete = function (op, r) { const c = fCache(); if (c.full[op.payload.id]) { c.full[op.payload.id].status = 'deleted'; fSaveCache(); } };

function fClose() {
  const id = S.fv.id;
  const d = fData(id);
  if (!d.blankNo || !d.pName || !d.outcome) return;
  if (!confirm(t('fCloseConfirm', { n: d.blankNo }))) return;
  fFlush();
  fQueue('formSave', { id, patch: {}, close: true }, t('formsTitle') + ' №' + d.blankNo);
  fRenderEditor(true);
  if (!S.online) toast(t('fQueuedToast'));
}

/* ---------- скан кода чека ---------- */
async function fScanReceiptFile(file) {
  toast(t('scanning'));
  let code = '';
  try { code = await decodeBarcode(file); } catch (e) { code = ''; }
  if (!code) return toast(t('fScanFail'), 'bad');
  fSet({ receipt: String(code).trim().slice(0, 120) });
  fFlush();
  fRenderEditor(true);
  toast(t('scanFound', { code: String(code).trim().slice(0, 40) }));
}

function sha256Hex(str) {
  const K = [0x428a2f98, 0x71374491, 0xb5c0fbcf, 0xe9b5dba5, 0x3956c25b, 0x59f111f1, 0x923f82a4, 0xab1c5ed5, 0xd807aa98, 0x12835b01, 0x243185be, 0x550c7dc3, 0x72be5d74, 0x80deb1fe, 0x9bdc06a7, 0xc19bf174,
    0xe49b69c1, 0xefbe4786, 0x0fc19dc6, 0x240ca1cc, 0x2de92c6f, 0x4a7484aa, 0x5cb0a9dc, 0x76f988da, 0x983e5152, 0xa831c66d, 0xb00327c8, 0xbf597fc7, 0xc6e00bf3, 0xd5a79147, 0x06ca6351, 0x14292967,
    0x27b70a85, 0x2e1b2138, 0x4d2c6dfc, 0x53380d13, 0x650a7354, 0x766a0abb, 0x81c2c92e, 0x92722c85, 0xa2bfe8a1, 0xa81a664b, 0xc24b8b70, 0xc76c51a3, 0xd192e819, 0xd6990624, 0xf40e3585, 0x106aa070,
    0x19a4c116, 0x1e376c08, 0x2748774c, 0x34b0bcb5, 0x391c0cb3, 0x4ed8aa4a, 0x5b9cca4f, 0x682e6ff3, 0x748f82ee, 0x78a5636f, 0x84c87814, 0x8cc70208, 0x90befffa, 0xa4506ceb, 0xbef9a3f7, 0xc67178f2];
  const bytes = Array.from(new TextEncoder().encode(str));
  const bitLen = bytes.length * 8;
  bytes.push(0x80);
  while (bytes.length % 64 !== 56) bytes.push(0);
  for (let i = 7; i >= 0; i--) bytes.push(i >= 4 ? 0 : (bitLen >>> (i * 8)) & 0xff);
  const H = [0x6a09e667, 0xbb67ae85, 0x3c6ef372, 0xa54ff53a, 0x510e527f, 0x9b05688c, 0x1f83d9ab, 0x5be0cd19];
  const rotr = (x, n) => (x >>> n) | (x << (32 - n));
  for (let o = 0; o < bytes.length; o += 64) {
    const w = new Array(64);
    for (let i = 0; i < 16; i++) w[i] = (bytes[o + i * 4] << 24) | (bytes[o + i * 4 + 1] << 16) | (bytes[o + i * 4 + 2] << 8) | bytes[o + i * 4 + 3];
    for (let i = 16; i < 64; i++) {
      const s0 = rotr(w[i - 15], 7) ^ rotr(w[i - 15], 18) ^ (w[i - 15] >>> 3), s1 = rotr(w[i - 2], 17) ^ rotr(w[i - 2], 19) ^ (w[i - 2] >>> 10);
      w[i] = (w[i - 16] + s0 + w[i - 7] + s1) | 0;
    }
    let [a, b, c, d, e, f, g, h] = H;
    for (let i = 0; i < 64; i++) {
      const t1 = (h + (rotr(e, 6) ^ rotr(e, 11) ^ rotr(e, 25)) + ((e & f) ^ (~e & g)) + K[i] + w[i]) | 0;
      const t2 = ((rotr(a, 2) ^ rotr(a, 13) ^ rotr(a, 22)) + ((a & b) ^ (a & c) ^ (b & c))) | 0;
      h = g; g = f; f = e; e = (d + t1) | 0; d = c; c = b; b = a; a = (t1 + t2) | 0;
    }
    H[0] = (H[0] + a) | 0; H[1] = (H[1] + b) | 0; H[2] = (H[2] + c) | 0; H[3] = (H[3] + d) | 0; H[4] = (H[4] + e) | 0; H[5] = (H[5] + f) | 0; H[6] = (H[6] + g) | 0; H[7] = (H[7] + h) | 0;
  }
  return H.map(x => (x >>> 0).toString(16).padStart(8, '0')).join('');
}
/** Приложение привязано к серверу владельца: любая другая ссылка (даже настоящая ссылка Apps Script) не принимается. */
function apiPinned(u) { return !window.PWA_API_SHA256 || sha256Hex(u) === window.PWA_API_SHA256; }
function apiUrlOk(u) {
  if (!apiPinned(u)) return false;
  return /^https:\/\/script\.google\.com\/(a\/[A-Za-z0-9.-]+\/)?macros\/s\/[A-Za-z0-9_-]{20,}\/exec$/.test(u) ||
    (!!window.PWA_ALLOW_LOCAL && /^http:\/\/(localhost|127\.0\.0\.1)(:\d+)?\/[A-Za-z0-9\/_-]*exec$/.test(u)); // локальный — только в автотестах
}
/** Короткий «отпечаток» сервера для экрана входа: начало и конец номера развёртывания. */
function apiShort(u) { const m = String(u || '').match(/\/s\/([A-Za-z0-9_-]+)\/exec$/) || String(u || '').match(/\/\/([^/]+)/); const id = m ? m[1] : ''; return id.length > 14 ? id.slice(0, 6) + '…' + id.slice(-6) : id; }
function pwaSetApi(u) {
  LS.set('MED6_API', u);
  S.gas = !!u;
  kvSet('api', u);
}

/** Запрос к серверу из приложения: обычный POST с JSON (текстом — так браузер не делает лишний предварительный запрос). */
async function rpcFetch(action, p, timeoutMs) {
  const url = pwaApi();
  if (!url) throw new Error('NO_API');
  const ctl = typeof AbortController === 'function' ? new AbortController() : null;
  const tm = setTimeout(() => { if (ctl) ctl.abort(); }, timeoutMs || 60000);
  try {
    const res = await fetch(url, { method: 'POST', body: JSON.stringify({ action, payload: p }), headers: { 'Content-Type': 'text/plain;charset=utf-8' }, redirect: 'follow', signal: ctl ? ctl.signal : undefined, cache: 'no-store' });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const txt = await res.text();
    try { return JSON.parse(txt); } catch (e) { throw new Error('BAD_JSON'); } // страница входа Google вместо ответа = доступ не «для всех»
  } finally { clearTimeout(tm); }
}

/* ---------- общее хранилище с фоновым помощником ---------- */
function kvOpen() {
  if (S.kvP) return S.kvP;
  S.kvP = new Promise((res, rej) => {
    try {
      const rq = indexedDB.open('med5q', 1);
      rq.onupgradeneeded = () => rq.result.createObjectStore('kv');
      rq.onsuccess = () => res(rq.result);
      rq.onerror = () => rej(rq.error);
    } catch (e) { rej(e); }
  });
  S.kvP.catch(() => { S.kvP = null; });
  return S.kvP;
}
async function kvSet(k, v) {
  if (!PWA) return;
  try { const db = await kvOpen(); await new Promise((res, rej) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = res; tx.onerror = () => rej(tx.error); }); } catch (e) { }
}
async function kvGet(k) {
  try { const db = await kvOpen(); return await new Promise(res => { const rq = db.transaction('kv').objectStore('kv').get(k); rq.onsuccess = () => res(rq.result); rq.onerror = () => res(undefined); }); } catch (e) { return undefined; }
}

/** После каждого изменения очереди и входа/выхода: копия для фонового помощника + просьба отправить, когда будет сеть. */
function pwaMirror() {
  if (!PWA) return;
  const q = JSON.parse(JSON.stringify(S.queue));
  const auth = S.sess && S.me ? { userId: S.me.id, sess: S.sess } : null;
  kvSet('queue', q).then(() => kvSet('auth', auth)).then(() => kvSet('api', pwaApi())).then(() => kvSet('done', doneList().slice(-1000))).then(() => { if (q.length) pwaSyncRequest(); });
  pwaBadge();
}
function pwaSyncRequest() {
  if (!('serviceWorker' in navigator)) return;
  navigator.serviceWorker.ready.then(reg => {
    if (reg.sync && reg.sync.register) reg.sync.register('med-flush').catch(() => { });
  }).catch(() => { });
}
function pwaBadge() {
  try {
    const n = S.queue.filter(o => o.userId === (S.me && S.me.id)).length;
    if (navigator.setAppBadge) { if (n) navigator.setAppBadge(n).catch(() => { }); else navigator.clearAppBadge().catch(() => { }); }
  } catch (e) { }
}

/** Что фоновый помощник уже отправил, пока приложение было закрыто или свёрнуто: убираем из своей очереди. */
async function pwaReconcile() {
  if (!PWA) return;
  const done = (await kvGet('swDone')) || [];
  const failed = (await kvGet('swFailed')) || [];
  if (!done.length && !failed.length) return;
  const doneSet = {}, resOf = {};
  done.forEach(e => { const id = typeof e === 'string' ? e : e.id; doneSet[id] = 1; if (e && e.res) resOf[id] = e.res; });
  S.queue = S.queue.filter(o => {
    if (!doneSet[o.opId]) return true;
    markDone(o.opId); markMine(o.opId, 'sent'); qTrail('sw-sent', o);
    // то же, что сделало бы приложение, получив ответ само (отмена списания, нехватка при списании)
    if (DONE[o.action]) { try { DONE[o.action](o, { ok: true, result: resOf[o.opId] }); } catch (e) { } }
    return false;
  });
  failed.forEach(f => {
    if (doneSet[f.op.opId] || isDone(f.op.opId)) return; // ушла раньше (дубль из старой копии очереди) — это не отказ
    const i = S.queue.findIndex(o => o.opId === f.op.opId);
    if (i !== -1) S.queue.splice(i, 1);
    if (!S.failed.some(o => o.opId === f.op.opId)) { f.op.error = f.error; S.failed.push(f.op); markMine(f.op.opId, 'rejected'); if (FAIL[f.op.action]) { try { FAIL[f.op.action](f.op); } catch (e) { } } }
    markDone(f.op.opId);
  });
  // очищаем только то, что прочитали (помощник мог дописать новое)
  const now = (await kvGet('swDone')) || [];
  await kvSet('swDone', now.filter(e => !doneSet[typeof e === 'string' ? e : e.id]));
  const nowF = (await kvGet('swFailed')) || [];
  await kvSet('swFailed', nowF.filter(f => !failed.some(x => x.op.opId === f.op.opId)));
  LS.set('MED2_QUEUE', S.queue);
  LS.set('MED2_FAILED', S.failed);
  pwaMirror();
  recompute();
  if (S.screen !== 'login') renderAll();
}
/** Отправка в приложении и в фоновом помощнике не идёт одновременно (одна и та же операция ушла бы дважды — сервер бы её узнал, но лишний запрос). */
function pwaLock(fn) {
  if (PWA && navigator.locks && navigator.locks.request) return navigator.locks.request('med-flush', async () => { await pwaReconcile(); return fn(); });
  return fn();
}

/* ---------- установка ---------- */
let pwaInstallEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); pwaInstallEvt = e; if (S.screen !== 'login') renderHeader(); });
window.addEventListener('appinstalled', () => { pwaInstallEvt = null; toast(t('pwaInstalled')); if (S.screen !== 'login') renderHeader(); });
function pwaStandalone() { try { return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; } catch (e) { return false; } }
function pwaIos() { return /iPhone|iPad|iPod/.test(navigator.userAgent || '') || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1); }
function pwaInstallBanner() {
  if (!PWA || pwaStandalone() || LS.get('MED6_NOINSTALL', 0) > Date.now()) return '';
  if (pwaInstallEvt) return '<div class="banner"><span>' + esc(t('pwaInstallBanner')) + '</span><button data-act="pwaInstall">' + esc(t('pwaInstallBtn')) + '</button><button data-act="pwaInstallLater">✕</button></div>';
  if (pwaIos()) return '<div class="banner"><span>' + esc(t('pwaIosHint')) + '</span><button data-act="pwaInstallLater">✕</button></div>';
  return '';
}
async function pwaInstall() {
  if (!pwaInstallEvt) return;
  pwaInstallEvt.prompt();
  try { await pwaInstallEvt.userChoice; } catch (e) { }
  pwaInstallEvt = null;
  renderHeader();
}

/* ---------- первый запуск: адрес сервера ---------- */
function pwaSetupHtml(msg) {
  return '<div class="card login-card"><div class="login-logo">💊</div><h2 class="scr" style="text-align:center">' + esc(t('app')) + '</h2>' +
    (msg ? '<div class="info">' + esc(msg) + '</div>' : '') +
    '<div class="muted" style="margin-bottom:12px">' + esc(t('pwaApiHint')) + '</div>' +
    '<div class="field"><label>' + esc(t('pwaApiLabel')) + '</label><input type="url" id="apiInp" autocapitalize="none" autocomplete="off" placeholder="https://script.google.com/macros/s/…/exec" value="' + esc(pwaApi()) + '"></div>' +
    '<button class="btn primary block" data-act="pwaApiSave">' + esc(t('pwaApiSave')) + '</button></div>';
}
async function pwaApiSave(btn) {
  const u = ($('#apiInp').value || '').trim().replace(/\/dev$/, '/exec').replace(/[?#].*$/, '');
  if (!apiUrlOk(u)) return toast(t('pwaApiBad'), 'bad');
  const old = pwaApi();
  if (old && u !== old) {
    if (!confirm(t('pwaApiChangeConfirm', { a: apiShort(old), b: apiShort(u) }))) return;
    saveSession('', null); // на другой сервер — только с новым входом; операции старого сервера туда не уйдут
    S.base = null; S.view = null; kvSet('auth', null);
  }
  pwaSetApi(u);
  S.setupNeeded = undefined;
  let r;
  try { r = await busy(btn, () => rpc('bootstrap'), true); } catch (e) { r = null; }
  if (!r || !r.ok) { toast(t('pwaApiNoAnswer'), 'bad'); }
  renderLogin();
}
/** Ссылка вида …/medpunkt/?api=https://script.google.com/…/exec — админ рассылает её сотрудникам один раз. */
function pwaReadApiParam() {
  if (!PWA) return;
  try {
    const qs = new URLSearchParams(location.search);
    const u = (qs.get('api') || '').trim();
    // ссылка задаёт сервер только в первый раз. Сервер уже выбран — чужая ссылка не может молча увести вход и данные
    if (u && apiUrlOk(u) && !pwaApi()) { pwaSetApi(u); S.setupNeeded = undefined; }
    else if (u && u !== pwaApi()) S.pwaApiIgnored = true;
    if (qs.has('api')) history.replaceState(null, '', location.pathname + (qs.get('loc') ? '?loc=' + encodeURIComponent(qs.get('loc')) : ''));
  } catch (e) { }
}
function pwaShareLink() {
  const api = PWA ? pwaApi() : (S.webAppUrl || '');
  return api ? PWA_URL + '?api=' + encodeURIComponent(api) : '';
}
function pwaShareModal() {
  const link = pwaShareLink();
  if (!link) return toast(t('pwaNoLink'), 'bad');
  openModal('<h3>📱 ' + esc(t('pwaShareTitle')) + '</h3><div class="muted" style="margin-bottom:10px">' + esc(t('pwaShareHint')) + '</div>' +
    '<div class="field"><input type="text" readonly value="' + esc(link) + '" onclick="this.select()"></div>' +
    '<div class="acts"><button class="btn ghost" data-act="closeModal">' + esc(t('close')) + '</button><button class="btn ghost" data-act="copyCreds" data-text="' + esc(link) + '">' + esc(t('copy')) + '</button>' +
    '<a class="btn primary" style="display:inline-flex;align-items:center;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/?text=' + encodeURIComponent(t('pwaShareText') + '\n' + link) + '">WhatsApp</a></div>');
}

/* ---------- фоновый помощник ---------- */
function pwaInit() {
  if (!PWA) return;
  // сохранённый ранее сервер не совпадает с привязкой этой сборки — забываем его (и вход к нему)
  if (pwaApi() && !apiPinned(pwaApi())) { LS.del('MED6_API'); saveSession('', null); kvSet('auth', null); }
  pwaReadApiParam();
  S.gas = !!pwaApi();
  if (S.pwaApiIgnored) setTimeout(() => toast(t('pwaApiIgnored'), 'bad', null, 9000), 600);
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js').catch(() => { });
    // установленное приложение на Android может само просыпаться раз в 15+ минут и отправлять накопленное
    navigator.serviceWorker.ready.then(async reg => {
      try {
        if (!reg.periodicSync || !navigator.permissions) return;
        const st = await navigator.permissions.query({ name: 'periodic-background-sync' });
        if (st.state === 'granted') await reg.periodicSync.register('med-flush', { minInterval: 15 * 60 * 1000 });
      } catch (e) { }
    }).catch(() => { });
    navigator.serviceWorker.addEventListener('message', e => {
      const m = e.data || {};
      if (m.type === 'flush') flushQueue();
      if (m.type === 'flushed') pwaReconcile().then(() => refreshState());
    });
  }
  // хранилище «не стирать при нехватке места» — очередь без связи важнее кэша
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) { pwaMirror(); return; }
    pwaReconcile().then(() => flushQueue());
  });
  kvSet('api', pwaApi());
  pwaReconcile();
  pwaMirror();
}

Object.assign(H, {
  pwaInstall: () => pwaInstall(),
  pwaInstallLater: () => { LS.set('MED6_NOINSTALL', Date.now() + 7 * 86400000); renderHeader(); },
  pwaApiSave: el => pwaApiSave(el),
  pwaApiChange: () => { S.pwaApiEdit = true; renderLogin(); },
  pwaShare: () => pwaShareModal()
});
pwaInit();


function init() {
  vizTipInit();
  applyStatic();
  buildRefIdx(LS.get('MED2_REF', null));
  recompute();
  bind();
  renderAll();
  bootstrap();
  readUrlLocation();
}
init();
</script>
